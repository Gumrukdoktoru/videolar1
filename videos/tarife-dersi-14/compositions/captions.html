<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.12" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.8" data-duration="1.92" data-track-index="0"><span><b>14</b>&#x27;üncüsüne hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.72" data-duration="1.4" data-track-index="0"><span>Bugün <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.12" data-duration="3.6" data-track-index="0"><span>lokanta semaveri, kalem fener ve pozisyon sırası.</span></div>
<div id="cap-005" class="cap clip" data-start="11.72" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-006" class="cap clip" data-start="12.72" data-duration="3.307" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-007" class="cap clip" data-start="16.027" data-duration="2.176" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.953" data-duration="1.25" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-009" class="cap clip" data-start="20.233" data-duration="2.64" data-track-index="0"><span>Bir lokantanın mutfağında kullanılmak üzere ithal</span></div>
<div id="cap-010" class="cap clip" data-start="22.873" data-duration="3.12" data-track-index="0"><span>edilen, tezgâh tipi, elektrikle ısıtılan büyük</span></div>
<div id="cap-011" class="cap clip" data-start="25.993" data-duration="3.45" data-track-index="0"><span>çay semaveri hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-012" class="cap clip" data-start="29.673" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="30.633" data-duration="1.84" data-track-index="0"><span><b>84.19</b>.</span></div>
<div id="cap-014" class="cap clip" data-start="32.473" data-duration="0.92" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="33.393" data-duration="1.76" data-track-index="0"><span><b>85.14</b>.</span></div>
<div id="cap-016" class="cap clip" data-start="35.153" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="36.033" data-duration="1.72" data-track-index="0"><span><b>85.16</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="37.753" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-019" class="cap clip" data-start="38.633" data-duration="1.68" data-track-index="0"><span><b>85.43</b>.</span></div>
<div id="cap-020" class="cap clip" data-start="40.313" data-duration="0.84" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="41.153" data-duration="2.03" data-track-index="0"><span><b>94.03</b>.</span></div>
<div id="cap-022" class="cap clip" data-start="43.183" data-duration="1.907" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-023" class="cap clip" data-start="49.44" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-024" class="cap clip" data-start="50.24" data-duration="0.89" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="51.28" data-duration="2.08" data-track-index="0"><span>Elektrikle ısıtılan bir semaver,</span></div>
<div id="cap-026" class="cap clip" data-start="53.36" data-duration="2.76" data-track-index="0"><span><b>ilk bakışta</b> ev tipi elektrikli cihazların yeri</span></div>
<div id="cap-027" class="cap clip" data-start="56.12" data-duration="2.2" data-track-index="0"><span>olan <b>85.16</b>&#x27;yı düşündürür.</span></div>
<div id="cap-028" class="cap clip" data-start="58.32" data-duration="2.48" data-track-index="0"><span>Ama <b>85.16</b>&#x27;nın <b>açıklama notu</b>,</span></div>
<div id="cap-029" class="cap clip" data-start="60.8" data-duration="3.76" data-track-index="0"><span><b>lokantalarda</b> kullanılan tezgâh tipi kahve perkolatörlerini,</span></div>
<div id="cap-030" class="cap clip" data-start="64.56" data-duration="3.84" data-track-index="0"><span>çay ve süt semaverlerini ve normalde <b>evlerde kullanılmayan</b></span></div>
<div id="cap-031" class="cap clip" data-start="68.4" data-duration="2.8" data-track-index="0"><span>diğer elektrotermik cihazları bu pozisyonun dışında</span></div>
<div id="cap-032" class="cap clip" data-start="71.2" data-duration="0.773" data-track-index="0"><span>bırakır.</span></div>
<div id="cap-033" class="cap clip" data-start="71.973" data-duration="4.027" data-track-index="0"><span>Bunlar <b>84.19</b>&#x27;da, <b>ısıtma ve pişirme</b> cihazları arasında</span></div>
<div id="cap-034" class="cap clip" data-start="76.0" data-duration="0.8" data-track-index="0"><span>yer alır.</span></div>
<div id="cap-035" class="cap clip" data-start="76.8" data-duration="1.08" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-036" class="cap clip" data-start="77.88" data-duration="1.48" data-track-index="0"><span><b>84.19</b>.</span></div>
<div id="cap-037" class="cap clip" data-start="79.36" data-duration="3.897" data-track-index="0"><span>Evde kullanılan küçük semaver ise <b>85.16</b>&#x27;da kalır.</span></div>
<div id="cap-038" class="cap clip" data-start="84.087" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-039" class="cap clip" data-start="85.607" data-duration="3.92" data-track-index="0"><span>Cano, elektrikli ısıtıcı ev aletidir diye C şıkkını,</span></div>
<div id="cap-040" class="cap clip" data-start="89.527" data-duration="1.68" data-track-index="0"><span><b>85.16</b>&#x27;yı seçti.</span></div>
<div id="cap-041" class="cap clip" data-start="91.207" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-042" class="cap clip" data-start="92.007" data-duration="3.56" data-track-index="0"><span><b>85.16</b>, normalde evlerde kullanılan türden cihazlar</span></div>
<div id="cap-043" class="cap clip" data-start="95.567" data-duration="0.76" data-track-index="0"><span>içindir;</span></div>
<div id="cap-044" class="cap clip" data-start="96.327" data-duration="3.04" data-track-index="0"><span>lokanta tipi semaver <b>84.19</b>&#x27;dadır.</span></div>
<div id="cap-045" class="cap clip" data-start="99.367" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-046" class="cap clip" data-start="100.407" data-duration="2.8" data-track-index="0"><span>Restoranlarda kullanılmak için tasarlanmış mikrodalga</span></div>
<div id="cap-047" class="cap clip" data-start="103.207" data-duration="2.32" data-track-index="0"><span>fırınlar da <b>85.16</b>&#x27;ya değil,</span></div>
<div id="cap-048" class="cap clip" data-start="105.527" data-duration="1.68" data-track-index="0"><span><b>85.14</b>&#x27;e gider.</span></div>
<div id="cap-049" class="cap clip" data-start="107.207" data-duration="0.8" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-050" class="cap clip" data-start="108.007" data-duration="1.876" data-track-index="0"><span><b>Evde mi</b>, <b>lokantada mı</b>?</span></div>
<div id="cap-051" class="cap clip" data-start="110.633" data-duration="1.33" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-052" class="cap clip" data-start="111.993" data-duration="1.76" data-track-index="0"><span>Bir ucunda tükenmez kalem,</span></div>
<div id="cap-053" class="cap clip" data-start="113.753" data-duration="3.12" data-track-index="0"><span>diğer ucunda pille çalışan küçük bir LED el feneri</span></div>
<div id="cap-054" class="cap clip" data-start="116.873" data-duration="3.04" data-track-index="0"><span>bulunan kalem fener, perakende satışa sunuluyor.</span></div>
<div id="cap-055" class="cap clip" data-start="119.913" data-duration="2.64" data-track-index="0"><span>Eşyanın esas niteliğinin belirlenemediği kabul</span></div>
<div id="cap-056" class="cap clip" data-start="122.553" data-duration="4.09" data-track-index="0"><span>edilirse, hangi kurala göre hangi pozisyonda sınıflandırılır?</span></div>
<div id="cap-057" class="cap clip" data-start="126.713" data-duration="0.81" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-058" class="cap clip" data-start="127.673" data-duration="2.32" data-track-index="0"><span><b>85.13</b>, GYK <b>1</b>.</span></div>
<div id="cap-059" class="cap clip" data-start="129.993" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-060" class="cap clip" data-start="130.953" data-duration="2.48" data-track-index="0"><span><b>85.13</b>, GYK <b>3</b>(b).</span></div>
<div id="cap-061" class="cap clip" data-start="133.433" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-062" class="cap clip" data-start="134.393" data-duration="2.88" data-track-index="0"><span><b>96.08</b>, GYK <b>3</b>(a).</span></div>
<div id="cap-063" class="cap clip" data-start="137.273" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-064" class="cap clip" data-start="138.233" data-duration="2.96" data-track-index="0"><span><b>96.08</b>, GYK <b>3</b>(c).</span></div>
<div id="cap-065" class="cap clip" data-start="141.193" data-duration="0.96" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-066" class="cap clip" data-start="142.153" data-duration="1.717" data-track-index="0"><span>Ayrı ayrı, GYK <b>1</b>.</span></div>
<div id="cap-067" class="cap clip" data-start="144.873" data-duration="1.798" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-068" class="cap clip" data-start="151.021" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-069" class="cap clip" data-start="151.821" data-duration="0.89" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-070" class="cap clip" data-start="152.861" data-duration="2.96" data-track-index="0"><span>Kalem fener, iki ayrı pozisyonda tanımlanan iki</span></div>
<div id="cap-071" class="cap clip" data-start="155.821" data-duration="1.6" data-track-index="0"><span>eşyanın birleşimidir:</span></div>
<div id="cap-072" class="cap clip" data-start="157.421" data-duration="2.56" data-track-index="0"><span>tükenmez kalem <b>96.08</b>&#x27;de,</span></div>
<div id="cap-073" class="cap clip" data-start="159.981" data-duration="3.6" data-track-index="0"><span>kendi pili olan portatif el feneri <b>85.13</b>&#x27;te.</span></div>
<div id="cap-074" class="cap clip" data-start="163.581" data-duration="3.48" data-track-index="0"><span>GYK <b>3</b>(a)&#x27;ya göre iki pozisyon da eşyanın yalnız</span></div>
<div id="cap-075" class="cap clip" data-start="167.061" data-duration="2.6" data-track-index="0"><span>bir kısmını tanımladığı için <b>eşit derecede özel</b></span></div>
<div id="cap-076" class="cap clip" data-start="169.661" data-duration="0.72" data-track-index="0"><span>sayılır.</span></div>
<div id="cap-077" class="cap clip" data-start="170.381" data-duration="2.64" data-track-index="0"><span>GYK <b>3</b>(b) ile <b>esas nitelik</b> aranır;</span></div>
<div id="cap-078" class="cap clip" data-start="173.021" data-duration="2.08" data-track-index="0"><span>ama <b>esas nitelik</b> belirlenemiyor.</span></div>
<div id="cap-079" class="cap clip" data-start="175.101" data-duration="2.4" data-track-index="0"><span>O hâlde GYK <b>3</b>(c) uygulanır;</span></div>
<div id="cap-080" class="cap clip" data-start="177.501" data-duration="2.28" data-track-index="0"><span><b>numara sırasına göre en son</b> pozisyon,</span></div>
<div id="cap-081" class="cap clip" data-start="179.781" data-duration="2.4" data-track-index="0"><span>yani <b>96.08</b> seçilir.</span></div>
<div id="cap-082" class="cap clip" data-start="182.181" data-duration="2.44" data-track-index="0"><span>Ayrı ayrı sınıflandırma ise yanlıştır;</span></div>
<div id="cap-083" class="cap clip" data-start="184.621" data-duration="1.576" data-track-index="0"><span>eşya tek parçadır.</span></div>
<div id="cap-084" class="cap clip" data-start="187.027" data-duration="1.44" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-085" class="cap clip" data-start="188.467" data-duration="2.96" data-track-index="0"><span>Yardımcımız, ışık veren kısım daha önemli diye</span></div>
<div id="cap-086" class="cap clip" data-start="191.427" data-duration="2.56" data-track-index="0"><span>B şıkkını, <b>85.13</b>&#x27;ü seçti.</span></div>
<div id="cap-087" class="cap clip" data-start="193.987" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-088" class="cap clip" data-start="194.787" data-duration="2.56" data-track-index="0"><span>Esas niteliği gerekçesiz seçemezsiniz;</span></div>
<div id="cap-089" class="cap clip" data-start="197.347" data-duration="2.84" data-track-index="0"><span>soru, esas niteliğin belirlenemediğini söylüyor.</span></div>
<div id="cap-090" class="cap clip" data-start="200.187" data-duration="3.2" data-track-index="0"><span>Bu durumda GYK <b>3</b>(c) devreye girer ve numara sırasına</span></div>
<div id="cap-091" class="cap clip" data-start="203.387" data-duration="2.04" data-track-index="0"><span>göre en son pozisyon seçilir.</span></div>
<div id="cap-092" class="cap clip" data-start="205.427" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-093" class="cap clip" data-start="206.467" data-duration="4.0" data-track-index="0"><span><b>3</b>(c)&#x27;ye ancak <b>3</b>(a) ve <b>3</b>(b) sonuç vermezse geçilir;</span></div>
<div id="cap-094" class="cap clip" data-start="210.467" data-duration="1.36" data-track-index="0"><span><b>sıra atlanmaz</b>.</span></div>
<div id="cap-095" class="cap clip" data-start="211.827" data-duration="1.8" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-096" class="cap clip" data-start="213.627" data-duration="3.768" data-track-index="0"><span>Önce <b>3</b>(a), sonra <b>3</b>(b), en son <b>3</b>(c).</span></div>
<div id="cap-097" class="cap clip" data-start="218.145" data-duration="1.05" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-098" class="cap clip" data-start="219.345" data-duration="2.68" data-track-index="0"><span>Aşağıdakilerden hangisinde eşyalar,</span></div>
<div id="cap-099" class="cap clip" data-start="222.025" data-duration="2.68" data-track-index="0"><span>tarife cetvelindeki pozisyon numaralarına göre</span></div>
<div id="cap-100" class="cap clip" data-start="224.705" data-duration="2.65" data-track-index="0"><span>küçükten büyüğe doğru sıralanmıştır?</span></div>
<div id="cap-101" class="cap clip" data-start="227.425" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-102" class="cap clip" data-start="228.465" data-duration="2.08" data-track-index="0"><span>Kolonya, yumurtalı erişte,</span></div>
<div id="cap-103" class="cap clip" data-start="230.545" data-duration="3.21" data-track-index="0"><span>plastik su şişesi, kâğıt alışveriş torbası.</span></div>
<div id="cap-104" class="cap clip" data-start="233.985" data-duration="0.89" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-105" class="cap clip" data-start="235.025" data-duration="2.08" data-track-index="0"><span>Yumurtalı erişte, kolonya,</span></div>
<div id="cap-106" class="cap clip" data-start="237.105" data-duration="1.6" data-track-index="0"><span>kâğıt alışveriş torbası,</span></div>
<div id="cap-107" class="cap clip" data-start="238.705" data-duration="1.76" data-track-index="0"><span>plastik su şişesi.</span></div>
<div id="cap-108" class="cap clip" data-start="240.465" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-109" class="cap clip" data-start="241.425" data-duration="2.24" data-track-index="0"><span>Plastik su şişesi, kolonya,</span></div>
<div id="cap-110" class="cap clip" data-start="243.665" data-duration="2.81" data-track-index="0"><span>yumurtalı erişte, kâğıt alışveriş torbası.</span></div>
<div id="cap-111" class="cap clip" data-start="246.785" data-duration="1.04" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-112" class="cap clip" data-start="247.825" data-duration="2.64" data-track-index="0"><span>Yumurtalı erişte, plastik su şişesi,</span></div>
<div id="cap-113" class="cap clip" data-start="250.465" data-duration="2.72" data-track-index="0"><span>kolonya, kâğıt alışveriş torbası.</span></div>
<div id="cap-114" class="cap clip" data-start="253.185" data-duration="1.04" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-115" class="cap clip" data-start="254.225" data-duration="1.92" data-track-index="0"><span>Yumurtalı erişte, kolonya,</span></div>
<div id="cap-116" class="cap clip" data-start="256.145" data-duration="3.077" data-track-index="0"><span>plastik su şişesi, kâğıt alışveriş torbası.</span></div>
<div id="cap-117" class="cap clip" data-start="259.665" data-duration="1.806" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-118" class="cap clip" data-start="265.821" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-119" class="cap clip" data-start="266.621" data-duration="0.89" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-120" class="cap clip" data-start="267.581" data-duration="2.32" data-track-index="0"><span>Yumurtalı erişte bir <b>makarnadır</b>:</span></div>
<div id="cap-121" class="cap clip" data-start="269.901" data-duration="1.4" data-track-index="0"><span><b>19.02</b>.</span></div>
<div id="cap-122" class="cap clip" data-start="271.301" data-duration="1.96" data-track-index="0"><span>Kolonya bir <b>tuvalet suyudur</b>:</span></div>
<div id="cap-123" class="cap clip" data-start="273.261" data-duration="1.36" data-track-index="0"><span><b>33.03</b>.</span></div>
<div id="cap-124" class="cap clip" data-start="274.621" data-duration="3.32" data-track-index="0"><span>Plastik su şişesi, eşya taşıma ve ambalajlamaya</span></div>
<div id="cap-125" class="cap clip" data-start="277.941" data-duration="1.72" data-track-index="0"><span>mahsus <b>plastik eşyadır</b>:</span></div>
<div id="cap-126" class="cap clip" data-start="279.661" data-duration="1.48" data-track-index="0"><span><b>39.23</b>.</span></div>
<div id="cap-127" class="cap clip" data-start="281.141" data-duration="2.84" data-track-index="0"><span>Kâğıt alışveriş torbası ise kâğıttan torbaların</span></div>
<div id="cap-128" class="cap clip" data-start="283.981" data-duration="2.2" data-track-index="0"><span>yeri olan <b>48.19</b>&#x27;dadır.</span></div>
<div id="cap-129" class="cap clip" data-start="286.181" data-duration="3.09" data-track-index="0"><span>Diğer şıklarda en az bir eşya yanlış yerde.</span></div>
<div id="cap-130" class="cap clip" data-start="290.15" data-duration="1.44" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-131" class="cap clip" data-start="291.59" data-duration="3.2" data-track-index="0"><span>Stajyerimiz, ambalajlar en sona kalır diye torbayı</span></div>
<div id="cap-132" class="cap clip" data-start="294.79" data-duration="2.96" data-track-index="0"><span>şişeden önceye koydu ve B şıkkını seçti.</span></div>
<div id="cap-133" class="cap clip" data-start="297.75" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-134" class="cap clip" data-start="298.55" data-duration="2.32" data-track-index="0"><span>Plastik şişe <b>39</b>. fasılda,</span></div>
<div id="cap-135" class="cap clip" data-start="300.87" data-duration="2.16" data-track-index="0"><span>kâğıt torba <b>48</b>. fasılda;</span></div>
<div id="cap-136" class="cap clip" data-start="303.03" data-duration="2.0" data-track-index="0"><span>plastik, <b>kâğıttan önce</b> gelir.</span></div>
<div id="cap-137" class="cap clip" data-start="305.03" data-duration="0.96" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-138" class="cap clip" data-start="305.99" data-duration="3.28" data-track-index="0"><span>Kolonya alkol içerdiği hâlde <b>22</b>. fasla değil,</span></div>
<div id="cap-139" class="cap clip" data-start="309.27" data-duration="3.92" data-track-index="0"><span><b>33.03</b>&#x27;e, parfümler ve tuvalet suları arasına girer.</span></div>
<div id="cap-140" class="cap clip" data-start="313.19" data-duration="1.69" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-141" class="cap clip" data-start="314.95" data-duration="2.381" data-track-index="0"><span><b>Önce faslı bul</b>, sonra sırala.</span></div>
<div id="cap-142" class="cap clip" data-start="318.161" data-duration="1.12" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-143" class="cap clip" data-start="319.281" data-duration="1.48" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-144" class="cap clip" data-start="320.761" data-duration="0.76" data-track-index="0"><span>Bir:</span></div>
<div id="cap-145" class="cap clip" data-start="321.521" data-duration="2.4" data-track-index="0"><span>Ev tipi mi, lokanta tipi mi diye sorun;</span></div>
<div id="cap-146" class="cap clip" data-start="323.921" data-duration="2.96" data-track-index="0"><span>lokanta semaveri <b>84.19</b>&#x27;dur.</span></div>
<div id="cap-147" class="cap clip" data-start="326.881" data-duration="0.68" data-track-index="0"><span>İki:</span></div>
<div id="cap-148" class="cap clip" data-start="327.561" data-duration="1.92" data-track-index="0"><span>GYK <b>3</b>&#x27;te sıra bozulmaz;</span></div>
<div id="cap-149" class="cap clip" data-start="329.481" data-duration="2.76" data-track-index="0"><span><b>esas nitelik</b> yoksa <b>numara sırasına göre en son</b></span></div>
<div id="cap-150" class="cap clip" data-start="332.241" data-duration="1.44" data-track-index="0"><span>pozisyon seçilir.</span></div>
<div id="cap-151" class="cap clip" data-start="333.681" data-duration="0.68" data-track-index="0"><span>Üç:</span></div>
<div id="cap-152" class="cap clip" data-start="334.361" data-duration="2.68" data-track-index="0"><span>Sıralamada önce her eşyanın faslını bulun,</span></div>
<div id="cap-153" class="cap clip" data-start="337.041" data-duration="1.93" data-track-index="0"><span>sonra küçükten büyüğe dizin.</span></div>
<div id="cap-154" class="cap clip" data-start="339.77" data-duration="1.68" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-155" class="cap clip" data-start="341.45" data-duration="2.72" data-track-index="0"><span>Birinci soru A, ikinci soru D,</span></div>
<div id="cap-156" class="cap clip" data-start="344.17" data-duration="1.29" data-track-index="0"><span>üçüncü soru E.</span></div>
<div id="cap-157" class="cap clip" data-start="345.53" data-duration="1.44" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-158" class="cap clip" data-start="346.97" data-duration="1.12" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-159" class="cap clip" data-start="348.09" data-duration="3.36" data-track-index="0"><span>Böylece tarife derslerinin <b>14</b>&#x27;üncüsünü de tamamladık.</span></div>
<div id="cap-160" class="cap clip" data-start="351.45" data-duration="2.96" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-161" class="cap clip" data-start="354.41" data-duration="0.747" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-162" class="cap clip" data-start="355.157" data-duration="1.813" data-track-index="0"><span>Bir sonraki derste görüşmek üzere.</span></div>
<div id="cap-163" class="cap clip" data-start="356.97" data-duration="0.996" data-track-index="0"><span>Hoşça kalın!</span></div>
