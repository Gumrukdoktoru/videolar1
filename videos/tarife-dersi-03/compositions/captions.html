<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.13" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.81" data-duration="1.63" data-track-index="0"><span>üçüncüsüne hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.44" data-duration="1.71" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.15" data-duration="3.23" data-track-index="0"><span><b>yatak takımı eşyası</b>, deniz memelilerinin eti ve</span></div>
<div id="cap-005" class="cap clip" data-start="11.38" data-duration="1.7" data-track-index="0"><span><b>paten takılmış botlar</b>.</span></div>
<div id="cap-006" class="cap clip" data-start="13.08" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="14.08" data-duration="3.48" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="17.56" data-duration="2.21" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="20.546" data-duration="1.25" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="21.826" data-duration="2.76" data-track-index="0"><span>Dış yüzü pamuklu dokunmuş mensucattan,</span></div>
<div id="cap-011" class="cap clip" data-start="24.586" data-duration="2.92" data-track-index="0"><span>içi kaz tüyüyle doldurulmuş yorgan hangi tarife</span></div>
<div id="cap-012" class="cap clip" data-start="27.506" data-duration="2.01" data-track-index="0"><span>pozisyonunda sınıflandırılır?</span></div>
<div id="cap-013" class="cap clip" data-start="29.586" data-duration="1.08" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-014" class="cap clip" data-start="30.666" data-duration="1.72" data-track-index="0"><span><b>63.01</b>.</span></div>
<div id="cap-015" class="cap clip" data-start="32.386" data-duration="1.0" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-016" class="cap clip" data-start="33.386" data-duration="1.64" data-track-index="0"><span><b>63.02</b>.</span></div>
<div id="cap-017" class="cap clip" data-start="35.026" data-duration="1.0" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-018" class="cap clip" data-start="36.026" data-duration="1.8" data-track-index="0"><span><b>94.04</b>.</span></div>
<div id="cap-019" class="cap clip" data-start="37.826" data-duration="1.04" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-020" class="cap clip" data-start="38.866" data-duration="1.76" data-track-index="0"><span><b>52.08</b>.</span></div>
<div id="cap-021" class="cap clip" data-start="40.626" data-duration="0.96" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-022" class="cap clip" data-start="41.586" data-duration="1.45" data-track-index="0"><span><b>05.05</b>.</span></div>
<div id="cap-023" class="cap clip" data-start="43.426" data-duration="1.899" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-024" class="cap clip" data-start="49.675" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-025" class="cap clip" data-start="50.475" data-duration="1.04" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-026" class="cap clip" data-start="51.515" data-duration="3.44" data-track-index="0"><span>Bu eşya, içi <b>doldurulmuş</b> bir <b>yatak takımı eşyası</b>.</span></div>
<div id="cap-027" class="cap clip" data-start="54.955" data-duration="2.24" data-track-index="0"><span><b>94.04</b> pozisyonu;</span></div>
<div id="cap-028" class="cap clip" data-start="57.195" data-duration="3.76" data-track-index="0"><span>şilteleri, yorganları, yastıkları ve <b>uyku tulumlarını</b>,</span></div>
<div id="cap-029" class="cap clip" data-start="60.955" data-duration="2.48" data-track-index="0"><span>içleri herhangi bir maddeyle <b>doldurulmuş</b> olarak</span></div>
<div id="cap-030" class="cap clip" data-start="63.435" data-duration="0.68" data-track-index="0"><span>kapsar;</span></div>
<div id="cap-031" class="cap clip" data-start="64.115" data-duration="1.907" data-track-index="0"><span><b>kaplanmış olsun olmasın</b>.</span></div>
<div id="cap-032" class="cap clip" data-start="66.022" data-duration="3.093" data-track-index="0"><span>Yani dış yüzün pamuklu olması sonucu değiştirmez.</span></div>
<div id="cap-033" class="cap clip" data-start="69.115" data-duration="2.48" data-track-index="0"><span>Belirleyici olan, <b>dolgulu</b> <b>yatak takımı eşyası</b></span></div>
<div id="cap-034" class="cap clip" data-start="71.595" data-duration="1.004" data-track-index="0"><span>olmasıdır.</span></div>
<div id="cap-035" class="cap clip" data-start="73.429" data-duration="1.44" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-036" class="cap clip" data-start="74.869" data-duration="3.76" data-track-index="0"><span>Yardımcımız, dış yüzü pamuklu diye <b>63.01</b>&#x27;i,</span></div>
<div id="cap-037" class="cap clip" data-start="78.629" data-duration="1.84" data-track-index="0"><span>yani <b>battaniyeleri</b> seçti.</span></div>
<div id="cap-038" class="cap clip" data-start="80.469" data-duration="0.693" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-039" class="cap clip" data-start="81.162" data-duration="1.76" data-track-index="0"><span>Battaniye <b>dolgulu</b> değildir;</span></div>
<div id="cap-040" class="cap clip" data-start="82.922" data-duration="3.027" data-track-index="0"><span>içi <b>doldurulmuş</b> yorgan <b>94.04</b>&#x27;tedir.</span></div>
<div id="cap-041" class="cap clip" data-start="85.949" data-duration="0.653" data-track-index="0"><span><b>Dikkat:</b></span></div>
<div id="cap-042" class="cap clip" data-start="86.602" data-duration="2.0" data-track-index="0"><span><b>Uyku tulumları</b> da aynı pozisyonda,</span></div>
<div id="cap-043" class="cap clip" data-start="88.602" data-duration="1.84" data-track-index="0"><span><b>94.04</b>&#x27;te yer alır.</span></div>
<div id="cap-044" class="cap clip" data-start="90.442" data-duration="3.036" data-track-index="0"><span>Dolgu varsa, önce <b>94.04</b>&#x27;e bakın.</span></div>
<div id="cap-045" class="cap clip" data-start="94.228" data-duration="1.28" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-046" class="cap clip" data-start="95.508" data-duration="2.92" data-track-index="0"><span>Dondurulmuş fok eti hangi tarife pozisyonunda</span></div>
<div id="cap-047" class="cap clip" data-start="98.428" data-duration="1.24" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-048" class="cap clip" data-start="99.668" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-049" class="cap clip" data-start="100.628" data-duration="1.92" data-track-index="0"><span><b>02.08</b>.</span></div>
<div id="cap-050" class="cap clip" data-start="102.548" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-051" class="cap clip" data-start="103.508" data-duration="1.72" data-track-index="0"><span><b>03.03</b>.</span></div>
<div id="cap-052" class="cap clip" data-start="105.228" data-duration="0.92" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-053" class="cap clip" data-start="106.148" data-duration="1.8" data-track-index="0"><span><b>02.06</b>.</span></div>
<div id="cap-054" class="cap clip" data-start="107.948" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-055" class="cap clip" data-start="108.828" data-duration="1.56" data-track-index="0"><span><b>16.02</b>.</span></div>
<div id="cap-056" class="cap clip" data-start="110.388" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-057" class="cap clip" data-start="111.268" data-duration="1.53" data-track-index="0"><span><b>03.04</b>.</span></div>
<div id="cap-058" class="cap clip" data-start="113.228" data-duration="1.89" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-059" class="cap clip" data-start="119.517" data-duration="0.73" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-060" class="cap clip" data-start="120.317" data-duration="0.96" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-061" class="cap clip" data-start="121.277" data-duration="2.64" data-track-index="0"><span>Fok bir deniz canlısı ama <b>balık değil</b>,</span></div>
<div id="cap-062" class="cap clip" data-start="123.917" data-duration="1.28" data-track-index="0"><span><b>memeli</b> bir hayvan.</span></div>
<div id="cap-063" class="cap clip" data-start="125.197" data-duration="2.16" data-track-index="0"><span><b>3</b>. fasıl yalnızca balıkları,</span></div>
<div id="cap-064" class="cap clip" data-start="127.357" data-duration="2.72" data-track-index="0"><span>kabuklu hayvanları ve yumuşakçaları kapsar.</span></div>
<div id="cap-065" class="cap clip" data-start="130.077" data-duration="3.84" data-track-index="0"><span><b>Deniz memelilerinin</b> etleri ise <b>02.08</b> pozisyonunda,</span></div>
<div id="cap-066" class="cap clip" data-start="133.917" data-duration="1.72" data-track-index="0"><span>diğer etler arasında yer alır.</span></div>
<div id="cap-067" class="cap clip" data-start="135.637" data-duration="2.52" data-track-index="0"><span>Alt pozisyon metni bunları tek tek sayar:</span></div>
<div id="cap-068" class="cap clip" data-start="138.157" data-duration="2.24" data-track-index="0"><span>balinalar, yunuslar, foklar,</span></div>
<div id="cap-069" class="cap clip" data-start="140.397" data-duration="2.358" data-track-index="0"><span>deniz aslanları ve deniz aygırları.</span></div>
<div id="cap-070" class="cap clip" data-start="143.665" data-duration="3.76" data-track-index="0"><span>Cano ise denizden çıkıyor diye <b>03.03</b>&#x27;ü,</span></div>
<div id="cap-071" class="cap clip" data-start="147.425" data-duration="1.84" data-track-index="0"><span>dondurulmuş balıkları seçti.</span></div>
<div id="cap-072" class="cap clip" data-start="149.265" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-073" class="cap clip" data-start="150.065" data-duration="2.32" data-track-index="0"><span>Denizde yaşamak balık olmak demek değil;</span></div>
<div id="cap-074" class="cap clip" data-start="152.385" data-duration="2.347" data-track-index="0"><span>fok <b>memelidir</b>, eti <b>2</b>. fasılda.</span></div>
<div id="cap-075" class="cap clip" data-start="154.732" data-duration="0.933" data-track-index="0"><span>Bir de dikkat:</span></div>
<div id="cap-076" class="cap clip" data-start="155.665" data-duration="2.68" data-track-index="0"><span><b>Deniz memelilerinin</b> <b>yağları</b> etleriyle gitmez;</span></div>
<div id="cap-077" class="cap clip" data-start="158.345" data-duration="3.04" data-track-index="0"><span><b>15.04</b> pozisyonunda, balık yağlarıyla birlikte</span></div>
<div id="cap-078" class="cap clip" data-start="161.385" data-duration="1.204" data-track-index="0"><span>sınıflandırılır.</span></div>
<div id="cap-079" class="cap clip" data-start="163.339" data-duration="1.25" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-080" class="cap clip" data-start="164.619" data-duration="2.64" data-track-index="0"><span>Altına buz pateni bıçağı sökülemeyecek şekilde</span></div>
<div id="cap-081" class="cap clip" data-start="167.259" data-duration="2.16" data-track-index="0"><span>tutturulmuş, üst kısmı deri,</span></div>
<div id="cap-082" class="cap clip" data-start="169.419" data-duration="2.88" data-track-index="0"><span>dış tabanı kauçuk bot hangi tarife pozisyonunda</span></div>
<div id="cap-083" class="cap clip" data-start="172.299" data-duration="1.37" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-084" class="cap clip" data-start="173.739" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-085" class="cap clip" data-start="174.619" data-duration="1.6" data-track-index="0"><span><b>64.03</b>.</span></div>
<div id="cap-086" class="cap clip" data-start="176.219" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-087" class="cap clip" data-start="177.099" data-duration="1.72" data-track-index="0"><span><b>64.02</b>.</span></div>
<div id="cap-088" class="cap clip" data-start="178.819" data-duration="0.8" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-089" class="cap clip" data-start="179.619" data-duration="1.72" data-track-index="0"><span><b>95.03</b>.</span></div>
<div id="cap-090" class="cap clip" data-start="181.339" data-duration="0.8" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-091" class="cap clip" data-start="182.139" data-duration="1.68" data-track-index="0"><span><b>64.06</b>.</span></div>
<div id="cap-092" class="cap clip" data-start="183.819" data-duration="0.84" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-093" class="cap clip" data-start="184.659" data-duration="1.88" data-track-index="0"><span><b>95.06</b>.</span></div>
<div id="cap-094" class="cap clip" data-start="186.539" data-duration="1.814" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-095" class="cap clip" data-start="192.703" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-096" class="cap clip" data-start="193.503" data-duration="0.89" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-097" class="cap clip" data-start="194.543" data-duration="3.04" data-track-index="0"><span>Normalde deri yüzlü, kauçuk tabanlı bir ayakkabı</span></div>
<div id="cap-098" class="cap clip" data-start="197.583" data-duration="1.72" data-track-index="0"><span><b>64.03</b>&#x27;e gider.</span></div>
<div id="cap-099" class="cap clip" data-start="199.303" data-duration="4.04" data-track-index="0"><span>Ama <b>64</b>. faslın notu, <b>paten takılmış botları</b> açıkça</span></div>
<div id="cap-100" class="cap clip" data-start="203.343" data-duration="2.92" data-track-index="0"><span><b>hariç tutar</b> ve <b>95</b>. fasla gönderir.</span></div>
<div id="cap-101" class="cap clip" data-start="206.263" data-duration="3.76" data-track-index="0"><span><b>95.06</b> pozisyonunun alt pozisyonu da bunu yazar:</span></div>
<div id="cap-102" class="cap clip" data-start="210.023" data-duration="2.36" data-track-index="0"><span>buz patenleri ve tekerlekli patenler,</span></div>
<div id="cap-103" class="cap clip" data-start="212.383" data-duration="2.04" data-track-index="0"><span><b>paten takılmış botlar</b> dahil.</span></div>
<div id="cap-104" class="cap clip" data-start="214.423" data-duration="2.96" data-track-index="0"><span><b>Fasıl notu</b>, ayakkabı pozisyonlarının kapsamını</span></div>
<div id="cap-105" class="cap clip" data-start="217.383" data-duration="0.883" data-track-index="0"><span>sınırlar.</span></div>
<div id="cap-106" class="cap clip" data-start="219.176" data-duration="4.0" data-track-index="0"><span>Stajyerimiz, üstü deri diye <b>64.03</b>&#x27;ü seçti.</span></div>
<div id="cap-107" class="cap clip" data-start="223.176" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-108" class="cap clip" data-start="223.976" data-duration="2.4" data-track-index="0"><span>Paten takılı olduğu için bu bot artık ayakkabı</span></div>
<div id="cap-109" class="cap clip" data-start="226.376" data-duration="1.64" data-track-index="0"><span>değil, <b>spor eşyası</b>.</span></div>
<div id="cap-110" class="cap clip" data-start="228.016" data-duration="2.0" data-track-index="0"><span>Gümrükçü Baba&#x27;nın ayrımı net:</span></div>
<div id="cap-111" class="cap clip" data-start="230.016" data-duration="3.053" data-track-index="0"><span>Patensiz paten botu <b>64</b>. fasılda kalır;</span></div>
<div id="cap-112" class="cap clip" data-start="233.069" data-duration="3.667" data-track-index="0"><span>bıçak ya da tekerlek takılıysa <b>95.06</b>&#x27;ya gider.</span></div>
<div id="cap-113" class="cap clip" data-start="236.736" data-duration="3.611" data-track-index="0"><span><b>Oyuncak</b> karakterli ayakkabılar ise <b>95.03</b>&#x27;tedir.</span></div>
<div id="cap-114" class="cap clip" data-start="241.284" data-duration="1.013" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-115" class="cap clip" data-start="242.297" data-duration="1.48" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-116" class="cap clip" data-start="243.777" data-duration="0.72" data-track-index="0"><span>Bir:</span></div>
<div id="cap-117" class="cap clip" data-start="244.497" data-duration="2.32" data-track-index="0"><span>İçi <b>doldurulmuş</b> <b>yatak takımı eşyası</b>,</span></div>
<div id="cap-118" class="cap clip" data-start="246.817" data-duration="3.6" data-track-index="0"><span>dış yüzü ne olursa olsun <b>94.04</b>&#x27;e gider.</span></div>
<div id="cap-119" class="cap clip" data-start="250.417" data-duration="0.76" data-track-index="0"><span>İki:</span></div>
<div id="cap-120" class="cap clip" data-start="251.177" data-duration="1.52" data-track-index="0"><span>Hayvanın yaşadığı yere değil,</span></div>
<div id="cap-121" class="cap clip" data-start="252.697" data-duration="0.96" data-track-index="0"><span>türüne bakın;</span></div>
<div id="cap-122" class="cap clip" data-start="253.657" data-duration="2.16" data-track-index="0"><span><b>deniz memelisi</b> <b>balık değildir</b>.</span></div>
<div id="cap-123" class="cap clip" data-start="255.817" data-duration="0.68" data-track-index="0"><span>Üç:</span></div>
<div id="cap-124" class="cap clip" data-start="256.497" data-duration="2.08" data-track-index="0"><span><b>Fasıl notları</b> kapsamı belirler;</span></div>
<div id="cap-125" class="cap clip" data-start="258.577" data-duration="2.963" data-track-index="0"><span>paten takılı bot, ayakkabı faslından çıkar.</span></div>
<div id="cap-126" class="cap clip" data-start="262.29" data-duration="1.76" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-127" class="cap clip" data-start="264.05" data-duration="2.96" data-track-index="0"><span>Birinci soru C, ikinci soru A,</span></div>
<div id="cap-128" class="cap clip" data-start="267.01" data-duration="1.52" data-track-index="0"><span>üçüncü soru E.</span></div>
<div id="cap-129" class="cap clip" data-start="268.53" data-duration="1.36" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-130" class="cap clip" data-start="269.89" data-duration="1.04" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-131" class="cap clip" data-start="270.93" data-duration="3.12" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
