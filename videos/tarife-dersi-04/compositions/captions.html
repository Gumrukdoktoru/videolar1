<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.04" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.72" data-duration="1.84" data-track-index="0"><span>dördüncüsüne hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.56" data-duration="1.48" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.04" data-duration="3.68" data-track-index="0"><span><b>çakmak taşları</b>, konteynerler ve alkolsüz içecekler.</span></div>
<div id="cap-005" class="cap clip" data-start="11.72" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-006" class="cap clip" data-start="12.72" data-duration="3.24" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-007" class="cap clip" data-start="15.96" data-duration="2.164" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.874" data-duration="1.25" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-009" class="cap clip" data-start="20.154" data-duration="2.76" data-track-index="0"><span>Çakmaklarda kullanılmak üzere küçük silindirler</span></div>
<div id="cap-010" class="cap clip" data-start="22.914" data-duration="3.4" data-track-index="0"><span>hâlinde hazırlanmış, ferroseryum alaşımından çakmak</span></div>
<div id="cap-011" class="cap clip" data-start="26.314" data-duration="3.37" data-track-index="0"><span>taşları hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-012" class="cap clip" data-start="29.754" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="30.634" data-duration="1.68" data-track-index="0"><span><b>96.13</b>.</span></div>
<div id="cap-014" class="cap clip" data-start="32.314" data-duration="0.933" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="33.247" data-duration="1.747" data-track-index="0"><span><b>28.46</b>.</span></div>
<div id="cap-016" class="cap clip" data-start="34.994" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="35.954" data-duration="1.56" data-track-index="0"><span><b>72.02</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="37.514" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-019" class="cap clip" data-start="38.474" data-duration="1.68" data-track-index="0"><span><b>36.06</b>.</span></div>
<div id="cap-020" class="cap clip" data-start="40.154" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="41.034" data-duration="1.92" data-track-index="0"><span><b>38.24</b>.</span></div>
<div id="cap-022" class="cap clip" data-start="42.954" data-duration="1.93" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-023" class="cap clip" data-start="49.283" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-024" class="cap clip" data-start="50.163" data-duration="1.0" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="51.163" data-duration="3.76" data-track-index="0"><span><b>96.13</b> pozisyonu çakmakları ve aksamını kapsar;</span></div>
<div id="cap-026" class="cap clip" data-start="54.923" data-duration="1.68" data-track-index="0"><span>ama metni açıkça yazar:</span></div>
<div id="cap-027" class="cap clip" data-start="56.603" data-duration="2.56" data-track-index="0"><span><b>çakmak taşları</b> ve fitilleri <b>hariç</b>.</span></div>
<div id="cap-028" class="cap clip" data-start="59.163" data-duration="2.48" data-track-index="0"><span><b>Ferroseryum</b> ve diğer <b>piroforik</b> alaşımlar,</span></div>
<div id="cap-029" class="cap clip" data-start="61.643" data-duration="2.68" data-track-index="0"><span>yani sürtünce kıvılcım çıkaran alaşımlar,</span></div>
<div id="cap-030" class="cap clip" data-start="64.323" data-duration="2.48" data-track-index="0"><span><b>36.06</b> pozisyonunda yer alır;</span></div>
<div id="cap-031" class="cap clip" data-start="66.803" data-duration="3.654" data-track-index="0"><span>her şekilde ve perakende ambalajda olsun olmasın.</span></div>
<div id="cap-032" class="cap clip" data-start="71.287" data-duration="1.36" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-033" class="cap clip" data-start="72.647" data-duration="3.6" data-track-index="0"><span>Cano, adında ferro geçiyor diye <b>72.02</b>&#x27;yi,</span></div>
<div id="cap-034" class="cap clip" data-start="76.247" data-duration="1.52" data-track-index="0"><span>ferro alyajları seçti.</span></div>
<div id="cap-035" class="cap clip" data-start="77.767" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-036" class="cap clip" data-start="78.567" data-duration="2.56" data-track-index="0"><span><b>İsme değil</b>, tarife metnine bakılır;</span></div>
<div id="cap-037" class="cap clip" data-start="81.127" data-duration="3.32" data-track-index="0"><span><b>ferroseryum</b> açıkça <b>36.06</b>&#x27;da sayılır.</span></div>
<div id="cap-038" class="cap clip" data-start="84.447" data-duration="0.88" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-039" class="cap clip" data-start="85.327" data-duration="2.88" data-track-index="0"><span>Çakmağın parçası olan doldurulabilir gaz <b>kartuşu</b></span></div>
<div id="cap-040" class="cap clip" data-start="88.207" data-duration="1.693" data-track-index="0"><span><b>96.13</b>&#x27;te kalır;</span></div>
<div id="cap-041" class="cap clip" data-start="89.9" data-duration="3.147" data-track-index="0"><span>ama <b>300</b> cm³&#x27;ü geçmeyen kaplarda satılan çakmak</span></div>
<div id="cap-042" class="cap clip" data-start="93.047" data-duration="2.286" data-track-index="0"><span>gazı <b>36.06</b>&#x27;ya gider.</span></div>
<div id="cap-043" class="cap clip" data-start="96.083" data-duration="1.2" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-044" class="cap clip" data-start="97.283" data-duration="3.36" data-track-index="0"><span>Alüminyumdan yapılmış, kara ve hava yoluyla taşımaya</span></div>
<div id="cap-045" class="cap clip" data-start="100.643" data-duration="1.96" data-track-index="0"><span>göre özel olarak donatılmış,</span></div>
<div id="cap-046" class="cap clip" data-start="102.603" data-duration="2.44" data-track-index="0"><span>kancaları ve küçük tekerlekleri bulunan,</span></div>
<div id="cap-047" class="cap clip" data-start="105.043" data-duration="3.04" data-track-index="0"><span>bozulabilir gıdalar için yalıtımlı konteyner hangi</span></div>
<div id="cap-048" class="cap clip" data-start="108.083" data-duration="2.17" data-track-index="0"><span>tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-049" class="cap clip" data-start="110.483" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-050" class="cap clip" data-start="111.443" data-duration="1.84" data-track-index="0"><span><b>86.09</b>.</span></div>
<div id="cap-051" class="cap clip" data-start="113.283" data-duration="1.0" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-052" class="cap clip" data-start="114.283" data-duration="1.48" data-track-index="0"><span><b>76.11</b>.</span></div>
<div id="cap-053" class="cap clip" data-start="115.763" data-duration="1.0" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-054" class="cap clip" data-start="116.763" data-duration="1.56" data-track-index="0"><span><b>76.12</b>.</span></div>
<div id="cap-055" class="cap clip" data-start="118.323" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-056" class="cap clip" data-start="119.203" data-duration="1.76" data-track-index="0"><span><b>84.18</b>.</span></div>
<div id="cap-057" class="cap clip" data-start="120.963" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-058" class="cap clip" data-start="121.843" data-duration="1.53" data-track-index="0"><span><b>87.16</b>.</span></div>
<div id="cap-059" class="cap clip" data-start="124.163" data-duration="1.819" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-060" class="cap clip" data-start="130.332" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-061" class="cap clip" data-start="131.132" data-duration="1.08" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-062" class="cap clip" data-start="132.212" data-duration="4.12" data-track-index="0"><span><b>86.09</b>, bir veya daha fazla taşıma şekline göre</span></div>
<div id="cap-063" class="cap clip" data-start="136.332" data-duration="2.6" data-track-index="0"><span>özel olarak yapılmış ve donatılmış <b>konteynerleri</b></span></div>
<div id="cap-064" class="cap clip" data-start="138.932" data-duration="0.76" data-track-index="0"><span>kapsar.</span></div>
<div id="cap-065" class="cap clip" data-start="139.692" data-duration="1.8" data-track-index="0"><span>Yapıldığı <b>madde önemli değil</b>;</span></div>
<div id="cap-066" class="cap clip" data-start="141.492" data-duration="1.64" data-track-index="0"><span>metal ya da ahşap olabilir.</span></div>
<div id="cap-067" class="cap clip" data-start="143.132" data-duration="3.52" data-track-index="0"><span>İzahname, bozulabilir gıdalar için <b>yalıtımlı</b> <b>konteynerleri</b></span></div>
<div id="cap-068" class="cap clip" data-start="146.652" data-duration="1.2" data-track-index="0"><span>de açıkça sayar.</span></div>
<div id="cap-069" class="cap clip" data-start="147.852" data-duration="3.12" data-track-index="0"><span>Kancalar, halkalar ve tekerlekler gibi donanım,</span></div>
<div id="cap-070" class="cap clip" data-start="150.972" data-duration="2.363" data-track-index="0"><span>eşyanın konteyner olduğunu gösterir.</span></div>
<div id="cap-071" class="cap clip" data-start="154.245" data-duration="3.85" data-track-index="0"><span>Yardımcımız, alüminyum diye <b>76.11</b>&#x27;i,</span></div>
<div id="cap-072" class="cap clip" data-start="158.165" data-duration="1.68" data-track-index="0"><span>alüminyum depoları seçti.</span></div>
<div id="cap-073" class="cap clip" data-start="159.845" data-duration="0.73" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-074" class="cap clip" data-start="160.645" data-duration="2.0" data-track-index="0"><span>Konteynerler maddeye göre değil,</span></div>
<div id="cap-075" class="cap clip" data-start="162.645" data-duration="2.8" data-track-index="0"><span>taşımacılıktaki <b>işlevine</b> göre sınıflandırılır.</span></div>
<div id="cap-076" class="cap clip" data-start="165.445" data-duration="0.84" data-track-index="0"><span><b>Dikkat:</b></span></div>
<div id="cap-077" class="cap clip" data-start="166.285" data-duration="2.92" data-track-index="0"><span>Sıvı taşınan <b>tank konteynerler</b> ise ancak taşıta</span></div>
<div id="cap-078" class="cap clip" data-start="169.205" data-duration="3.2" data-track-index="0"><span>göre yapılıp bir destekle taşıta bağlanacak şekildeyse</span></div>
<div id="cap-079" class="cap clip" data-start="172.405" data-duration="1.92" data-track-index="0"><span><b>86.09</b>&#x27;a girer;</span></div>
<div id="cap-080" class="cap clip" data-start="174.325" data-duration="2.998" data-track-index="0"><span>değilse yapıldığı maddeye göre sınıflandırılır.</span></div>
<div id="cap-081" class="cap clip" data-start="178.073" data-duration="1.25" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-082" class="cap clip" data-start="179.353" data-duration="3.0" data-track-index="0"><span>Hacmen <b>%0,4</b> alkol içeren,</span></div>
<div id="cap-083" class="cap clip" data-start="182.353" data-duration="2.92" data-track-index="0"><span>maltlı alkolsüz bira hangi tarife pozisyonunda</span></div>
<div id="cap-084" class="cap clip" data-start="185.273" data-duration="1.33" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-085" class="cap clip" data-start="186.633" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-086" class="cap clip" data-start="187.513" data-duration="1.6" data-track-index="0"><span><b>22.03</b>.</span></div>
<div id="cap-087" class="cap clip" data-start="189.113" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-088" class="cap clip" data-start="189.993" data-duration="1.72" data-track-index="0"><span><b>22.06</b>.</span></div>
<div id="cap-089" class="cap clip" data-start="191.713" data-duration="0.84" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-090" class="cap clip" data-start="192.553" data-duration="1.72" data-track-index="0"><span><b>22.02</b>.</span></div>
<div id="cap-091" class="cap clip" data-start="194.273" data-duration="0.84" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-092" class="cap clip" data-start="195.113" data-duration="1.6" data-track-index="0"><span><b>22.01</b>.</span></div>
<div id="cap-093" class="cap clip" data-start="196.713" data-duration="0.96" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-094" class="cap clip" data-start="197.673" data-duration="1.68" data-track-index="0"><span><b>20.09</b>.</span></div>
<div id="cap-095" class="cap clip" data-start="199.353" data-duration="1.879" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-096" class="cap clip" data-start="205.582" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-097" class="cap clip" data-start="206.462" data-duration="0.89" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-098" class="cap clip" data-start="207.502" data-duration="2.0" data-track-index="0"><span><b>22</b>. faslın notuna göre,</span></div>
<div id="cap-099" class="cap clip" data-start="209.502" data-duration="2.92" data-track-index="0"><span><b>22.02</b> anlamında <b>alkolsüz içecek</b>,</span></div>
<div id="cap-100" class="cap clip" data-start="212.422" data-duration="4.32" data-track-index="0"><span>hacmen alkol derecesi <b>%0,5</b>&#x27;i geçmeyen içecektir.</span></div>
<div id="cap-101" class="cap clip" data-start="216.742" data-duration="2.92" data-track-index="0"><span>Bu bira <b>%0,4</b> alkol içeriyor;</span></div>
<div id="cap-102" class="cap clip" data-start="219.662" data-duration="1.4" data-track-index="0"><span>yani <b>sınırın altında</b>.</span></div>
<div id="cap-103" class="cap clip" data-start="221.062" data-duration="2.96" data-track-index="0"><span>Üstelik alt pozisyon metni bunu adıyla sayar:</span></div>
<div id="cap-104" class="cap clip" data-start="224.022" data-duration="1.32" data-track-index="0"><span><b>alkolsüz biralar</b>.</span></div>
<div id="cap-105" class="cap clip" data-start="225.342" data-duration="3.164" data-track-index="0"><span>Alkol derecesi <b>20</b> derece sıcaklıkta ölçülür.</span></div>
<div id="cap-106" class="cap clip" data-start="229.416" data-duration="4.08" data-track-index="0"><span>Stajyerimiz, bira yazıyor diye <b>22.03</b>&#x27;ü seçti.</span></div>
<div id="cap-107" class="cap clip" data-start="233.496" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-108" class="cap clip" data-start="234.296" data-duration="2.16" data-track-index="0"><span>Alkol derecesi sınırın altındaysa,</span></div>
<div id="cap-109" class="cap clip" data-start="236.456" data-duration="2.267" data-track-index="0"><span>bira da olsa alkolsüz içecektir.</span></div>
<div id="cap-110" class="cap clip" data-start="238.723" data-duration="1.853" data-track-index="0"><span>Gümrükçü Baba&#x27;nın ölçüsü net:</span></div>
<div id="cap-111" class="cap clip" data-start="240.576" data-duration="3.44" data-track-index="0"><span><b>%0,5</b> ve altı <b>22.02</b>;</span></div>
<div id="cap-112" class="cap clip" data-start="244.016" data-duration="2.96" data-track-index="0"><span>üstü, yani alkollü biralar <b>22.03</b>.</span></div>
<div id="cap-113" class="cap clip" data-start="246.976" data-duration="1.533" data-track-index="0"><span><b>Sınır değerini</b> iyi bilin;</span></div>
<div id="cap-114" class="cap clip" data-start="248.509" data-duration="2.47" data-track-index="0"><span>sorular tam sınırın etrafında gezer.</span></div>
<div id="cap-115" class="cap clip" data-start="251.809" data-duration="0.97" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-116" class="cap clip" data-start="252.929" data-duration="1.56" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-117" class="cap clip" data-start="254.489" data-duration="0.733" data-track-index="0"><span>Bir:</span></div>
<div id="cap-118" class="cap clip" data-start="255.222" data-duration="3.027" data-track-index="0"><span>Pozisyon metnindeki <b>hariç</b> ifadesini atlamayın;</span></div>
<div id="cap-119" class="cap clip" data-start="258.249" data-duration="2.84" data-track-index="0"><span>çakmak taşı çakmak pozisyonundan çıkar.</span></div>
<div id="cap-120" class="cap clip" data-start="261.089" data-duration="0.68" data-track-index="0"><span>İki:</span></div>
<div id="cap-121" class="cap clip" data-start="261.769" data-duration="2.28" data-track-index="0"><span>Konteyner, yapıldığı maddeyle değil,</span></div>
<div id="cap-122" class="cap clip" data-start="264.049" data-duration="2.4" data-track-index="0"><span>taşımacılıktaki işleviyle tanınır.</span></div>
<div id="cap-123" class="cap clip" data-start="266.449" data-duration="0.64" data-track-index="0"><span>Üç:</span></div>
<div id="cap-124" class="cap clip" data-start="267.089" data-duration="2.48" data-track-index="0"><span>Sayısal sınırlar fasıl notlarında yazar;</span></div>
<div id="cap-125" class="cap clip" data-start="269.569" data-duration="3.569" data-track-index="0"><span>alkolsüz içecekte sınır <b>%0,5</b>.</span></div>
<div id="cap-126" class="cap clip" data-start="273.888" data-duration="1.76" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-127" class="cap clip" data-start="275.648" data-duration="2.76" data-track-index="0"><span>Birinci soru D, ikinci soru A,</span></div>
<div id="cap-128" class="cap clip" data-start="278.408" data-duration="1.25" data-track-index="0"><span>üçüncü soru C.</span></div>
<div id="cap-129" class="cap clip" data-start="279.728" data-duration="1.36" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-130" class="cap clip" data-start="281.088" data-duration="1.04" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-131" class="cap clip" data-start="282.128" data-duration="3.08" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
