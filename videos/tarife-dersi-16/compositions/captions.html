      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="358.91">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.12" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.8" data-duration="2.0" data-track-index="0"><span><b>16</b>&#x27;ncısına hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.8" data-duration="1.36" data-track-index="0"><span>Bugün <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.16" data-duration="3.28" data-track-index="0"><span>satış otomatları, araba krikosu ve aspirin.</span></div>
<div id="cap-005" class="cap clip" data-start="11.44" data-duration="0.96" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-006" class="cap clip" data-start="12.4" data-duration="3.413" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-007" class="cap clip" data-start="15.813" data-duration="2.233" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.796" data-duration="1.2" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-009" class="cap clip" data-start="19.996" data-duration="5.25" data-track-index="0"><span>Aşağıdakilerden hangisi <b>84.76</b> pozisyonunda sınıflandırılmaz?</span></div>
<div id="cap-010" class="cap clip" data-start="25.276" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-011" class="cap clip" data-start="26.236" data-duration="2.08" data-track-index="0"><span>Bozuk para veya kartla çalışan,</span></div>
<div id="cap-012" class="cap clip" data-start="28.316" data-duration="3.2" data-track-index="0"><span>soğutma tertibatlı kutu içecek satış otomatı.</span></div>
<div id="cap-013" class="cap clip" data-start="31.516" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-014" class="cap clip" data-start="32.476" data-duration="1.45" data-track-index="0"><span>Para bozma makinesi.</span></div>
<div id="cap-015" class="cap clip" data-start="34.156" data-duration="0.89" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-016" class="cap clip" data-start="35.116" data-duration="3.12" data-track-index="0"><span>Jetonla çalışan tren bileti satış makinesi.</span></div>
<div id="cap-017" class="cap clip" data-start="38.236" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-018" class="cap clip" data-start="39.196" data-duration="2.96" data-track-index="0"><span>Jetonla çalışan, kahve ve süt karıştırıcısı olan</span></div>
<div id="cap-019" class="cap clip" data-start="42.156" data-duration="1.68" data-track-index="0"><span>sıcak içecek otomatı.</span></div>
<div id="cap-020" class="cap clip" data-start="43.836" data-duration="0.96" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="44.796" data-duration="1.68" data-track-index="0"><span>Ödeme tertibatı olmayan,</span></div>
<div id="cap-022" class="cap clip" data-start="46.476" data-duration="3.13" data-track-index="0"><span>ofislerde kullanılan sıcak içecek verme makinesi.</span></div>
<div id="cap-023" class="cap clip" data-start="49.916" data-duration="1.809" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-024" class="cap clip" data-start="56.075" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-025" class="cap clip" data-start="56.875" data-duration="1.0" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-026" class="cap clip" data-start="57.875" data-duration="4.36" data-track-index="0"><span><b>84.76</b>, <b>otomatik satış</b> makinelerinin pozisyonudur;</span></div>
<div id="cap-027" class="cap clip" data-start="62.235" data-duration="1.64" data-track-index="0"><span>posta pulu, tren bileti,</span></div>
<div id="cap-028" class="cap clip" data-start="63.875" data-duration="2.8" data-track-index="0"><span>yiyecek ve içecek satan otomatlar burada yer alır.</span></div>
<div id="cap-029" class="cap clip" data-start="66.675" data-duration="2.44" data-track-index="0"><span>Açıklama notuna göre para bozma makineleri de</span></div>
<div id="cap-030" class="cap clip" data-start="69.115" data-duration="1.52" data-track-index="0"><span>bu pozisyona dahildir.</span></div>
<div id="cap-031" class="cap clip" data-start="70.635" data-duration="3.04" data-track-index="0"><span>Isıtma, soğutma ya da kahve ve süt karıştırma</span></div>
<div id="cap-032" class="cap clip" data-start="73.675" data-duration="2.32" data-track-index="0"><span>tertibatı olması sonucu değiştirmez;</span></div>
<div id="cap-033" class="cap clip" data-start="75.995" data-duration="1.68" data-track-index="0"><span><b>esas işlev satıştır</b>.</span></div>
<div id="cap-034" class="cap clip" data-start="77.675" data-duration="3.04" data-track-index="0"><span>Ama <b>ödemeyi kabul edecek</b> tertibatı olmayan sıcak</span></div>
<div id="cap-035" class="cap clip" data-start="80.715" data-duration="2.12" data-track-index="0"><span>veya soğuk içecek verme makineleri,</span></div>
<div id="cap-036" class="cap clip" data-start="82.835" data-duration="2.68" data-track-index="0"><span><b>açıklama notunda</b> bu pozisyon dışında bırakılır;</span></div>
<div id="cap-037" class="cap clip" data-start="85.515" data-duration="2.758" data-track-index="0"><span>ofisteki makine <b>84.19</b>&#x27;a gider.</span></div>
<div id="cap-038" class="cap clip" data-start="89.103" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-039" class="cap clip" data-start="90.623" data-duration="2.2" data-track-index="0"><span>Stajyerimiz, soğutucusu var,</span></div>
<div id="cap-040" class="cap clip" data-start="92.823" data-duration="3.32" data-track-index="0"><span>o hâlde soğutma cihazıdır diye A şıkkındaki otomatı</span></div>
<div id="cap-041" class="cap clip" data-start="96.143" data-duration="3.52" data-track-index="0"><span><b>84.18</b>&#x27;e gönderdi ve A şıkkını seçti.</span></div>
<div id="cap-042" class="cap clip" data-start="99.663" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-043" class="cap clip" data-start="100.463" data-duration="2.72" data-track-index="0"><span>Soğutma tertibatı olan otomatın da esas işlevi</span></div>
<div id="cap-044" class="cap clip" data-start="103.183" data-duration="0.76" data-track-index="0"><span>satıştır;</span></div>
<div id="cap-045" class="cap clip" data-start="103.943" data-duration="1.8" data-track-index="0"><span><b>84.76</b>&#x27;dadır.</span></div>
<div id="cap-046" class="cap clip" data-start="105.743" data-duration="0.96" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-047" class="cap clip" data-start="106.703" data-duration="3.16" data-track-index="0"><span>Para almayan sıcak içecek makinesi satış yapmaz;</span></div>
<div id="cap-048" class="cap clip" data-start="109.863" data-duration="1.93" data-track-index="0"><span><b>84.19</b>&#x27;a gider.</span></div>
<div id="cap-049" class="cap clip" data-start="111.823" data-duration="1.76" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-050" class="cap clip" data-start="113.583" data-duration="1.238" data-track-index="0"><span><b>Para alıyor mu?</b></span></div>
<div id="cap-051" class="cap clip" data-start="115.571" data-duration="1.2" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-052" class="cap clip" data-start="116.771" data-duration="2.92" data-track-index="0"><span>Otomobilin lastiğini değiştirmek için kullanılan,</span></div>
<div id="cap-053" class="cap clip" data-start="119.691" data-duration="3.0" data-track-index="0"><span>elle çalıştırılan portatif hidrolik kriko hangi</span></div>
<div id="cap-054" class="cap clip" data-start="122.691" data-duration="2.32" data-track-index="0"><span>tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-055" class="cap clip" data-start="125.011" data-duration="0.92" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-056" class="cap clip" data-start="125.931" data-duration="1.64" data-track-index="0"><span><b>82.05</b>.</span></div>
<div id="cap-057" class="cap clip" data-start="127.571" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-058" class="cap clip" data-start="128.451" data-duration="1.72" data-track-index="0"><span><b>84.25</b>.</span></div>
<div id="cap-059" class="cap clip" data-start="130.171" data-duration="0.8" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-060" class="cap clip" data-start="130.971" data-duration="1.8" data-track-index="0"><span><b>84.28</b>.</span></div>
<div id="cap-061" class="cap clip" data-start="132.771" data-duration="0.84" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-062" class="cap clip" data-start="133.611" data-duration="1.88" data-track-index="0"><span><b>84.79</b>.</span></div>
<div id="cap-063" class="cap clip" data-start="135.491" data-duration="0.84" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-064" class="cap clip" data-start="136.331" data-duration="1.57" data-track-index="0"><span><b>87.08</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="138.811" data-duration="1.931" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-066" class="cap clip" data-start="145.092" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-067" class="cap clip" data-start="145.892" data-duration="0.89" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-068" class="cap clip" data-start="146.932" data-duration="2.44" data-track-index="0"><span>Kriko bir <b>ağır yük kaldırıcısıdır</b>.</span></div>
<div id="cap-069" class="cap clip" data-start="149.372" data-duration="3.2" data-track-index="0"><span><b>84.25</b>&#x27;in metni krikoları <b>adıyla</b> sayar;</span></div>
<div id="cap-070" class="cap clip" data-start="152.572" data-duration="3.0" data-track-index="0"><span>açıklama notu da otomobiller için portatif krikoları</span></div>
<div id="cap-071" class="cap clip" data-start="155.572" data-duration="1.36" data-track-index="0"><span>bu pozisyona koyar.</span></div>
<div id="cap-072" class="cap clip" data-start="156.932" data-duration="2.76" data-track-index="0"><span>Arabayla birlikte kullanılması onu <b>taşıt parçası</b></span></div>
<div id="cap-073" class="cap clip" data-start="159.692" data-duration="0.96" data-track-index="0"><span>yapmaz:</span></div>
<div id="cap-074" class="cap clip" data-start="160.652" data-duration="1.92" data-track-index="0"><span><b>17</b>. bölümün ikinci notu,</span></div>
<div id="cap-075" class="cap clip" data-start="162.572" data-duration="4.8" data-track-index="0"><span><b>84.01</b> ile <b>84.79</b> arasındaki makineleri taşıt aksam</span></div>
<div id="cap-076" class="cap clip" data-start="167.372" data-duration="1.48" data-track-index="0"><span>ve parçası saymaz.</span></div>
<div id="cap-077" class="cap clip" data-start="168.852" data-duration="1.04" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-078" class="cap clip" data-start="169.892" data-duration="1.52" data-track-index="0"><span><b>84.25</b>.</span></div>
<div id="cap-079" class="cap clip" data-start="171.412" data-duration="3.28" data-track-index="0"><span>Elle çalışması da onu <b>82.05</b>&#x27;e götürmez;</span></div>
<div id="cap-080" class="cap clip" data-start="174.692" data-duration="2.72" data-track-index="0"><span>o pozisyon, tarifenin başka yerinde yer almayan</span></div>
<div id="cap-081" class="cap clip" data-start="177.412" data-duration="1.576" data-track-index="0"><span>el aletleri içindir.</span></div>
<div id="cap-082" class="cap clip" data-start="179.818" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-083" class="cap clip" data-start="181.338" data-duration="2.88" data-track-index="0"><span>Cano, kriko arabayla birlikte kullanılıyor,</span></div>
<div id="cap-084" class="cap clip" data-start="184.218" data-duration="2.4" data-track-index="0"><span>araba parçasıdır diye E şıkkını,</span></div>
<div id="cap-085" class="cap clip" data-start="186.618" data-duration="2.2" data-track-index="0"><span><b>87.08</b>&#x27;i seçti.</span></div>
<div id="cap-086" class="cap clip" data-start="188.818" data-duration="0.64" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-087" class="cap clip" data-start="189.458" data-duration="4.6" data-track-index="0"><span><b>84.01</b> ile <b>84.79</b> arasındaki makineler <b>taşıt parçası</b></span></div>
<div id="cap-088" class="cap clip" data-start="194.058" data-duration="0.84" data-track-index="0"><span>sayılmaz;</span></div>
<div id="cap-089" class="cap clip" data-start="194.898" data-duration="2.787" data-track-index="0"><span>kriko <b>84.25</b>&#x27;te <b>adıyla</b> geçer.</span></div>
<div id="cap-090" class="cap clip" data-start="197.685" data-duration="0.933" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-091" class="cap clip" data-start="198.618" data-duration="2.64" data-track-index="0"><span>Aynı kural, taşıtlarda kullanılan pompalar ve</span></div>
<div id="cap-092" class="cap clip" data-start="201.258" data-duration="1.93" data-track-index="0"><span>kompresörler için de geçerlidir.</span></div>
<div id="cap-093" class="cap clip" data-start="203.418" data-duration="0.88" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-094" class="cap clip" data-start="204.298" data-duration="1.734" data-track-index="0"><span><b>Makine mi</b>, <b>parça mı</b>?</span></div>
<div id="cap-095" class="cap clip" data-start="206.782" data-duration="1.12" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-096" class="cap clip" data-start="207.902" data-duration="3.52" data-track-index="0"><span>Aşağıdakilerden hangisi tarife cetvelinde diğerlerinden</span></div>
<div id="cap-097" class="cap clip" data-start="211.422" data-duration="2.32" data-track-index="0"><span>farklı bir fasılda sınıflandırılır?</span></div>
<div id="cap-098" class="cap clip" data-start="213.742" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-099" class="cap clip" data-start="214.702" data-duration="2.0" data-track-index="0"><span>Hiçbir maddeyle karıştırılmamış,</span></div>
<div id="cap-100" class="cap clip" data-start="216.702" data-duration="3.13" data-track-index="0"><span>dökme hâldeki saf o-asetilsalisilik asit.</span></div>
<div id="cap-101" class="cap clip" data-start="220.062" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-102" class="cap clip" data-start="221.022" data-duration="2.16" data-track-index="0"><span>Bir dolgu maddesiyle karıştırılmış,</span></div>
<div id="cap-103" class="cap clip" data-start="223.182" data-duration="2.56" data-track-index="0"><span>dozlandırılmamış, dökme aspirin.</span></div>
<div id="cap-104" class="cap clip" data-start="225.742" data-duration="0.81" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-105" class="cap clip" data-start="226.622" data-duration="3.16" data-track-index="0"><span>Dozlandırılmış, perakende satışa hazır aspirin</span></div>
<div id="cap-106" class="cap clip" data-start="229.782" data-duration="0.92" data-track-index="0"><span>tabletleri.</span></div>
<div id="cap-107" class="cap clip" data-start="230.702" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-108" class="cap clip" data-start="231.662" data-duration="2.68" data-track-index="0"><span>Tabii maden sularının buharlaştırılmasıyla elde</span></div>
<div id="cap-109" class="cap clip" data-start="234.342" data-duration="1.57" data-track-index="0"><span>edilen tıbbi tuzlar.</span></div>
<div id="cap-110" class="cap clip" data-start="236.142" data-duration="0.96" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-111" class="cap clip" data-start="237.102" data-duration="3.04" data-track-index="0"><span>Dökme hâlde, tıbbi amaçla karıştırılmış şifalı</span></div>
<div id="cap-112" class="cap clip" data-start="240.142" data-duration="0.73" data-track-index="0"><span>bitkiler.</span></div>
<div id="cap-113" class="cap clip" data-start="241.102" data-duration="1.796" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-114" class="cap clip" data-start="247.248" data-duration="0.73" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-115" class="cap clip" data-start="248.048" data-duration="1.04" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-116" class="cap clip" data-start="249.088" data-duration="2.12" data-track-index="0"><span>Saf o-asetilsalisilik asit,</span></div>
<div id="cap-117" class="cap clip" data-start="251.208" data-duration="1.56" data-track-index="0"><span>kimyaca belirli yapıda,</span></div>
<div id="cap-118" class="cap clip" data-start="252.768" data-duration="2.293" data-track-index="0"><span><b>izole edilmiş</b> bir <b>organik bileşiktir</b>.</span></div>
<div id="cap-119" class="cap clip" data-start="255.061" data-duration="3.227" data-track-index="0"><span><b>29</b>. faslın birinci notu bu tür bileşikleri,</span></div>
<div id="cap-120" class="cap clip" data-start="258.288" data-duration="2.64" data-track-index="0"><span><b>safsızlık</b> içerseler bile bu fasla koyar;</span></div>
<div id="cap-121" class="cap clip" data-start="260.928" data-duration="3.72" data-track-index="0"><span>aspirin etken maddesi <b>29.18</b>&#x27;de <b>adıyla</b> geçer.</span></div>
<div id="cap-122" class="cap clip" data-start="264.648" data-duration="2.64" data-track-index="0"><span>Diğer dört eşya ise <b>30</b>. fasıldadır:</span></div>
<div id="cap-123" class="cap clip" data-start="267.288" data-duration="3.8" data-track-index="0"><span>Dolgu maddesiyle karıştırılmış dökme aspirin <b>30.03</b>&#x27;te;</span></div>
<div id="cap-124" class="cap clip" data-start="271.088" data-duration="2.72" data-track-index="0"><span>tıbbi bitki karışımları ve maden sularından elde</span></div>
<div id="cap-125" class="cap clip" data-start="273.808" data-duration="2.96" data-track-index="0"><span>edilen tıbbi tuzlar da <b>açıklama notunda</b> <b>adıyla</b>,</span></div>
<div id="cap-126" class="cap clip" data-start="276.768" data-duration="1.2" data-track-index="0"><span><b>30.03</b>&#x27;te;</span></div>
<div id="cap-127" class="cap clip" data-start="277.968" data-duration="3.724" data-track-index="0"><span>dozlandırılmış aspirin tabletleri ise <b>30.04</b>&#x27;tedir.</span></div>
<div id="cap-128" class="cap clip" data-start="282.512" data-duration="1.37" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-129" class="cap clip" data-start="283.882" data-duration="3.6" data-track-index="0"><span>Yardımcımız, bitkiler ilaç değildir diye E şıkkını</span></div>
<div id="cap-130" class="cap clip" data-start="287.482" data-duration="0.72" data-track-index="0"><span>seçti.</span></div>
<div id="cap-131" class="cap clip" data-start="288.202" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-132" class="cap clip" data-start="289.002" data-duration="2.24" data-track-index="0"><span>Tedavi amacıyla karıştırılmış bitkiler,</span></div>
<div id="cap-133" class="cap clip" data-start="291.242" data-duration="2.96" data-track-index="0"><span><b>30.03</b>&#x27;ün <b>açıklama notunda</b> <b>adıyla</b> sayılır.</span></div>
<div id="cap-134" class="cap clip" data-start="294.202" data-duration="2.96" data-track-index="0"><span>Farklı olan, hiçbir maddeyle karıştırılmamış saf</span></div>
<div id="cap-135" class="cap clip" data-start="297.162" data-duration="1.16" data-track-index="0"><span>etken maddedir;</span></div>
<div id="cap-136" class="cap clip" data-start="298.322" data-duration="2.707" data-track-index="0"><span>o kimyasaldır, <b>29</b>. fasla girer.</span></div>
<div id="cap-137" class="cap clip" data-start="301.029" data-duration="0.933" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-138" class="cap clip" data-start="301.962" data-duration="2.92" data-track-index="0"><span>Aynı saf madde dozlandırılıp tablet yapılınca</span></div>
<div id="cap-139" class="cap clip" data-start="304.882" data-duration="2.4" data-track-index="0"><span>artık ilaçtır, <b>30.04</b>.</span></div>
<div id="cap-140" class="cap clip" data-start="307.282" data-duration="1.76" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-141" class="cap clip" data-start="309.042" data-duration="2.489" data-track-index="0"><span><b>Saf mı</b>, <b>karışım mı</b>, <b>doz mu</b>?</span></div>
<div id="cap-142" class="cap clip" data-start="312.468" data-duration="1.013" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-143" class="cap clip" data-start="313.481" data-duration="1.52" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-144" class="cap clip" data-start="315.001" data-duration="0.72" data-track-index="0"><span>Bir:</span></div>
<div id="cap-145" class="cap clip" data-start="315.721" data-duration="1.88" data-track-index="0"><span>Otomatta para sorusunu sorun;</span></div>
<div id="cap-146" class="cap clip" data-start="317.601" data-duration="4.2" data-track-index="0"><span>ödeme alıyorsa <b>84.76</b>, ödeme almayan sıcak içecek</span></div>
<div id="cap-147" class="cap clip" data-start="321.801" data-duration="2.2" data-track-index="0"><span>makinesi <b>84.19</b>.</span></div>
<div id="cap-148" class="cap clip" data-start="324.001" data-duration="0.72" data-track-index="0"><span>İki:</span></div>
<div id="cap-149" class="cap clip" data-start="324.721" data-duration="3.04" data-track-index="0"><span>Taşıtla kullanılan makine <b>taşıt parçası</b> değildir;</span></div>
<div id="cap-150" class="cap clip" data-start="327.761" data-duration="2.2" data-track-index="0"><span>kriko <b>84.25</b>.</span></div>
<div id="cap-151" class="cap clip" data-start="329.961" data-duration="0.64" data-track-index="0"><span>Üç:</span></div>
<div id="cap-152" class="cap clip" data-start="330.601" data-duration="1.6" data-track-index="0"><span>Kimyada saflığa bakın;</span></div>
<div id="cap-153" class="cap clip" data-start="332.201" data-duration="4.676" data-track-index="0"><span>saf bileşik <b>29</b>. fasıl, karışım ya da doz <b>30</b>. fasıl.</span></div>
<div id="cap-154" class="cap clip" data-start="337.627" data-duration="1.61" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-155" class="cap clip" data-start="339.387" data-duration="2.8" data-track-index="0"><span>Birinci soru E, ikinci soru B,</span></div>
<div id="cap-156" class="cap clip" data-start="342.187" data-duration="1.29" data-track-index="0"><span>üçüncü soru A.</span></div>
<div id="cap-157" class="cap clip" data-start="343.627" data-duration="1.28" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-158" class="cap clip" data-start="344.907" data-duration="1.2" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-159" class="cap clip" data-start="346.107" data-duration="3.48" data-track-index="0"><span>Böylece tarife derslerinin <b>16</b>&#x27;ncısını de tamamladık.</span></div>
<div id="cap-160" class="cap clip" data-start="349.587" data-duration="3.04" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-161" class="cap clip" data-start="352.627" data-duration="0.787" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-162" class="cap clip" data-start="353.414" data-duration="1.813" data-track-index="0"><span>Bir sonraki derste görüşmek üzere.</span></div>
<div id="cap-163" class="cap clip" data-start="355.227" data-duration="0.936" data-track-index="0"><span>Hoşça kalın!</span></div>
