    <template>
      <style>
        #captions { position:absolute; inset:0; pointer-events:none; }

      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="343.42">
<div id="cap-001" class="cap clip" data-start="1.69" data-duration="3.23" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.92" data-duration="1.38" data-track-index="0"><span>ilkine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.3" data-duration="2.74" data-track-index="0"><span>Bugün tarife cetvelinin sistematiğinden <b>3</b> soru</span></div>
<div id="cap-004" class="cap clip" data-start="9.04" data-duration="0.94" data-track-index="0"><span>çözeceğiz:</span></div>
<div id="cap-005" class="cap clip" data-start="9.98" data-duration="3.75" data-track-index="0"><span>bölüm ve fasıllar, <b>Armonize Sistem</b> ve ölçü birimleri.</span></div>
<div id="cap-006" class="cap clip" data-start="13.73" data-duration="1.16" data-track-index="0"><span>Ekip de hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="14.89" data-duration="3.28" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="18.17" data-duration="2.16" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="21.241" data-duration="1.09" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="22.331" data-duration="3.04" data-track-index="0"><span>Adi metaller ve adi metallerden eşya,</span></div>
<div id="cap-011" class="cap clip" data-start="25.371" data-duration="3.2" data-track-index="0"><span>Türk Gümrük Tarife Cetvelinin hangi bölüm ve fasıllarında</span></div>
<div id="cap-012" class="cap clip" data-start="28.571" data-duration="1.14" data-track-index="0"><span>yer almaktadır?</span></div>
<div id="cap-013" class="cap clip" data-start="29.711" data-duration="1.02" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-014" class="cap clip" data-start="30.731" data-duration="2.58" data-track-index="0"><span><b>14</b>. bölüm, <b>71</b>. fasıl.</span></div>
<div id="cap-015" class="cap clip" data-start="33.311" data-duration="1.02" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-016" class="cap clip" data-start="34.331" data-duration="3.58" data-track-index="0"><span><b>16</b>. bölüm, <b>84</b> ve <b>85</b>. fasıllar.</span></div>
<div id="cap-017" class="cap clip" data-start="37.911" data-duration="1.02" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-018" class="cap clip" data-start="38.931" data-duration="3.68" data-track-index="0"><span><b>15</b>. bölüm, <b>72</b> ile <b>83</b> arası fasıllar.</span></div>
<div id="cap-019" class="cap clip" data-start="42.611" data-duration="1.02" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-020" class="cap clip" data-start="43.631" data-duration="3.58" data-track-index="0"><span><b>13</b>. bölüm, <b>68</b> ile <b>70</b> arası fasıllar.</span></div>
<div id="cap-021" class="cap clip" data-start="47.211" data-duration="1.01" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-022" class="cap clip" data-start="48.221" data-duration="4.42" data-track-index="0"><span><b>17</b>. bölüm, <b>86</b> ile <b>89</b> arası fasıllar.</span></div>
<div id="cap-023" class="cap clip" data-start="52.641" data-duration="1.879" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-024" class="cap clip" data-start="58.95" data-duration="0.3" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-025" class="cap clip" data-start="59.19" data-duration="1.56" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-026" class="cap clip" data-start="60.75" data-duration="2.32" data-track-index="0"><span><b>Adi metaller</b>, <b>15</b>. bölümde,</span></div>
<div id="cap-027" class="cap clip" data-start="63.07" data-duration="3.08" data-track-index="0"><span><b>72</b> ile <b>83</b> arası fasıllarda yer alır.</span></div>
<div id="cap-028" class="cap clip" data-start="66.15" data-duration="2.3" data-track-index="0"><span>Bölüm demir ve çelikle başlar;</span></div>
<div id="cap-029" class="cap clip" data-start="68.45" data-duration="2.03" data-track-index="0"><span>bakır, nikel, alüminyum,</span></div>
<div id="cap-030" class="cap clip" data-start="70.48" data-duration="3.62" data-track-index="0"><span>kurşun, çinko, kalay ve diğer adi metallerle devam</span></div>
<div id="cap-031" class="cap clip" data-start="74.1" data-duration="0.45" data-track-index="0"><span>eder;</span></div>
<div id="cap-032" class="cap clip" data-start="74.55" data-duration="3.64" data-track-index="0"><span><b>adi metallerden</b> aletler ve çeşitli eşyayla biter.</span></div>
<div id="cap-033" class="cap clip" data-start="78.19" data-duration="0.8" data-track-index="0"><span><b>Dikkat!</b></span></div>
<div id="cap-034" class="cap clip" data-start="78.99" data-duration="1.92" data-track-index="0"><span><b>77</b>. fasıl <b>boştur</b>;</span></div>
<div id="cap-035" class="cap clip" data-start="80.91" data-duration="2.81" data-track-index="0"><span>Armonize Sistemde ileride kullanılmak üzere <b>saklı</b></span></div>
<div id="cap-036" class="cap clip" data-start="83.72" data-duration="1.026" data-track-index="0"><span>tutulmuştur.</span></div>
<div id="cap-037" class="cap clip" data-start="85.586" data-duration="1.89" data-track-index="0"><span>Peki tuzak nerede?</span></div>
<div id="cap-038" class="cap clip" data-start="87.566" data-duration="2.8" data-track-index="0"><span>Yardımcımız, metalden yapılmış diye makineleri</span></div>
<div id="cap-039" class="cap clip" data-start="90.366" data-duration="0.52" data-track-index="0"><span>seçti:</span></div>
<div id="cap-040" class="cap clip" data-start="90.886" data-duration="0.9" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-041" class="cap clip" data-start="91.786" data-duration="3.8" data-track-index="0"><span>Ama <b>84</b> ve <b>85</b>. fasıllar makinelerin yeridir.</span></div>
<div id="cap-042" class="cap clip" data-start="95.586" data-duration="3.79" data-track-index="0"><span><b>1</b> ile <b>83</b> arası fasıllarda eşya genel olarak yapıldığı</span></div>
<div id="cap-043" class="cap clip" data-start="99.376" data-duration="3.2" data-track-index="0"><span><b>maddeye göre</b>, <b>84</b> ile <b>96</b> arasında ise işlevine</span></div>
<div id="cap-044" class="cap clip" data-start="102.576" data-duration="1.58" data-track-index="0"><span>göre sınıflandırılır.</span></div>
<div id="cap-045" class="cap clip" data-start="104.156" data-duration="3.03" data-track-index="0"><span>A şıkkındaki <b>71</b>. fasıl da <b>kıymetli metallerin</b></span></div>
<div id="cap-046" class="cap clip" data-start="107.186" data-duration="0.8" data-track-index="0"><span>yeridir:</span></div>
<div id="cap-047" class="cap clip" data-start="107.986" data-duration="1.8" data-track-index="0"><span>altın, gümüş, platin.</span></div>
<div id="cap-048" class="cap clip" data-start="109.786" data-duration="3.049" data-track-index="0"><span><b>Kıymetli metal</b> ayrı, <b>adi metal</b> ayrı!</span></div>
<div id="cap-049" class="cap clip" data-start="113.615" data-duration="1.2" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-050" class="cap clip" data-start="114.815" data-duration="2.96" data-track-index="0"><span>Armonize Sistem ve tarife cetvelinin sınıflandırma</span></div>
<div id="cap-051" class="cap clip" data-start="117.775" data-duration="3.1" data-track-index="0"><span>mantığı ile ilgili aşağıdaki ifadelerden hangisi</span></div>
<div id="cap-052" class="cap clip" data-start="120.875" data-duration="1.04" data-track-index="0"><span>yanlıştır?</span></div>
<div id="cap-053" class="cap clip" data-start="121.915" data-duration="1.23" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-054" class="cap clip" data-start="123.145" data-duration="2.7" data-track-index="0"><span>Armonize Sistem, merkezi Brüksel&#x27;de bulunan Dünya</span></div>
<div id="cap-055" class="cap clip" data-start="125.845" data-duration="2.77" data-track-index="0"><span>Gümrük Örgütü bünyesinde hazırlanmıştır.</span></div>
<div id="cap-056" class="cap clip" data-start="128.615" data-duration="1.19" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-057" class="cap clip" data-start="129.805" data-duration="3.06" data-track-index="0"><span>Kodun ilk <b>6</b> hanesi, sisteme taraf tüm ülkelerde</span></div>
<div id="cap-058" class="cap clip" data-start="132.865" data-duration="1.97" data-track-index="0"><span>aynı şekilde uygulanır.</span></div>
<div id="cap-059" class="cap clip" data-start="134.835" data-duration="1.2" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-060" class="cap clip" data-start="136.035" data-duration="2.74" data-track-index="0"><span>Sınıflandırma genel olarak canlıdan cansıza,</span></div>
<div id="cap-061" class="cap clip" data-start="138.775" data-duration="2.783" data-track-index="0"><span>ham maddeden mamul eşyaya doğru bir sıra izler.</span></div>
<div id="cap-062" class="cap clip" data-start="141.558" data-duration="0.604" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-063" class="cap clip" data-start="142.162" data-duration="3.453" data-track-index="0"><span><b>84</b> ile <b>96</b> arası fasıllardaki eşya,</span></div>
<div id="cap-064" class="cap clip" data-start="145.615" data-duration="3.48" data-track-index="0"><span>genel olarak işlevine göre sınıflandırılır.</span></div>
<div id="cap-065" class="cap clip" data-start="149.095" data-duration="0.56" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-066" class="cap clip" data-start="149.655" data-duration="3.0" data-track-index="0"><span>İlk bakışta iki pozisyona girebilen eşya,</span></div>
<div id="cap-067" class="cap clip" data-start="152.655" data-duration="3.76" data-track-index="0"><span>vergi oranı yüksek olan pozisyonda sınıflandırılır.</span></div>
<div id="cap-068" class="cap clip" data-start="156.415" data-duration="1.933" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-069" class="cap clip" data-start="162.738" data-duration="0.96" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-070" class="cap clip" data-start="163.698" data-duration="1.0" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-071" class="cap clip" data-start="164.698" data-duration="3.13" data-track-index="0"><span>Tarifede <b>vergi oranına göre</b> sınıflandırma yoktur!</span></div>
<div id="cap-072" class="cap clip" data-start="167.828" data-duration="2.97" data-track-index="0"><span>Eşya ilk bakışta iki pozisyona girebiliyorsa,</span></div>
<div id="cap-073" class="cap clip" data-start="170.798" data-duration="2.68" data-track-index="0"><span><b>3</b>. genel kural sırayla uygulanır.</span></div>
<div id="cap-074" class="cap clip" data-start="173.478" data-duration="3.57" data-track-index="0"><span>Önce, eşyayı <b>en özel</b> şekilde tanımlayan pozisyon.</span></div>
<div id="cap-075" class="cap clip" data-start="177.048" data-duration="3.11" data-track-index="0"><span>Bu yetmezse, eşyaya <b>esas niteliğini</b> veren madde</span></div>
<div id="cap-076" class="cap clip" data-start="180.158" data-duration="1.04" data-track-index="0"><span>veya parça.</span></div>
<div id="cap-077" class="cap clip" data-start="181.198" data-duration="2.88" data-track-index="0"><span>O da sonuç vermezse, <b>numara sırasına</b> göre en son</span></div>
<div id="cap-078" class="cap clip" data-start="184.078" data-duration="1.39" data-track-index="0"><span>gelen pozisyon.</span></div>
<div id="cap-079" class="cap clip" data-start="185.468" data-duration="2.009" data-track-index="0"><span>Diğer <b>4</b> ifade doğrudur.</span></div>
<div id="cap-080" class="cap clip" data-start="188.317" data-duration="2.67" data-track-index="0"><span>Bu soruda gizli bir tuzak daha var.</span></div>
<div id="cap-081" class="cap clip" data-start="191.017" data-duration="3.26" data-track-index="0"><span>Cano&#x27;ya <b>Armonize Sistemi</b> kimin hazırladığını sorduk;</span></div>
<div id="cap-082" class="cap clip" data-start="194.277" data-duration="1.84" data-track-index="0"><span><b>Dünya Ticaret Örgütü</b> dedi.</span></div>
<div id="cap-083" class="cap clip" data-start="196.117" data-duration="0.74" data-track-index="0"><span>Hayır!</span></div>
<div id="cap-084" class="cap clip" data-start="196.857" data-duration="3.18" data-track-index="0"><span><b>Armonize Sistem</b>, <b>Dünya Gümrük Örgütü</b>&#x27;nün eseridir.</span></div>
<div id="cap-085" class="cap clip" data-start="200.037" data-duration="1.7" data-track-index="0"><span>Gümrükçü Baba&#x27;nın formülü:</span></div>
<div id="cap-086" class="cap clip" data-start="201.737" data-duration="3.02" data-track-index="0"><span><b>DGÖ</b> gümrük, <b>DTÖ</b> ticaret.</span></div>
<div id="cap-087" class="cap clip" data-start="204.757" data-duration="1.28" data-track-index="0"><span>Bir de kod yapısı:</span></div>
<div id="cap-088" class="cap clip" data-start="206.037" data-duration="3.41" data-track-index="0"><span><b>12</b> haneli tarife kodunun ilk <b>6</b> hanesi Armonize</span></div>
<div id="cap-089" class="cap clip" data-start="209.447" data-duration="0.55" data-track-index="0"><span>Sistem;</span></div>
<div id="cap-090" class="cap clip" data-start="209.997" data-duration="3.84" data-track-index="0"><span><b>7</b> ve <b>8</b>. haneler Avrupa Birliği <b>Kombine Nomanklatürü</b>;</span></div>
<div id="cap-091" class="cap clip" data-start="213.837" data-duration="2.84" data-track-index="0"><span><b>9</b> ve <b>10</b>. haneler milli alt açılım;</span></div>
<div id="cap-092" class="cap clip" data-start="216.677" data-duration="2.729" data-track-index="0"><span>son <b>2</b> hane ise istatistik kodudur.</span></div>
<div id="cap-093" class="cap clip" data-start="220.156" data-duration="1.25" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-094" class="cap clip" data-start="221.436" data-duration="2.64" data-track-index="0"><span>Türk Gümrük Tarife Cetvelinde kullanılan ölçü</span></div>
<div id="cap-095" class="cap clip" data-start="224.076" data-duration="2.96" data-track-index="0"><span>birimi kısaltmaları ile anlamlarına ilişkin aşağıdaki</span></div>
<div id="cap-096" class="cap clip" data-start="227.036" data-duration="2.77" data-track-index="0"><span>eşleştirmelerden hangisi yanlıştır?</span></div>
<div id="cap-097" class="cap clip" data-start="229.836" data-duration="1.04" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-098" class="cap clip" data-start="230.876" data-duration="2.48" data-track-index="0"><span>ct/l, karat.</span></div>
<div id="cap-099" class="cap clip" data-start="233.356" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-100" class="cap clip" data-start="234.316" data-duration="2.32" data-track-index="0"><span>p/st, adet.</span></div>
<div id="cap-101" class="cap clip" data-start="236.636" data-duration="0.89" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-102" class="cap clip" data-start="237.676" data-duration="3.04" data-track-index="0"><span>ce/el, hücre adedi.</span></div>
<div id="cap-103" class="cap clip" data-start="240.716" data-duration="0.81" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-104" class="cap clip" data-start="241.596" data-duration="2.08" data-track-index="0"><span>p/a, çift.</span></div>
<div id="cap-105" class="cap clip" data-start="243.676" data-duration="0.89" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-106" class="cap clip" data-start="244.716" data-duration="1.55" data-track-index="0"><span>TJ, terajul.</span></div>
<div id="cap-107" class="cap clip" data-start="246.756" data-duration="1.758" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-108" class="cap clip" data-start="252.934" data-duration="0.69" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-109" class="cap clip" data-start="253.684" data-duration="0.97" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-110" class="cap clip" data-start="254.654" data-duration="2.377" data-track-index="0"><span>Karatın kısaltması <b>c/k</b>.</span></div>
<div id="cap-111" class="cap clip" data-start="257.031" data-duration="4.403" data-track-index="0"><span><b>ct/l</b> ise, ton başına taşıma kapasitesini gösterir.</span></div>
<div id="cap-112" class="cap clip" data-start="261.434" data-duration="1.8" data-track-index="0"><span>Diğer eşleştirmeler doğru:</span></div>
<div id="cap-113" class="cap clip" data-start="263.234" data-duration="3.9" data-track-index="0"><span><b>p/st</b> <b>adet</b>, <b>ce/el</b> hücre adedi,</span></div>
<div id="cap-114" class="cap clip" data-start="267.134" data-duration="1.98" data-track-index="0"><span><b>p/a</b> <b>çift</b>;</span></div>
<div id="cap-115" class="cap clip" data-start="269.134" data-duration="3.3" data-track-index="0"><span><b>TJ</b> ise brüt kalori değeri olarak <b>terajul</b>.</span></div>
<div id="cap-116" class="cap clip" data-start="272.434" data-duration="1.0" data-track-index="0"><span>Bir de not:</span></div>
<div id="cap-117" class="cap clip" data-start="273.434" data-duration="2.84" data-track-index="0"><span>Bir <b>karat</b>, <b>0,2</b> gramdır.</span></div>
<div id="cap-118" class="cap clip" data-start="277.115" data-duration="3.26" data-track-index="0"><span>Tuzak, birbirine benzeyen kısaltmalarda.</span></div>
<div id="cap-119" class="cap clip" data-start="280.375" data-duration="3.19" data-track-index="0"><span>Stajyerimiz <b>p/a</b>&#x27;yı görünce <b>adet</b> sandı.</span></div>
<div id="cap-120" class="cap clip" data-start="283.735" data-duration="0.86" data-track-index="0"><span>Hayır!</span></div>
<div id="cap-121" class="cap clip" data-start="284.595" data-duration="1.76" data-track-index="0"><span><b>p/a</b>, <b>çift</b> demektir;</span></div>
<div id="cap-122" class="cap clip" data-start="286.355" data-duration="1.73" data-track-index="0"><span>ayakkabı ya da eldiven gibi.</span></div>
<div id="cap-123" class="cap clip" data-start="288.085" data-duration="2.18" data-track-index="0"><span>Adet ise <b>p/st</b>.</span></div>
<div id="cap-124" class="cap clip" data-start="290.265" data-duration="2.13" data-track-index="0"><span>Aynı şekilde <b>c/k</b> <b>karat</b>,</span></div>
<div id="cap-125" class="cap clip" data-start="292.395" data-duration="2.62" data-track-index="0"><span><b>ct/l</b> taşıma kapasitesi.</span></div>
<div id="cap-126" class="cap clip" data-start="295.015" data-duration="2.541" data-track-index="0"><span>Harfler benzer, anlamlar farklı!</span></div>
<div id="cap-127" class="cap clip" data-start="298.396" data-duration="1.04" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-128" class="cap clip" data-start="299.436" data-duration="1.93" data-track-index="0"><span>Tarife sorularını ezberle değil,</span></div>
<div id="cap-129" class="cap clip" data-start="301.366" data-duration="1.39" data-track-index="0"><span>mantıkla çözün.</span></div>
<div id="cap-130" class="cap clip" data-start="302.756" data-duration="0.88" data-track-index="0"><span>Bir:</span></div>
<div id="cap-131" class="cap clip" data-start="303.636" data-duration="2.74" data-track-index="0"><span>Bölümler ham maddeden mamule doğru sıralanır;</span></div>
<div id="cap-132" class="cap clip" data-start="306.376" data-duration="2.26" data-track-index="0"><span>metaller önce madde olarak gelir,</span></div>
<div id="cap-133" class="cap clip" data-start="308.636" data-duration="1.9" data-track-index="0"><span>makineler ise <b>işlevine göre</b>.</span></div>
<div id="cap-134" class="cap clip" data-start="310.536" data-duration="0.37" data-track-index="0"><span>İki:</span></div>
<div id="cap-135" class="cap clip" data-start="310.906" data-duration="3.57" data-track-index="0"><span>Sınıflandırmada <b>vergi oranı</b> asla ölçüt değildir;</span></div>

<div id="cap-137" class="cap clip" data-start="316.806" data-duration="0.37" data-track-index="0"><span>Üç:</span></div>
<div id="cap-138" class="cap clip" data-start="317.176" data-duration="2.35" data-track-index="0"><span>Kısaltmaları <b>çift</b> <b>çift</b> öğrenin:</span></div>
<div id="cap-139" class="cap clip" data-start="319.526" data-duration="2.05" data-track-index="0"><span><b>karat</b> ile taşıma kapasitesi,</span></div>
<div id="cap-140" class="cap clip" data-start="321.576" data-duration="1.326" data-track-index="0"><span><b>çift</b> ile <b>adet</b>.</span></div>
<div id="cap-141" class="cap clip" data-start="323.732" data-duration="1.52" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-142" class="cap clip" data-start="325.252" data-duration="3.02" data-track-index="0"><span>Birinci soru C, ikinci soru E,</span></div>
<div id="cap-143" class="cap clip" data-start="328.272" data-duration="1.41" data-track-index="0"><span>üçüncü soru A.</span></div>
<div id="cap-144" class="cap clip" data-start="329.682" data-duration="1.42" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-145" class="cap clip" data-start="331.102" data-duration="1.02" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-146" class="cap clip" data-start="332.122" data-duration="3.14" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-147" class="cap clip" data-start="335.262" data-duration="0.63" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-148" class="cap clip" data-start="335.892" data-duration="1.69" data-track-index="0"><span>Bir sonraki tarife dersinde,</span></div>
