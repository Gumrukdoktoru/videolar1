      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="300.66">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.12" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.8" data-duration="1.84" data-track-index="0"><span>sekizincisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.64" data-duration="1.56" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.2" data-duration="2.84" data-track-index="0"><span>tuz ve deniz suyu, tarife cetvelindeki notlar</span></div>
<div id="cap-005" class="cap clip" data-start="11.04" data-duration="1.64" data-track-index="0"><span>ve bağlayıcı kaynaklar.</span></div>
<div id="cap-006" class="cap clip" data-start="12.68" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="13.68" data-duration="3.333" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="17.013" data-duration="2.156" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="19.919" data-duration="1.2" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="21.119" data-duration="4.96" data-track-index="0"><span>Aşağıdakilerden hangisi <b>25.01</b> pozisyonunda sınıflandırılmaz?</span></div>
<div id="cap-011" class="cap clip" data-start="26.079" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-012" class="cap clip" data-start="27.039" data-duration="2.0" data-track-index="0"><span>Gazlı doğal maden suyu.</span></div>
<div id="cap-013" class="cap clip" data-start="29.039" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-014" class="cap clip" data-start="29.999" data-duration="1.2" data-track-index="0"><span>Deniz suyu.</span></div>
<div id="cap-015" class="cap clip" data-start="31.199" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-016" class="cap clip" data-start="32.159" data-duration="1.68" data-track-index="0"><span>Saf sodyum klorür.</span></div>
<div id="cap-017" class="cap clip" data-start="33.839" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-018" class="cap clip" data-start="34.719" data-duration="1.13" data-track-index="0"><span>Denatüre tuz.</span></div>
<div id="cap-019" class="cap clip" data-start="35.999" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-020" class="cap clip" data-start="36.879" data-duration="3.096" data-track-index="0"><span>Topaklaşmayı önleyici madde katılmış sofra tuzu.</span></div>
<div id="cap-021" class="cap clip" data-start="40.559" data-duration="1.736" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-022" class="cap clip" data-start="46.645" data-duration="0.81" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-023" class="cap clip" data-start="47.525" data-duration="0.96" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-024" class="cap clip" data-start="48.485" data-duration="1.96" data-track-index="0"><span>Maden suları ve gazlı sular,</span></div>
<div id="cap-025" class="cap clip" data-start="50.445" data-duration="4.013" data-track-index="0"><span><b>22</b>. fasılda, <b>22.01</b> pozisyonunda yer alır.</span></div>
<div id="cap-026" class="cap clip" data-start="54.458" data-duration="2.707" data-track-index="0"><span><b>25.01</b> ise tuzun pozisyonudur:</span></div>
<div id="cap-027" class="cap clip" data-start="57.165" data-duration="2.76" data-track-index="0"><span>Sofra tuzu ve denatüre tuz dahil tuz,</span></div>
<div id="cap-028" class="cap clip" data-start="59.925" data-duration="3.04" data-track-index="0"><span>saf sodyum klorür ve deniz suyu burada sayılır.</span></div>
<div id="cap-029" class="cap clip" data-start="62.965" data-duration="3.28" data-track-index="0"><span>Pozisyon metni, topaklaşmayı önleyici madde katılmasına</span></div>
<div id="cap-030" class="cap clip" data-start="66.245" data-duration="1.731" data-track-index="0"><span>da açıkça izin verir.</span></div>
<div id="cap-031" class="cap clip" data-start="68.806" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-032" class="cap clip" data-start="70.326" data-duration="3.52" data-track-index="0"><span>Cano, deniz suyu da sonuçta sudur diye B şıkkını</span></div>
<div id="cap-033" class="cap clip" data-start="73.846" data-duration="0.72" data-track-index="0"><span>seçti.</span></div>
<div id="cap-034" class="cap clip" data-start="74.566" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-035" class="cap clip" data-start="75.446" data-duration="3.413" data-track-index="0"><span><b>22</b>. faslın notu deniz suyunu açıkça <b>fasıl dışında</b></span></div>
<div id="cap-036" class="cap clip" data-start="78.859" data-duration="0.747" data-track-index="0"><span>bırakır;</span></div>
<div id="cap-037" class="cap clip" data-start="79.606" data-duration="2.32" data-track-index="0"><span>deniz suyu <b>25.01</b>&#x27;dedir.</span></div>
<div id="cap-038" class="cap clip" data-start="81.926" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-039" class="cap clip" data-start="82.966" data-duration="2.44" data-track-index="0"><span><b>Damıtılmış su</b> da <b>22</b>. fasla girmez;</span></div>
<div id="cap-040" class="cap clip" data-start="85.406" data-duration="2.147" data-track-index="0"><span><b>28.53</b> pozisyonuna gider.</span></div>
<div id="cap-041" class="cap clip" data-start="87.553" data-duration="0.813" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-042" class="cap clip" data-start="88.366" data-duration="2.501" data-track-index="0"><span>Suyun <b>adına</b> değil, fasıl notuna bakın.</span></div>
<div id="cap-043" class="cap clip" data-start="91.617" data-duration="1.05" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-044" class="cap clip" data-start="92.897" data-duration="2.76" data-track-index="0"><span>Türk Gümrük Tarife Cetvelinde yer alan aşağıdaki</span></div>
<div id="cap-045" class="cap clip" data-start="95.657" data-duration="3.4" data-track-index="0"><span>unsurlardan hangisi, Armonize Sistem Nomanklatüründe</span></div>
<div id="cap-046" class="cap clip" data-start="99.057" data-duration="1.17" data-track-index="0"><span>yer almaz?</span></div>
<div id="cap-047" class="cap clip" data-start="100.257" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-048" class="cap clip" data-start="101.137" data-duration="1.2" data-track-index="0"><span>Bölüm notları.</span></div>
<div id="cap-049" class="cap clip" data-start="102.337" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-050" class="cap clip" data-start="103.217" data-duration="1.28" data-track-index="0"><span>Fasıl notları.</span></div>
<div id="cap-051" class="cap clip" data-start="104.497" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-052" class="cap clip" data-start="105.377" data-duration="1.12" data-track-index="0"><span>Ek notlar.</span></div>
<div id="cap-053" class="cap clip" data-start="106.497" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-054" class="cap clip" data-start="107.457" data-duration="1.6" data-track-index="0"><span>Alt pozisyon notları.</span></div>
<div id="cap-055" class="cap clip" data-start="109.057" data-duration="0.8" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-056" class="cap clip" data-start="109.857" data-duration="2.757" data-track-index="0"><span>Tarifenin yorumuna ilişkin genel kurallar.</span></div>
<div id="cap-057" class="cap clip" data-start="113.297" data-duration="1.897" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-058" class="cap clip" data-start="119.544" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-059" class="cap clip" data-start="120.424" data-duration="0.89" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-060" class="cap clip" data-start="121.544" data-duration="2.64" data-track-index="0"><span><b>Ek notlar</b> Armonize Sistemin değil,</span></div>
<div id="cap-061" class="cap clip" data-start="124.184" data-duration="2.8" data-track-index="0"><span>Avrupa Birliği Kombine Nomanklatürünün ve ulusal</span></div>
<div id="cap-062" class="cap clip" data-start="126.984" data-duration="1.6" data-track-index="0"><span>tarifenin parçasıdır;</span></div>
<div id="cap-063" class="cap clip" data-start="128.584" data-duration="2.64" data-track-index="0"><span><b>6</b> haneden sonraki ayrıntıyı yorumlar.</span></div>
<div id="cap-064" class="cap clip" data-start="131.224" data-duration="2.16" data-track-index="0"><span>Bölüm notları, fasıl notları,</span></div>
<div id="cap-065" class="cap clip" data-start="133.384" data-duration="2.84" data-track-index="0"><span>alt pozisyon notları ve genel yorum kuralları</span></div>
<div id="cap-066" class="cap clip" data-start="136.224" data-duration="3.08" data-track-index="0"><span>ise doğrudan Armonize Sistemden gelir ve bütün</span></div>
<div id="cap-067" class="cap clip" data-start="139.304" data-duration="1.806" data-track-index="0"><span>üye ülkelerde <b>ortaktır</b>.</span></div>
<div id="cap-068" class="cap clip" data-start="141.94" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-069" class="cap clip" data-start="143.46" data-duration="3.28" data-track-index="0"><span>Stajyerimiz, alt pozisyon deyince ulusal açılımı</span></div>
<div id="cap-070" class="cap clip" data-start="146.74" data-duration="2.16" data-track-index="0"><span>düşündü ve D şıkkını seçti.</span></div>
<div id="cap-071" class="cap clip" data-start="148.9" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-072" class="cap clip" data-start="149.78" data-duration="3.2" data-track-index="0"><span><b>6</b> haneli alt pozisyonlar <b>Armonize Sistemindir</b>;</span></div>
<div id="cap-073" class="cap clip" data-start="152.98" data-duration="1.76" data-track-index="0"><span>alt pozisyon notları da öyle.</span></div>
<div id="cap-074" class="cap clip" data-start="154.74" data-duration="1.84" data-track-index="0"><span>Avrupa Birliği ve ulusal düzey,</span></div>
<div id="cap-075" class="cap clip" data-start="156.58" data-duration="1.92" data-track-index="0"><span><b>7</b>. haneden sonra başlar.</span></div>
<div id="cap-076" class="cap clip" data-start="158.5" data-duration="0.96" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-077" class="cap clip" data-start="159.46" data-duration="3.44" data-track-index="0"><span><b>Ek notlar</b> <b>8</b> ve daha fazla haneli ayrıntıyı yorumladığı</span></div>
<div id="cap-078" class="cap clip" data-start="162.9" data-duration="2.33" data-track-index="0"><span>için ülkeden ülkeye değişebilir.</span></div>
<div id="cap-079" class="cap clip" data-start="165.3" data-duration="1.76" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-080" class="cap clip" data-start="167.06" data-duration="2.374" data-track-index="0"><span>Notun hangi haneyi yorumladığına bakın.</span></div>
<div id="cap-081" class="cap clip" data-start="170.184" data-duration="1.2" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-082" class="cap clip" data-start="171.384" data-duration="3.44" data-track-index="0"><span>Türkiye&#x27;de tarife sınıflandırması yapılırken aşağıdakilerden</span></div>
<div id="cap-083" class="cap clip" data-start="174.824" data-duration="2.72" data-track-index="0"><span>hangisi bağlayıcı bir kaynak değildir?</span></div>
<div id="cap-084" class="cap clip" data-start="177.544" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-085" class="cap clip" data-start="178.504" data-duration="2.0" data-track-index="0"><span>Türk Gümrük Tarife Cetveli.</span></div>
<div id="cap-086" class="cap clip" data-start="180.504" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-087" class="cap clip" data-start="181.384" data-duration="2.65" data-track-index="0"><span>Tarifenin yorumuna ilişkin genel kurallar.</span></div>
<div id="cap-088" class="cap clip" data-start="184.184" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-089" class="cap clip" data-start="185.144" data-duration="2.72" data-track-index="0"><span>Gümrük Genel Tebliği ile yayımlanan Gümrük Tarife</span></div>
<div id="cap-090" class="cap clip" data-start="187.864" data-duration="1.68" data-track-index="0"><span>Cetveli İzahnamesi.</span></div>
<div id="cap-091" class="cap clip" data-start="189.544" data-duration="0.89" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-092" class="cap clip" data-start="190.504" data-duration="3.04" data-track-index="0"><span>Gümrük Genel Tebliği ile yayımlanan tarife sınıflandırma</span></div>
<div id="cap-093" class="cap clip" data-start="193.544" data-duration="1.04" data-track-index="0"><span>kararları.</span></div>
<div id="cap-094" class="cap clip" data-start="194.584" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-095" class="cap clip" data-start="195.464" data-duration="3.2" data-track-index="0"><span>Avrupa Birliği Bağlayıcı Tarife Bilgisi veri tabanındaki</span></div>
<div id="cap-096" class="cap clip" data-start="198.664" data-duration="0.81" data-track-index="0"><span>kararlar.</span></div>
<div id="cap-097" class="cap clip" data-start="199.704" data-duration="1.816" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-098" class="cap clip" data-start="205.87" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-099" class="cap clip" data-start="206.67" data-duration="1.04" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-100" class="cap clip" data-start="207.71" data-duration="2.56" data-track-index="0"><span>Avrupa Birliği Bağlayıcı Tarife Bilgileri,</span></div>
<div id="cap-101" class="cap clip" data-start="210.27" data-duration="3.32" data-track-index="0"><span>ülkemizde yalnızca <b>yardımcı bir referans</b> kaynaktır;</span></div>
<div id="cap-102" class="cap clip" data-start="213.59" data-duration="1.987" data-track-index="0"><span>resmî bir <b>bağlayıcılığı yoktur</b>.</span></div>
<div id="cap-103" class="cap clip" data-start="215.577" data-duration="3.013" data-track-index="0"><span>Gümrükler Genel Müdürlüğünün <b>2020</b> tarihli yazısı</span></div>
<div id="cap-104" class="cap clip" data-start="218.59" data-duration="1.76" data-track-index="0"><span>da bunu açıkça belirtir.</span></div>
<div id="cap-105" class="cap clip" data-start="220.35" data-duration="1.72" data-track-index="0"><span>Diğerleri <b>bağlayıcıdır</b>:</span></div>
<div id="cap-106" class="cap clip" data-start="222.07" data-duration="2.76" data-track-index="0"><span>Tarife cetveli ve genel yorum kuralları cetvelin</span></div>
<div id="cap-107" class="cap clip" data-start="224.83" data-duration="1.0" data-track-index="0"><span>kendisidir;</span></div>
<div id="cap-108" class="cap clip" data-start="225.83" data-duration="2.76" data-track-index="0"><span>izahname ve sınıflandırma kararları ise Gümrük</span></div>
<div id="cap-109" class="cap clip" data-start="228.59" data-duration="1.981" data-track-index="0"><span>Genel Tebliği olarak yayımlanır.</span></div>
<div id="cap-110" class="cap clip" data-start="231.401" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-111" class="cap clip" data-start="232.921" data-duration="2.8" data-track-index="0"><span>Yardımcımız, aynı eşya için Avrupa Birliği&#x27;nde</span></div>
<div id="cap-112" class="cap clip" data-start="235.721" data-duration="2.0" data-track-index="0"><span>verilmiş bir BTB bulunca,</span></div>
<div id="cap-113" class="cap clip" data-start="237.721" data-duration="2.4" data-track-index="0"><span>sınıflandırmayı doğrudan ona dayandırdı.</span></div>
<div id="cap-114" class="cap clip" data-start="240.121" data-duration="0.72" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-115" class="cap clip" data-start="240.841" data-duration="3.04" data-track-index="0"><span>Avrupa Birliği veri tabanında aynı eşya için farklı</span></div>
<div id="cap-116" class="cap clip" data-start="243.881" data-duration="2.72" data-track-index="0"><span>pozisyonlardan verilmiş kararlar bile olabilir;</span></div>
<div id="cap-117" class="cap clip" data-start="246.601" data-duration="1.6" data-track-index="0"><span><b>tek başına</b> dayanak olamaz.</span></div>
<div id="cap-118" class="cap clip" data-start="248.201" data-duration="0.96" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-119" class="cap clip" data-start="249.161" data-duration="2.84" data-track-index="0"><span>Ülkemizde verilen BTB ise gümrük idaresini,</span></div>
<div id="cap-120" class="cap clip" data-start="252.001" data-duration="1.72" data-track-index="0"><span>hak sahibine karşı bağlar.</span></div>
<div id="cap-121" class="cap clip" data-start="253.721" data-duration="0.8" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-122" class="cap clip" data-start="254.521" data-duration="2.4" data-track-index="0"><span>Avrupa Birliği BTB&#x27;si <b>yol gösterir</b>,</span></div>
<div id="cap-123" class="cap clip" data-start="256.921" data-duration="1.243" data-track-index="0"><span>karar vermez.</span></div>
<div id="cap-124" class="cap clip" data-start="258.994" data-duration="0.97" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-125" class="cap clip" data-start="260.114" data-duration="1.37" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-126" class="cap clip" data-start="261.634" data-duration="0.693" data-track-index="0"><span>Bir:</span></div>
<div id="cap-127" class="cap clip" data-start="262.327" data-duration="1.347" data-track-index="0"><span><b>25.01</b>;</span></div>
<div id="cap-128" class="cap clip" data-start="263.674" data-duration="2.8" data-track-index="0"><span>tuz, saf sodyum klorür ve deniz suyudur,</span></div>
<div id="cap-129" class="cap clip" data-start="266.474" data-duration="1.36" data-track-index="0"><span>maden suyu değil.</span></div>
<div id="cap-130" class="cap clip" data-start="267.834" data-duration="0.64" data-track-index="0"><span>İki:</span></div>
<div id="cap-131" class="cap clip" data-start="268.474" data-duration="2.88" data-track-index="0"><span>Bölüm, fasıl ve alt pozisyon notları Armonize</span></div>
<div id="cap-132" class="cap clip" data-start="271.354" data-duration="0.76" data-track-index="0"><span>Sistemin;</span></div>
<div id="cap-133" class="cap clip" data-start="272.114" data-duration="2.84" data-track-index="0"><span><b>ek notlar</b> ise Kombine Nomanklatürün ve ulusal</span></div>
