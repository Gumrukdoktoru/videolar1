<div id="cap-001" class="cap clip" data-start="1.68" data-duration="2.96" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla vergi hesaplama</span></div>
<div id="cap-002" class="cap clip" data-start="4.64" data-duration="2.4" data-track-index="0"><span>derslerinin yedincisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="7.04" data-duration="3.0" data-track-index="0"><span>Bugünün konusu kaynak kullanımını destekleme fonu,</span></div>
<div id="cap-004" class="cap clip" data-start="10.04" data-duration="1.8" data-track-index="0"><span>yani <b>KKDF</b>.</span></div>
<div id="cap-005" class="cap clip" data-start="11.84" data-duration="2.2" data-track-index="0"><span>Vadeli ithalatta karşımıza çıkar;</span></div>
<div id="cap-006" class="cap clip" data-start="14.04" data-duration="2.08" data-track-index="0"><span>matrahı farklı, kuru farklı.</span></div>
<div id="cap-007" class="cap clip" data-start="16.12" data-duration="2.52" data-track-index="0"><span>Peki <b>KDV matrahına</b> girer mi?</span></div>
<div id="cap-008" class="cap clip" data-start="18.64" data-duration="2.279" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="21.669" data-duration="1.45" data-track-index="0"><span>Önce soruyu okuyalım.</span></div>
<div id="cap-010" class="cap clip" data-start="23.269" data-duration="3.12" data-track-index="0"><span>Z firması, Amerika&#x27;dan kabul kredili ödemeyle</span></div>
<div id="cap-011" class="cap clip" data-start="26.389" data-duration="2.09" data-track-index="0"><span>bir ambalaj makinesi ithal ediyor.</span></div>
<div id="cap-012" class="cap clip" data-start="28.549" data-duration="3.12" data-track-index="0"><span>Fatura bedeli FOB <b>30.000</b> dolar.</span></div>
<div id="cap-013" class="cap clip" data-start="31.669" data-duration="3.04" data-track-index="0"><span>Navlun <b>1.500</b>, sigorta <b>500</b> dolar.</span></div>
<div id="cap-014" class="cap clip" data-start="34.709" data-duration="3.92" data-track-index="0"><span>Gümrük vergisi <b>%5</b>, KKDF <b>%6</b>,</span></div>
<div id="cap-015" class="cap clip" data-start="38.629" data-duration="1.76" data-track-index="0"><span>KDV <b>%20</b>.</span></div>
<div id="cap-016" class="cap clip" data-start="40.389" data-duration="2.64" data-track-index="0"><span>Merkez Bankası döviz satış kuru <b>40</b> lira,</span></div>
<div id="cap-017" class="cap clip" data-start="43.029" data-duration="2.96" data-track-index="0"><span>döviz alış kuru <b>39,50</b> lira.</span></div>
<div id="cap-018" class="cap clip" data-start="45.989" data-duration="0.8" data-track-index="0"><span>Soru şu:</span></div>
<div id="cap-019" class="cap clip" data-start="46.789" data-duration="3.316" data-track-index="0"><span>İthalatta ödenecek KDV kaç Türk lirasıdır?</span></div>
<div id="cap-020" class="cap clip" data-start="50.855" data-duration="1.44" data-track-index="0"><span>Şıklarımız şöyle.</span></div>
<div id="cap-021" class="cap clip" data-start="52.295" data-duration="3.52" data-track-index="0"><span>A şıkkı, <b>268.800</b> lira.</span></div>
<div id="cap-022" class="cap clip" data-start="55.815" data-duration="3.16" data-track-index="0"><span>B şıkkı, <b>283.020</b> lira.</span></div>
<div id="cap-023" class="cap clip" data-start="58.975" data-duration="3.16" data-track-index="0"><span>C şıkkı, <b>283.200</b> lira.</span></div>
<div id="cap-024" class="cap clip" data-start="62.135" data-duration="3.72" data-track-index="0"><span>D şıkkı, <b>283.731</b> lira.</span></div>
<div id="cap-025" class="cap clip" data-start="65.855" data-duration="3.61" data-track-index="0"><span>E şıkkı, <b>283.968</b> lira.</span></div>
<div id="cap-026" class="cap clip" data-start="70.535" data-duration="2.774" data-track-index="0"><span>Videoyu durdurun ve önce kendiniz çözün.</span></div>
<div id="cap-027" class="cap clip" data-start="79.339" data-duration="1.97" data-track-index="0"><span>Hazırsanız başlayalım.</span></div>
<div id="cap-028" class="cap clip" data-start="81.339" data-duration="2.0" data-track-index="0"><span>Bu sorunun üç anahtarı var.</span></div>
<div id="cap-029" class="cap clip" data-start="83.339" data-duration="0.64" data-track-index="0"><span>Bir:</span></div>
<div id="cap-030" class="cap clip" data-start="83.979" data-duration="3.04" data-track-index="0"><span>Gümrük kıymeti, Merkez Bankası döviz <b>satış kuruyla</b></span></div>
<div id="cap-031" class="cap clip" data-start="87.019" data-duration="1.6" data-track-index="0"><span>Türk lirasına çevrilir.</span></div>
<div id="cap-032" class="cap clip" data-start="88.619" data-duration="0.72" data-track-index="0"><span>İki:</span></div>
<div id="cap-033" class="cap clip" data-start="89.339" data-duration="3.44" data-track-index="0"><span><b>KKDF</b>, <b>fatura bedeli</b> üzerinden hesaplanır ve döviz</span></div>
<div id="cap-034" class="cap clip" data-start="92.779" data-duration="1.28" data-track-index="0"><span><b>alış kuru</b> kullanılır;</span></div>
<div id="cap-035" class="cap clip" data-start="94.059" data-duration="2.24" data-track-index="0"><span><b>gümrük vergisi matrahına</b> girmez.</span></div>
<div id="cap-036" class="cap clip" data-start="96.299" data-duration="0.64" data-track-index="0"><span>Üç:</span></div>
<div id="cap-037" class="cap clip" data-start="96.939" data-duration="3.72" data-track-index="0"><span><b>KKDF</b>, ithalatta ödenen bir fon olduğu için KDV</span></div>
<div id="cap-038" class="cap clip" data-start="100.659" data-duration="1.368" data-track-index="0"><span>matrahına eklenir.</span></div>
<div id="cap-039" class="cap clip" data-start="102.777" data-duration="1.12" data-track-index="0"><span>Birinci adım:</span></div>

<div id="cap-044" class="cap clip" data-start="113.177" data-duration="2.2" data-track-index="0"><span><b>1.280.000</b> lira.</span></div>
<div id="cap-045" class="cap clip" data-start="115.377" data-duration="2.0" data-track-index="0"><span>Gümrük vergisi <b>%5</b>:</span></div>

<div id="cap-047" class="cap clip" data-start="119.503" data-duration="1.12" data-track-index="0"><span>İkinci adım:</span></div>
<div id="cap-048" class="cap clip" data-start="120.623" data-duration="1.29" data-track-index="0"><span><b>KKDF</b>.</span></div>
<div id="cap-049" class="cap clip" data-start="122.143" data-duration="2.88" data-track-index="0"><span>Matrah, <b>fatura bedeli</b> olan <b>30.000</b> dolar;</span></div>
<div id="cap-050" class="cap clip" data-start="125.023" data-duration="2.04" data-track-index="0"><span>navlun ve sigorta eklenmez.</span></div>
<div id="cap-051" class="cap clip" data-start="127.063" data-duration="2.52" data-track-index="0"><span><b>%6</b>&#x27;sı, <b>1.800</b> dolar.</span></div>
<div id="cap-052" class="cap clip" data-start="129.583" data-duration="2.64" data-track-index="0"><span>Türk lirasına çevirirken bu kez döviz <b>alış kurunu</b></span></div>
<div id="cap-053" class="cap clip" data-start="132.223" data-duration="0.96" data-track-index="0"><span>kullanıyoruz:</span></div>
<div id="cap-054" class="cap clip" data-start="133.183" data-duration="4.777" data-track-index="0"><span><b>1.800</b> × <b>39,50</b>, <b>71.100</b> lira.</span></div>
<div id="cap-055" class="cap clip" data-start="138.71" data-duration="1.12" data-track-index="0"><span>Üçüncü adım:</span></div>
<div id="cap-056" class="cap clip" data-start="139.83" data-duration="1.21" data-track-index="0"><span>KDV.</span></div>
<div id="cap-057" class="cap clip" data-start="141.19" data-duration="1.45" data-track-index="0"><span>KDV matrahı;</span></div>
<div id="cap-058" class="cap clip" data-start="142.79" data-duration="4.88" data-track-index="0"><span><b>1.280.000</b> kıymet, + <b>64.000</b> gümrük vergisi,</span></div>
<div id="cap-059" class="cap clip" data-start="147.67" data-duration="3.04" data-track-index="0"><span>+ <b>71.100</b> <b>KKDF</b>:</span></div>
<div id="cap-060" class="cap clip" data-start="150.71" data-duration="2.4" data-track-index="0"><span><b>1.415.100</b> lira.</span></div>
<div id="cap-061" class="cap clip" data-start="153.11" data-duration="3.483" data-track-index="0"><span>Bunun <b>%20</b>&#x27;si, <b>283.020</b> lira.</span></div>
<div id="cap-062" class="cap clip" data-start="157.343" data-duration="1.04" data-track-index="0"><span>Ve sonuç:</span></div>
<div id="cap-063" class="cap clip" data-start="158.383" data-duration="3.96" data-track-index="0"><span>KDV matrahı <b>1.415.100</b> lira;</span></div>
<div id="cap-064" class="cap clip" data-start="162.343" data-duration="3.2" data-track-index="0"><span><b>%20</b>&#x27;si, <b>283.020</b> lira.</span></div>

<div id="cap-067" class="cap clip" data-start="168.377" data-duration="2.2" data-track-index="0"><span>Şimdi <b>tuzaklara</b> bakalım;</span></div>
<div id="cap-068" class="cap clip" data-start="170.577" data-duration="2.6" data-track-index="0"><span>her yanlış şık, bir hatanın sonucu.</span></div>
<div id="cap-069" class="cap clip" data-start="173.177" data-duration="3.6" data-track-index="0"><span><b>KKDF</b>&#x27;yi <b>KDV matrahına</b> hiç eklemeyen,</span></div>

<div id="cap-073" class="cap clip" data-start="185.737" data-duration="3.04" data-track-index="0"><span><b>KKDF</b>&#x27;yi <b>gümrük vergisi matrahına</b> da katan,</span></div>
<div id="cap-074" class="cap clip" data-start="188.777" data-duration="3.6" data-track-index="0"><span><b>D şıkkına</b>, <b>283.731</b>&#x27;e ulaşır.</span></div>
<div id="cap-075" class="cap clip" data-start="192.377" data-duration="4.64" data-track-index="0"><span><b>KKDF</b>&#x27;yi CIF bedel üzerinden hesaplayan ise <b>E şıkkına</b>,</span></div>
<div id="cap-076" class="cap clip" data-start="197.017" data-duration="3.006" data-track-index="0"><span><b>283.968</b>&#x27;e çıkar.</span></div>
<div id="cap-077" class="cap clip" data-start="200.933" data-duration="1.28" data-track-index="0"><span>Bir uyarı daha:</span></div>
<div id="cap-078" class="cap clip" data-start="202.213" data-duration="2.72" data-track-index="0"><span><b>KKDF</b> her ithalatta alınmaz.</span></div>
<div id="cap-079" class="cap clip" data-start="204.933" data-duration="1.36" data-track-index="0"><span><b>Peşin ödemede</b> değil;</span></div>
<div id="cap-080" class="cap clip" data-start="206.293" data-duration="3.52" data-track-index="0"><span><b>kabul kredili</b>, <b>vadeli akreditifli</b> veya <b>mal mukabili</b></span></div>
<div id="cap-081" class="cap clip" data-start="209.813" data-duration="2.613" data-track-index="0"><span>gibi vadeli ödeme şekillerinde gündeme gelir.</span></div>

<div id="cap-083" class="cap clip" data-start="213.093" data-duration="3.36" data-track-index="0"><span><b>KKDF</b> gümrük kıymetine ve <b>gümrük vergisi matrahına</b></span></div>
<div id="cap-084" class="cap clip" data-start="216.453" data-duration="0.72" data-track-index="0"><span>girmez;</span></div>
<div id="cap-085" class="cap clip" data-start="217.173" data-duration="2.606" data-track-index="0"><span>yalnızca <b>KDV matrahına</b> eklenir.</span></div>
<div id="cap-086" class="cap clip" data-start="220.609" data-duration="1.12" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-087" class="cap clip" data-start="221.729" data-duration="3.16" data-track-index="0"><span>Aynı soruda iki farklı kur görürseniz şaşırmayın.</span></div>
<div id="cap-088" class="cap clip" data-start="224.889" data-duration="2.64" data-track-index="0"><span>Gümrük kıymeti ve vergiler <b>satış kuruyla</b>,</span></div>
<div id="cap-089" class="cap clip" data-start="227.529" data-duration="2.84" data-track-index="0"><span><b>KKDF</b> ise <b>alış kuruyla</b> hesaplanır.</span></div>
<div id="cap-090" class="cap clip" data-start="230.369" data-duration="2.76" data-track-index="0"><span><b>KKDF</b>&#x27;nin matrahı da fatura bedelidir;</span></div>

<div id="cap-094" class="cap clip" data-start="239.889" data-duration="1.64" data-track-index="0"><span>Kıymeti <b>satış kuruyla</b> bul,</span></div>
<div id="cap-095" class="cap clip" data-start="241.529" data-duration="1.64" data-track-index="0"><span>gümrük vergisini hesapla,</span></div>
<div id="cap-096" class="cap clip" data-start="243.169" data-duration="2.08" data-track-index="0"><span><b>KKDF</b>&#x27;yi <b>alış kuruyla</b> bul,</span></div>
<div id="cap-097" class="cap clip" data-start="245.249" data-duration="2.32" data-track-index="0"><span>hepsini <b>KDV matrahına</b> ekle,</span></div>
<div id="cap-098" class="cap clip" data-start="247.569" data-duration="1.657" data-track-index="0"><span>KDV&#x27;yi hesapla.</span></div>
<div id="cap-099" class="cap clip" data-start="249.976" data-duration="0.96" data-track-index="0"><span>Özetle:</span></div>

<div id="cap-101" class="cap clip" data-start="255.536" data-duration="2.68" data-track-index="0"><span><b>KKDF</b> <b>71.100</b> lira.</span></div>
<div id="cap-102" class="cap clip" data-start="258.216" data-duration="2.28" data-track-index="0"><span>Hepsi <b>KDV matrahına</b> girdi;</span></div>
<div id="cap-103" class="cap clip" data-start="260.496" data-duration="1.8" data-track-index="0"><span>KDV, <b>B şıkkı</b>:</span></div>

<div id="cap-105" class="cap clip" data-start="264.456" data-duration="3.08" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
