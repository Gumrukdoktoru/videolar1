<div id="cap-001" class="cap clip" data-start="1.744" data-duration="3.136" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>

<div id="cap-005" class="cap clip" data-start="11.44" data-duration="0.96" data-track-index="0"><span>Ekip hazır:</span></div>

<div id="cap-018" class="cap clip" data-start="36.839" data-duration="1.64" data-track-index="0"><span><b>63.04</b>.</span></div>

<div id="cap-020" class="cap clip" data-start="39.479" data-duration="1.72" data-track-index="0"><span><b>63.08</b>.</span></div>
