      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="265.85">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.0" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla vergi hesaplama</span></div>
<div id="cap-002" class="cap clip" data-start="4.68" data-duration="2.52" data-track-index="0"><span>derslerinin sekizincisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="7.2" data-duration="2.16" data-track-index="0"><span>Bugünün konusu vergi zinciri:</span></div>
<div id="cap-004" class="cap clip" data-start="9.36" data-duration="2.88" data-track-index="0"><span><b>gümrük vergisi</b>, <b>TRT bandrol</b> ücreti,</span></div>
<div id="cap-005" class="cap clip" data-start="12.24" data-duration="2.69" data-track-index="0"><span><b>özel tüketim vergisi</b> ve KDV.</span></div>
<div id="cap-006" class="cap clip" data-start="14.96" data-duration="2.667" data-track-index="0"><span>Her vergi <b>bir sonrakinin</b> matrahına girer.</span></div>
<div id="cap-007" class="cap clip" data-start="17.627" data-duration="2.253" data-track-index="0"><span>Sırayı karıştırırsanız sonuç değişir.</span></div>
<div id="cap-008" class="cap clip" data-start="19.88" data-duration="2.241" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="22.871" data-duration="1.45" data-track-index="0"><span>Önce soruyu okuyalım.</span></div>
<div id="cap-010" class="cap clip" data-start="24.471" data-duration="2.96" data-track-index="0"><span>M firması, Çin&#x27;den <b>100</b> adet cep telefonu ithal</span></div>
<div id="cap-011" class="cap clip" data-start="27.431" data-duration="0.72" data-track-index="0"><span>ediyor.</span></div>
<div id="cap-012" class="cap clip" data-start="28.151" data-duration="2.36" data-track-index="0"><span>CIF kıymet <b>20.000</b> dolar,</span></div>
<div id="cap-013" class="cap clip" data-start="30.511" data-duration="1.2" data-track-index="0"><span>kur <b>40</b> lira.</span></div>
<div id="cap-014" class="cap clip" data-start="31.711" data-duration="4.44" data-track-index="0"><span>Gümrük vergisi <b>%5</b>, TRT bandrol ücreti <b>%10</b>,</span></div>
<div id="cap-015" class="cap clip" data-start="36.151" data-duration="2.44" data-track-index="0"><span>özel tüketim vergisi <b>%20</b>,</span></div>
<div id="cap-016" class="cap clip" data-start="38.591" data-duration="1.84" data-track-index="0"><span>KDV <b>%20</b>.</span></div>
<div id="cap-017" class="cap clip" data-start="40.431" data-duration="0.92" data-track-index="0"><span>Soru şu:</span></div>
<div id="cap-018" class="cap clip" data-start="41.351" data-duration="1.68" data-track-index="0"><span>Ödenecek gümrük vergisi,</span></div>
<div id="cap-019" class="cap clip" data-start="43.031" data-duration="4.854" data-track-index="0"><span>bandrol ücreti, ÖTV ve KDV toplamı kaç Türk lirasıdır?</span></div>
<div id="cap-020" class="cap clip" data-start="48.635" data-duration="1.44" data-track-index="0"><span>Şıklarımız şöyle.</span></div>
<div id="cap-021" class="cap clip" data-start="50.075" data-duration="3.28" data-track-index="0"><span>A şıkkı, <b>467.200</b> lira.</span></div>
<div id="cap-022" class="cap clip" data-start="53.355" data-duration="3.44" data-track-index="0"><span>B şıkkı, <b>493.600</b> lira.</span></div>
<div id="cap-023" class="cap clip" data-start="56.795" data-duration="3.12" data-track-index="0"><span>C şıkkı, <b>510.400</b> lira.</span></div>
<div id="cap-024" class="cap clip" data-start="59.915" data-duration="3.44" data-track-index="0"><span>D şıkkı, <b>524.800</b> lira.</span></div>
<div id="cap-025" class="cap clip" data-start="63.355" data-duration="3.21" data-track-index="0"><span>E şıkkı, <b>530.560</b> lira.</span></div>
<div id="cap-026" class="cap clip" data-start="67.595" data-duration="2.841" data-track-index="0"><span>Videoyu durdurun ve önce kendiniz çözün.</span></div>
<div id="cap-027" class="cap clip" data-start="76.466" data-duration="2.05" data-track-index="0"><span>Hazırsanız başlayalım.</span></div>
<div id="cap-028" class="cap clip" data-start="78.546" data-duration="2.0" data-track-index="0"><span>Bu sorunun üç anahtarı var.</span></div>
<div id="cap-029" class="cap clip" data-start="80.546" data-duration="0.72" data-track-index="0"><span>Bir:</span></div>
<div id="cap-030" class="cap clip" data-start="81.266" data-duration="1.68" data-track-index="0"><span>Sıra her zaman aynıdır;</span></div>
<div id="cap-031" class="cap clip" data-start="82.946" data-duration="1.92" data-track-index="0"><span><b>gümrük vergisi</b>, <b>bandrol</b>,</span></div>
<div id="cap-032" class="cap clip" data-start="84.866" data-duration="2.76" data-track-index="0"><span><b>ÖTV</b> ve <b>en son</b> KDV.</span></div>
<div id="cap-033" class="cap clip" data-start="87.626" data-duration="0.8" data-track-index="0"><span>İki:</span></div>
<div id="cap-034" class="cap clip" data-start="88.426" data-duration="3.56" data-track-index="0"><span><b>Bandrol</b> matrahı, <b>ÖTV</b> hariç KDV matrahıdır;</span></div>
<div id="cap-035" class="cap clip" data-start="91.986" data-duration="2.56" data-track-index="0"><span>yani kıymet + <b>gümrük vergisi</b>.</span></div>
<div id="cap-036" class="cap clip" data-start="94.546" data-duration="0.64" data-track-index="0"><span>Üç:</span></div>
<div id="cap-037" class="cap clip" data-start="95.186" data-duration="2.68" data-track-index="0"><span>Her vergi <b>bir sonrakinin</b> matrahına eklenir;</span></div>
<div id="cap-038" class="cap clip" data-start="97.866" data-duration="4.318" data-track-index="0"><span><b>ÖTV</b> matrahına <b>bandrol</b>, <b>KDV matrahına</b> <b>ÖTV</b> girer.</span></div>
<div id="cap-039" class="cap clip" data-start="102.934" data-duration="1.12" data-track-index="0"><span>Birinci adım:</span></div>
<div id="cap-040" class="cap clip" data-start="104.054" data-duration="2.0" data-track-index="0"><span>kıymet ve <b>gümrük vergisi</b>.</span></div>
<div id="cap-041" class="cap clip" data-start="106.054" data-duration="2.04" data-track-index="0"><span><b>20.000</b> dolar × <b>40</b>:</span></div>
<div id="cap-042" class="cap clip" data-start="108.094" data-duration="1.28" data-track-index="0"><span><b>800.000</b> lira.</span></div>
<div id="cap-043" class="cap clip" data-start="109.374" data-duration="2.0" data-track-index="0"><span><b>Gümrük vergisi</b> <b>%5</b>:</span></div>
<div id="cap-044" class="cap clip" data-start="111.374" data-duration="1.057" data-track-index="0"><span><b>40.000</b> lira.</span></div>
<div id="cap-045" class="cap clip" data-start="113.181" data-duration="1.12" data-track-index="0"><span>İkinci adım:</span></div>
<div id="cap-046" class="cap clip" data-start="114.301" data-duration="2.05" data-track-index="0"><span><b>bandrol</b> ve <b>ÖTV</b>.</span></div>
<div id="cap-047" class="cap clip" data-start="116.381" data-duration="3.28" data-track-index="0"><span><b>Bandrol</b> matrahı, <b>800.000</b> + <b>40.000</b>:</span></div>
<div id="cap-048" class="cap clip" data-start="119.661" data-duration="1.56" data-track-index="0"><span><b>840.000</b> lira.</span></div>
<div id="cap-049" class="cap clip" data-start="121.221" data-duration="2.44" data-track-index="0"><span><b>%10</b>&#x27;u, <b>84.000</b> lira.</span></div>
<div id="cap-050" class="cap clip" data-start="123.661" data-duration="2.4" data-track-index="0"><span><b>ÖTV</b> matrahına <b>bandrol</b> de girer:</span></div>
<div id="cap-051" class="cap clip" data-start="126.061" data-duration="4.4" data-track-index="0"><span><b>840.000</b> + <b>84.000</b>, <b>924.000</b> lira.</span></div>
<div id="cap-052" class="cap clip" data-start="130.461" data-duration="3.476" data-track-index="0"><span><b>%20</b>&#x27;si, <b>184.800</b> lira.</span></div>
<div id="cap-053" class="cap clip" data-start="134.687" data-duration="1.24" data-track-index="0"><span>Üçüncü adım:</span></div>
<div id="cap-054" class="cap clip" data-start="135.927" data-duration="1.32" data-track-index="0"><span>KDV.</span></div>
<div id="cap-055" class="cap clip" data-start="137.247" data-duration="2.773" data-track-index="0"><span><b>KDV matrahına</b> <b>ÖTV</b> de girer:</span></div>
<div id="cap-056" class="cap clip" data-start="140.02" data-duration="6.387" data-track-index="0"><span><b>924.000</b> + <b>184.800</b>, <b>1.108.800</b> lira.</span></div>
<div id="cap-057" class="cap clip" data-start="146.407" data-duration="3.603" data-track-index="0"><span><b>%20</b>&#x27;si, <b>221.760</b> lira.</span></div>
<div id="cap-058" class="cap clip" data-start="150.76" data-duration="1.12" data-track-index="0"><span>Ve sonuç:</span></div>
<div id="cap-059" class="cap clip" data-start="151.88" data-duration="3.6" data-track-index="0"><span><b>40.000</b> <b>gümrük vergisi</b>, + <b>84.000</b> <b>bandrol</b>,</span></div>
<div id="cap-060" class="cap clip" data-start="155.48" data-duration="6.56" data-track-index="0"><span>+ <b>184.800</b> <b>ÖTV</b>, + <b>221.760</b> KDV.</span></div>
<div id="cap-061" class="cap clip" data-start="162.04" data-duration="3.44" data-track-index="0"><span>Ödenecek toplam, <b>530.560</b> lira.</span></div>
<div id="cap-062" class="cap clip" data-start="165.48" data-duration="1.04" data-track-index="0"><span>Doğru cevap:</span></div>
<div id="cap-063" class="cap clip" data-start="166.52" data-duration="0.921" data-track-index="0"><span><b>E şıkkı</b>!</span></div>
<div id="cap-064" class="cap clip" data-start="168.351" data-duration="2.16" data-track-index="0"><span>Şimdi <b>tuzaklara</b> bakalım;</span></div>
<div id="cap-065" class="cap clip" data-start="170.511" data-duration="2.77" data-track-index="0"><span>her yanlış şık, bir hatanın sonucu.</span></div>
<div id="cap-066" class="cap clip" data-start="173.311" data-duration="2.16" data-track-index="0"><span>Gümrük vergisini hesaplamayı unutan,</span></div>
<div id="cap-067" class="cap clip" data-start="175.471" data-duration="3.52" data-track-index="0"><span><b>A şıkkına</b>, <b>467.200</b>&#x27;e düşer.</span></div>
<div id="cap-068" class="cap clip" data-start="178.991" data-duration="2.96" data-track-index="0"><span><b>ÖTV</b>&#x27;yi <b>KDV matrahına</b> eklemeyen,</span></div>
<div id="cap-069" class="cap clip" data-start="181.951" data-duration="3.44" data-track-index="0"><span><b>B şıkkına</b>, <b>493.600</b>&#x27;e iner.</span></div>
<div id="cap-070" class="cap clip" data-start="185.391" data-duration="2.72" data-track-index="0"><span><b>Bandrolü</b> <b>ÖTV</b> matrahına katmayan,</span></div>
<div id="cap-071" class="cap clip" data-start="188.111" data-duration="2.96" data-track-index="0"><span><b>C şıkkına</b>, <b>510.400</b>&#x27;e gider.</span></div>
<div id="cap-072" class="cap clip" data-start="191.071" data-duration="2.88" data-track-index="0"><span><b>Bandrol</b> matrahına gümrük vergisini eklemeyen ise</span></div>
<div id="cap-073" class="cap clip" data-start="193.951" data-duration="3.564" data-track-index="0"><span><b>D şıkkına</b>, <b>524.800</b>&#x27;e ulaşır.</span></div>
<div id="cap-074" class="cap clip" data-start="198.425" data-duration="1.25" data-track-index="0"><span>Bir uyarı daha:</span></div>
<div id="cap-075" class="cap clip" data-start="199.705" data-duration="3.44" data-track-index="0"><span><b>TRT bandrol</b> ücretinin matrahında <b>ÖTV</b> yoktur;</span></div>
<div id="cap-076" class="cap clip" data-start="203.145" data-duration="3.04" data-track-index="0"><span>çünkü <b>bandrol</b>, <b>ÖTV</b>&#x27;den önce hesaplanır.</span></div>
<div id="cap-077" class="cap clip" data-start="206.185" data-duration="2.72" data-track-index="0"><span><b>ÖTV</b> matrahında ise KDV yoktur.</span></div>
<div id="cap-078" class="cap clip" data-start="208.905" data-duration="1.12" data-track-index="0"><span>Kural basit:</span></div>
<div id="cap-079" class="cap clip" data-start="210.025" data-duration="2.8" data-track-index="0"><span>Her vergi, kendinden önce hesaplananları matrahına</span></div>
<div id="cap-080" class="cap clip" data-start="212.825" data-duration="0.453" data-track-index="0"><span>alır;</span></div>
<div id="cap-081" class="cap clip" data-start="213.278" data-duration="1.827" data-track-index="0"><span>kendinden sonrakileri almaz.</span></div>
<div id="cap-082" class="cap clip" data-start="215.105" data-duration="0.627" data-track-index="0"><span>Bir de:</span></div>
<div id="cap-083" class="cap clip" data-start="215.732" data-duration="2.346" data-track-index="0"><span>KDV hiçbir vergi matrahına girmez;</span></div>
<div id="cap-084" class="cap clip" data-start="218.078" data-duration="1.988" data-track-index="0"><span>çünkü <b>en son</b> o hesaplanır.</span></div>
<div id="cap-085" class="cap clip" data-start="220.896" data-duration="1.2" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-086" class="cap clip" data-start="222.096" data-duration="2.56" data-track-index="0"><span>Vergi zincirini bir merdiven gibi düşünün.</span></div>
<div id="cap-087" class="cap clip" data-start="224.656" data-duration="2.92" data-track-index="0"><span>Her basamak, altındaki basamakların toplamı üzerine</span></div>
<div id="cap-088" class="cap clip" data-start="227.576" data-duration="0.707" data-track-index="0"><span>kurulur.</span></div>
<div id="cap-089" class="cap clip" data-start="228.283" data-duration="3.133" data-track-index="0"><span>Kıymet en altta, KDV en üstte.</span></div>
<div id="cap-090" class="cap clip" data-start="231.416" data-duration="1.427" data-track-index="0"><span>Formülü aklınızda tutun:</span></div>
<div id="cap-091" class="cap clip" data-start="232.843" data-duration="2.573" data-track-index="0"><span>Kıymeti bul, gümrük vergisini ekle,</span></div>
<div id="cap-092" class="cap clip" data-start="235.416" data-duration="2.96" data-track-index="0"><span><b>bandrolü</b> hesapla, <b>ÖTV</b>&#x27;yi hesapla,</span></div>
<div id="cap-093" class="cap clip" data-start="238.376" data-duration="2.177" data-track-index="0"><span>KDV&#x27;yi <b>en son</b> hesapla.</span></div>
<div id="cap-094" class="cap clip" data-start="241.303" data-duration="0.96" data-track-index="0"><span>Özetle:</span></div>
<div id="cap-095" class="cap clip" data-start="242.263" data-duration="3.36" data-track-index="0"><span><b>Gümrük vergisi</b> <b>40.000</b>, <b>bandrol</b> <b>84.000</b>,</span></div>
<div id="cap-096" class="cap clip" data-start="245.623" data-duration="6.12" data-track-index="0"><span><b>ÖTV</b> <b>184.800</b>, KDV <b>221.760</b> lira.</span></div>
<div id="cap-097" class="cap clip" data-start="251.743" data-duration="1.6" data-track-index="0"><span>Toplam, <b>E şıkkı</b>:</span></div>
<div id="cap-098" class="cap clip" data-start="253.343" data-duration="2.41" data-track-index="0"><span><b>530.560</b> lira.</span></div>
<div id="cap-099" class="cap clip" data-start="255.783" data-duration="3.16" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-100" class="cap clip" data-start="258.943" data-duration="0.76" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-101" class="cap clip" data-start="259.703" data-duration="2.44" data-track-index="0"><span>Bir sonraki hesaplama dersinde görüşmek üzere,</span></div>
<div id="cap-102" class="cap clip" data-start="262.143" data-duration="0.961" data-track-index="0"><span>hoşça kalın!</span></div>

      <script>
(() => {
