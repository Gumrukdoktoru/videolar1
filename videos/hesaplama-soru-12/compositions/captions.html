<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.08" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla vergi hesaplama</span></div>
<div id="cap-002" class="cap clip" data-start="4.76" data-duration="2.52" data-track-index="0"><span>derslerinin <b>12</b>&#x27;ncisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="7.28" data-duration="3.36" data-track-index="0"><span>Bugünün konusu <b>kısmi muafiyetle</b> <b>geçici ithalat</b>.</span></div>
<div id="cap-004" class="cap clip" data-start="10.64" data-duration="1.64" data-track-index="0"><span>Her ay için <b>%3</b>;</span></div>
<div id="cap-005" class="cap clip" data-start="12.28" data-duration="1.44" data-track-index="0"><span>ama neyin <b>%3</b>&#x27;ü?</span></div>
<div id="cap-006" class="cap clip" data-start="13.72" data-duration="1.36" data-track-index="0"><span>Bir de ay kesirleri var.</span></div>
<div id="cap-007" class="cap clip" data-start="15.08" data-duration="2.29" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.169" data-duration="1.6" data-track-index="0"><span>Önce soruyu okuyalım.</span></div>
<div id="cap-009" class="cap clip" data-start="19.769" data-duration="3.04" data-track-index="0"><span>V firması, Çin&#x27;den kiraladığı bir mobil vinci</span></div>
<div id="cap-010" class="cap clip" data-start="22.809" data-duration="2.88" data-track-index="0"><span>kısmi muafiyet suretiyle geçici ithalat rejimine</span></div>
<div id="cap-011" class="cap clip" data-start="25.689" data-duration="1.12" data-track-index="0"><span>tabi tutuyor.</span></div>
<div id="cap-012" class="cap clip" data-start="26.809" data-duration="3.36" data-track-index="0"><span>Beyannamenin tescil tarihinde gümrük kıymeti <b>150.000</b></span></div>
<div id="cap-013" class="cap clip" data-start="30.169" data-duration="1.8" data-track-index="0"><span>dolar, kur <b>40</b> lira.</span></div>
<div id="cap-014" class="cap clip" data-start="31.969" data-duration="2.6" data-track-index="0"><span>Aynı tarihte gümrük vergisi <b>%5</b>,</span></div>
<div id="cap-015" class="cap clip" data-start="34.569" data-duration="2.12" data-track-index="0"><span>ilave gümrük vergisi <b>%10</b>,</span></div>
<div id="cap-016" class="cap clip" data-start="36.689" data-duration="1.84" data-track-index="0"><span>KDV <b>%20</b>.</span></div>
<div id="cap-017" class="cap clip" data-start="38.529" data-duration="3.4" data-track-index="0"><span>Vinç, rejimde <b>7</b> ay <b>12</b> gün kaldıktan sonra yeniden</span></div>
<div id="cap-018" class="cap clip" data-start="41.929" data-duration="1.2" data-track-index="0"><span>ihraç ediliyor.</span></div>
<div id="cap-019" class="cap clip" data-start="43.129" data-duration="0.88" data-track-index="0"><span>Soru şu:</span></div>
<div id="cap-020" class="cap clip" data-start="44.009" data-duration="2.88" data-track-index="0"><span>Rejim süresince ödenmesi gereken ithalat vergileri</span></div>
<div id="cap-021" class="cap clip" data-start="46.889" data-duration="2.119" data-track-index="0"><span>toplamı kaç Türk lirasıdır?</span></div>
<div id="cap-022" class="cap clip" data-start="49.758" data-duration="1.29" data-track-index="0"><span>Şıklarımız şöyle.</span></div>
<div id="cap-023" class="cap clip" data-start="51.198" data-duration="2.56" data-track-index="0"><span>A şıkkı, <b>216.000</b> lira.</span></div>
<div id="cap-024" class="cap clip" data-start="53.758" data-duration="3.44" data-track-index="0"><span>B şıkkı, <b>478.800</b> lira.</span></div>
<div id="cap-025" class="cap clip" data-start="57.198" data-duration="2.4" data-track-index="0"><span>C şıkkı, <b>504.000</b> lira.</span></div>
<div id="cap-026" class="cap clip" data-start="59.598" data-duration="3.04" data-track-index="0"><span>D şıkkı, <b>506.160</b> lira.</span></div>
<div id="cap-027" class="cap clip" data-start="62.638" data-duration="2.917" data-track-index="0"><span>E şıkkı, <b>547.200</b> lira.</span></div>
<div id="cap-028" class="cap clip" data-start="66.478" data-duration="2.756" data-track-index="0"><span>Videoyu durdurun ve önce kendiniz çözün.</span></div>
<div id="cap-029" class="cap clip" data-start="75.264" data-duration="1.89" data-track-index="0"><span>Hazırsanız başlayalım.</span></div>
<div id="cap-030" class="cap clip" data-start="77.184" data-duration="1.85" data-track-index="0"><span>Bu sorunun üç anahtarı var.</span></div>
<div id="cap-031" class="cap clip" data-start="79.104" data-duration="0.64" data-track-index="0"><span>Bir:</span></div>
<div id="cap-032" class="cap clip" data-start="79.744" data-duration="3.44" data-track-index="0"><span>Önce eşya <b>serbest dolaşıma</b> girseydi alınacak vergileri</span></div>
<div id="cap-033" class="cap clip" data-start="83.184" data-duration="0.84" data-track-index="0"><span>hesaplayın;</span></div>
<div id="cap-034" class="cap clip" data-start="84.024" data-duration="2.44" data-track-index="0"><span><b>tescil tarihindeki</b> oranlar ve kurla.</span></div>
<div id="cap-035" class="cap clip" data-start="86.464" data-duration="0.64" data-track-index="0"><span>İki:</span></div>
<div id="cap-036" class="cap clip" data-start="87.104" data-duration="3.08" data-track-index="0"><span>Her ay için bu vergiler toplamının <b>%3</b>&#x27;ü alınır;</span></div>
<div id="cap-037" class="cap clip" data-start="90.184" data-duration="2.68" data-track-index="0"><span><b>kıymetin değil</b>, <b>vergilerin</b> <b>%3</b>&#x27;ü.</span></div>
<div id="cap-038" class="cap clip" data-start="92.864" data-duration="0.6" data-track-index="0"><span>Üç:</span></div>
<div id="cap-039" class="cap clip" data-start="93.464" data-duration="2.476" data-track-index="0"><span>Bir aydan az süreler <b>tam ay</b> sayılır.</span></div>
<div id="cap-040" class="cap clip" data-start="96.69" data-duration="1.24" data-track-index="0"><span>Birinci adım:</span></div>
<div id="cap-041" class="cap clip" data-start="97.93" data-duration="3.0" data-track-index="0"><span><b>serbest dolaşıma</b> girseydi alınacak vergiler.</span></div>
<div id="cap-042" class="cap clip" data-start="100.93" data-duration="0.73" data-track-index="0"><span>Kıymet;</span></div>
<div id="cap-043" class="cap clip" data-start="101.73" data-duration="2.96" data-track-index="0"><span><b>150.000</b> × <b>40</b>, <b>6.000.000</b> lira.</span></div>
<div id="cap-044" class="cap clip" data-start="104.69" data-duration="2.64" data-track-index="0"><span>Gümrük vergisi <b>%5</b>, <b>300.000</b>;</span></div>
<div id="cap-045" class="cap clip" data-start="107.33" data-duration="2.2" data-track-index="0"><span>ilave gümrük vergisi <b>%10</b>,</span></div>
<div id="cap-046" class="cap clip" data-start="109.53" data-duration="1.24" data-track-index="0"><span><b>600.000</b> lira.</span></div>
<div id="cap-047" class="cap clip" data-start="110.77" data-duration="1.44" data-track-index="0"><span>KDV matrahı;</span></div>
<div id="cap-048" class="cap clip" data-start="112.21" data-duration="3.4" data-track-index="0"><span><b>6.000.000</b> + <b>300.000</b> + <b>600.000</b>,</span></div>
<div id="cap-049" class="cap clip" data-start="115.61" data-duration="1.68" data-track-index="0"><span><b>6.900.000</b>.</span></div>
<div id="cap-050" class="cap clip" data-start="117.29" data-duration="3.2" data-track-index="0"><span><b>%20</b>&#x27;si, <b>1.380.000</b> lira.</span></div>
<div id="cap-051" class="cap clip" data-start="120.49" data-duration="1.16" data-track-index="0"><span>Toplam vergi:</span></div>
<div id="cap-052" class="cap clip" data-start="121.65" data-duration="2.196" data-track-index="0"><span><b>2.280.000</b> lira.</span></div>
<div id="cap-053" class="cap clip" data-start="124.596" data-duration="1.12" data-track-index="0"><span>İkinci adım:</span></div>
<div id="cap-054" class="cap clip" data-start="125.716" data-duration="1.12" data-track-index="0"><span>aylık tutar.</span></div>
<div id="cap-055" class="cap clip" data-start="126.836" data-duration="3.28" data-track-index="0"><span>Her ay için, vergiler toplamının <b>%3</b>&#x27;ü alınır:</span></div>
<div id="cap-056" class="cap clip" data-start="130.116" data-duration="5.101" data-track-index="0"><span><b>2.280.000</b> × <b>%3</b>, <b>68.400</b> lira.</span></div>
<div id="cap-057" class="cap clip" data-start="135.967" data-duration="1.05" data-track-index="0"><span>Üçüncü adım:</span></div>
<div id="cap-058" class="cap clip" data-start="137.087" data-duration="0.65" data-track-index="0"><span>süre.</span></div>
<div id="cap-059" class="cap clip" data-start="137.967" data-duration="2.667" data-track-index="0"><span>Vinç <b>7</b> ay <b>12</b> gün rejimde kaldı.</span></div>
<div id="cap-060" class="cap clip" data-start="140.634" data-duration="2.733" data-track-index="0"><span>Bir aydan az süreler <b>tam ay</b> sayıldığı için,</span></div>
<div id="cap-061" class="cap clip" data-start="143.367" data-duration="1.44" data-track-index="0"><span><b>12</b> gün <b>1</b> ay olur;</span></div>
<div id="cap-062" class="cap clip" data-start="144.807" data-duration="1.28" data-track-index="0"><span>toplam <b>8 ay</b>.</span></div>
<div id="cap-063" class="cap clip" data-start="146.087" data-duration="2.56" data-track-index="0"><span><b>68.400</b> × <b>8</b>:</span></div>
<div id="cap-064" class="cap clip" data-start="148.647" data-duration="2.251" data-track-index="0"><span><b>547.200</b> lira.</span></div>
<div id="cap-065" class="cap clip" data-start="151.648" data-duration="0.96" data-track-index="0"><span>Ve sonuç:</span></div>
<div id="cap-066" class="cap clip" data-start="152.608" data-duration="3.68" data-track-index="0"><span>Aylık <b>68.400</b> lira, <b>8 ay</b> boyunca.</span></div>
<div id="cap-067" class="cap clip" data-start="156.288" data-duration="2.12" data-track-index="0"><span>Rejim süresince ödenecek toplam,</span></div>
<div id="cap-068" class="cap clip" data-start="158.408" data-duration="2.28" data-track-index="0"><span><b>547.200</b> lira.</span></div>
<div id="cap-069" class="cap clip" data-start="160.688" data-duration="1.0" data-track-index="0"><span>Doğru cevap:</span></div>
<div id="cap-070" class="cap clip" data-start="161.688" data-duration="0.972" data-track-index="0"><span><b>E şıkkı</b>!</span></div>
<div id="cap-071" class="cap clip" data-start="163.57" data-duration="2.01" data-track-index="0"><span>Şimdi <b>tuzaklara</b> bakalım;</span></div>
<div id="cap-072" class="cap clip" data-start="165.73" data-duration="2.57" data-track-index="0"><span>her yanlış şık, bir hatanın sonucu.</span></div>
<div id="cap-073" class="cap clip" data-start="168.53" data-duration="2.08" data-track-index="0"><span>KDV&#x27;yi hesaba katmayan,</span></div>
<div id="cap-074" class="cap clip" data-start="170.61" data-duration="2.49" data-track-index="0"><span><b>A şıkkına</b>, <b>216.000</b>&#x27;e düşer.</span></div>
<div id="cap-075" class="cap clip" data-start="173.33" data-duration="2.0" data-track-index="0"><span><b>12</b> günü atıp <b>7</b> ay sayan,</span></div>
<div id="cap-076" class="cap clip" data-start="175.33" data-duration="3.73" data-track-index="0"><span><b>B şıkkına</b>, <b>478.800</b>&#x27;e iner.</span></div>
<div id="cap-077" class="cap clip" data-start="179.09" data-duration="3.28" data-track-index="0"><span>KDV matrahına gümrük vergisini ve ilave gümrük</span></div>
<div id="cap-078" class="cap clip" data-start="182.37" data-duration="2.24" data-track-index="0"><span>vergisini eklemeyen, <b>C şıkkına</b>,</span></div>
<div id="cap-079" class="cap clip" data-start="184.61" data-duration="1.45" data-track-index="0"><span><b>504.000</b>&#x27;e gider.</span></div>
<div id="cap-080" class="cap clip" data-start="186.29" data-duration="4.0" data-track-index="0"><span>Gün kesrini oranlayıp <b>7,4</b> ay sayan ise <b>D şıkkına</b>,</span></div>
<div id="cap-081" class="cap clip" data-start="190.29" data-duration="2.288" data-track-index="0"><span><b>506.160</b>&#x27;a ulaşır.</span></div>
<div id="cap-082" class="cap clip" data-start="193.408" data-duration="1.28" data-track-index="0"><span>Bir uyarı daha:</span></div>
<div id="cap-083" class="cap clip" data-start="194.688" data-duration="3.12" data-track-index="0"><span>Eşya sonradan <b>serbest dolaşıma</b> sokulursa vergiler</span></div>
<div id="cap-084" class="cap clip" data-start="197.808" data-duration="3.0" data-track-index="0"><span>yeniden hesaplanır ve <b>kısmi muafiyetle</b> daha önce</span></div>
<div id="cap-085" class="cap clip" data-start="200.808" data-duration="2.49" data-track-index="0"><span>ödenen tutar bu vergilerden düşülür.</span></div>
<div id="cap-086" class="cap clip" data-start="203.328" data-duration="0.65" data-track-index="0"><span>Bir de:</span></div>
<div id="cap-087" class="cap clip" data-start="204.128" data-duration="3.04" data-track-index="0"><span>Aylık tutar, <b>geçici ithalat</b> beyannamesinin tescil</span></div>
<div id="cap-088" class="cap clip" data-start="207.168" data-duration="2.4" data-track-index="0"><span>tarihindeki oranlar ve kurla bulunur;</span></div>
<div id="cap-089" class="cap clip" data-start="209.568" data-duration="2.923" data-track-index="0"><span>sonradan oran değişse de bu tutar <b>değişmez</b>.</span></div>
<div id="cap-090" class="cap clip" data-start="213.321" data-duration="1.08" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-091" class="cap clip" data-start="214.401" data-duration="2.8" data-track-index="0"><span><b>Kısmi muafiyette</b> üç şeyi karıştırmayın.</span></div>
<div id="cap-092" class="cap clip" data-start="217.201" data-duration="2.6" data-track-index="0"><span><b>%3</b> <b>kıymetin değil</b>, <b>vergilerin</b>.</span></div>
<div id="cap-093" class="cap clip" data-start="219.801" data-duration="1.36" data-track-index="0"><span>Oran her ay için.</span></div>
<div id="cap-094" class="cap clip" data-start="221.161" data-duration="2.04" data-track-index="0"><span>Ve <b>ay kesri</b> tam aydır.</span></div>
<div id="cap-095" class="cap clip" data-start="223.201" data-duration="1.52" data-track-index="0"><span>Formülü aklınızda tutun:</span></div>
<div id="cap-096" class="cap clip" data-start="224.721" data-duration="3.28" data-track-index="0"><span>Kıymeti bul, serbest dolaşım vergilerini hesapla,</span></div>
<div id="cap-097" class="cap clip" data-start="228.001" data-duration="3.44" data-track-index="0"><span>toplamın <b>%3</b>&#x27;ünü al, ay sayısını yukarı yuvarla,</span></div>
<div id="cap-098" class="cap clip" data-start="231.441" data-duration="1.198" data-track-index="0"><span>ikisini çarp.</span></div>
<div id="cap-099" class="cap clip" data-start="233.389" data-duration="0.76" data-track-index="0"><span>Özetle:</span></div>
<div id="cap-100" class="cap clip" data-start="234.149" data-duration="3.4" data-track-index="0"><span>Vergiler toplamı <b>2.280.000</b>,</span></div>
<div id="cap-101" class="cap clip" data-start="237.549" data-duration="4.08" data-track-index="0"><span>aylık tutar <b>68.400</b>, süre <b>8 ay</b>.</span></div>
<div id="cap-102" class="cap clip" data-start="241.629" data-duration="1.76" data-track-index="0"><span>Toplam, <b>E şıkkı</b>:</span></div>
<div id="cap-103" class="cap clip" data-start="243.389" data-duration="2.41" data-track-index="0"><span><b>547.200</b> lira.</span></div>
<div id="cap-104" class="cap clip" data-start="245.869" data-duration="3.08" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-105" class="cap clip" data-start="248.949" data-duration="0.787" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-106" class="cap clip" data-start="249.736" data-duration="2.453" data-track-index="0"><span>Bir sonraki hesaplama dersinde görüşmek üzere,</span></div>
