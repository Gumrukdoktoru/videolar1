      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="321.19">
<div id="cap-001" class="cap clip" data-start="1.69" data-duration="3.11" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.8" data-duration="1.67" data-track-index="0"><span>ikincisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.47" data-duration="1.54" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.01" data-duration="3.19" data-track-index="0"><span>genel yorum kuralları, demir ve çelikten ev eşyası</span></div>
<div id="cap-005" class="cap clip" data-start="11.2" data-duration="1.35" data-track-index="0"><span>ve büro makineleri.</span></div>
<div id="cap-006" class="cap clip" data-start="12.55" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="13.55" data-duration="3.34" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="16.89" data-duration="2.279" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="20.019" data-duration="1.16" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="21.179" data-duration="2.96" data-track-index="0"><span>Tarifenin yorumuna ilişkin genel kurallarla ilgili</span></div>
<div id="cap-011" class="cap clip" data-start="24.139" data-duration="3.08" data-track-index="0"><span>aşağıdaki ifadelerden hangisi yanlıştır?</span></div>
<div id="cap-012" class="cap clip" data-start="27.219" data-duration="1.2" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="28.419" data-duration="1.75" data-track-index="0"><span>Eksik veya bitirilmemiş eşya,</span></div>
<div id="cap-014" class="cap clip" data-start="30.169" data-duration="3.16" data-track-index="0"><span>sunulduğunda tamamlanmış eşyanın esas niteliğine</span></div>
<div id="cap-015" class="cap clip" data-start="33.329" data-duration="3.3" data-track-index="0"><span>sahipse, tamamlanmış eşya gibi sınıflandırılır.</span></div>
<div id="cap-016" class="cap clip" data-start="36.629" data-duration="0.56" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="37.189" data-duration="2.73" data-track-index="0"><span>Bölüm, fasıl ve tali fasıl başlıkları,</span></div>
<div id="cap-018" class="cap clip" data-start="39.919" data-duration="3.44" data-track-index="0"><span>eşyanın tarifedeki yerinin saptanmasında yasal</span></div>
<div id="cap-019" class="cap clip" data-start="43.359" data-duration="1.43" data-track-index="0"><span>dayanak oluşturur.</span></div>
<div id="cap-020" class="cap clip" data-start="44.789" data-duration="0.49" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="45.279" data-duration="1.89" data-track-index="0"><span>Belli bir eşyaya göre yapılmış,</span></div>
<div id="cap-022" class="cap clip" data-start="47.169" data-duration="2.38" data-track-index="0"><span>uzun süreli kullanıma uygun mahfazalar,</span></div>
<div id="cap-023" class="cap clip" data-start="49.549" data-duration="2.87" data-track-index="0"><span>eşyayla birlikte sunulduğunda onunla birlikte</span></div>
<div id="cap-024" class="cap clip" data-start="52.419" data-duration="1.49" data-track-index="0"><span>sınıflandırılır.</span></div>
<div id="cap-025" class="cap clip" data-start="53.909" data-duration="0.49" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-026" class="cap clip" data-start="54.399" data-duration="2.74" data-track-index="0"><span>ilk <b>3</b> kurala göre sınıflandırılamayan eşya,</span></div>
<div id="cap-027" class="cap clip" data-start="57.139" data-duration="3.83" data-track-index="0"><span>en çok benzediği eşyanın pozisyonunda sınıflandırılır.</span></div>
<div id="cap-028" class="cap clip" data-start="61.109" data-duration="0.41" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-029" class="cap clip" data-start="61.519" data-duration="3.45" data-track-index="0"><span>Alt pozisyonlarda yalnızca aynı seviyedeki alt</span></div>
<div id="cap-030" class="cap clip" data-start="64.969" data-duration="2.64" data-track-index="0"><span>pozisyonlar karşılaştırılır.</span></div>
<div id="cap-031" class="cap clip" data-start="67.609" data-duration="2.16" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-032" class="cap clip" data-start="74.262" data-duration="0.35" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-033" class="cap clip" data-start="74.612" data-duration="1.22" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-034" class="cap clip" data-start="76.002" data-duration="1.92" data-track-index="0"><span>Birinci kurala göre bölüm,</span></div>
<div id="cap-035" class="cap clip" data-start="77.922" data-duration="2.88" data-track-index="0"><span>fasıl ve tali fasıl <b>başlıkları</b> sadece <b>gösterici</b></span></div>
<div id="cap-036" class="cap clip" data-start="80.802" data-duration="1.08" data-track-index="0"><span>niteliktedir;</span></div>
<div id="cap-037" class="cap clip" data-start="81.882" data-duration="1.68" data-track-index="0"><span><b>yasal dayanak</b> oluşturmaz.</span></div>
<div id="cap-038" class="cap clip" data-start="83.562" data-duration="2.96" data-track-index="0"><span>Sınıflandırma, <b>pozisyon metinlerine</b> ve bölüm ya</span></div>
<div id="cap-039" class="cap clip" data-start="86.522" data-duration="2.15" data-track-index="0"><span>da fasıl <b>notlarına</b> göre yapılır.</span></div>
<div id="cap-040" class="cap clip" data-start="88.672" data-duration="1.56" data-track-index="0"><span>Diğer ifadeler doğru:</span></div>
<div id="cap-041" class="cap clip" data-start="90.232" data-duration="2.28" data-track-index="0"><span><b>A şıkkı</b> ikinci kuralın a bendi,</span></div>
<div id="cap-042" class="cap clip" data-start="92.512" data-duration="3.42" data-track-index="0"><span><b>C şıkkı</b> beşinci kural, <b>D şıkkı</b> dördüncü kural,</span></div>
<div id="cap-043" class="cap clip" data-start="95.932" data-duration="2.111" data-track-index="0"><span><b>E şıkkı</b> ise altıncı kural.</span></div>
<div id="cap-044" class="cap clip" data-start="98.883" data-duration="1.24" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-045" class="cap clip" data-start="100.333" data-duration="3.57" data-track-index="0"><span>Stajyerimiz, ikinci faslın başlığı etler ve yenilen</span></div>
<div id="cap-046" class="cap clip" data-start="103.903" data-duration="3.08" data-track-index="0"><span>sakatat diye hayvan bağırsağını ikinci fasla koydu.</span></div>
<div id="cap-047" class="cap clip" data-start="107.123" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-048" class="cap clip" data-start="108.013" data-duration="2.98" data-track-index="0"><span>İkinci faslın notu bağırsakları açıkça hariç tutar;</span></div>
<div id="cap-049" class="cap clip" data-start="110.993" data-duration="2.13" data-track-index="0"><span>doğru yer <b>05.04</b>.</span></div>
<div id="cap-050" class="cap clip" data-start="113.133" data-duration="2.56" data-track-index="0"><span>Başlık yol gösterir, karar notla verilir.</span></div>
<div id="cap-051" class="cap clip" data-start="115.693" data-duration="2.03" data-track-index="0"><span>Bir de dördüncü kurala dikkat:</span></div>
<div id="cap-052" class="cap clip" data-start="117.733" data-duration="2.26" data-track-index="0"><span>Kıymete ya da ticari miktara bakılmaz;</span></div>
<div id="cap-053" class="cap clip" data-start="119.993" data-duration="2.09" data-track-index="0"><span><b>en çok benzeyen</b> eşyaya bakılır.</span></div>
<div id="cap-054" class="cap clip" data-start="123.122" data-duration="1.01" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-055" class="cap clip" data-start="124.132" data-duration="2.12" data-track-index="0"><span>Paslanmaz çelikten mamul,</span></div>
<div id="cap-056" class="cap clip" data-start="126.252" data-duration="1.52" data-track-index="0"><span>iç kovası plastik olan,</span></div>
<div id="cap-057" class="cap clip" data-start="127.772" data-duration="2.97" data-track-index="0"><span>pedallı mutfak çöp kovası hangi tarife pozisyonunda</span></div>
<div id="cap-058" class="cap clip" data-start="130.742" data-duration="1.39" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-059" class="cap clip" data-start="132.132" data-duration="0.87" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-060" class="cap clip" data-start="133.362" data-duration="1.27" data-track-index="0"><span><b>39.24</b>.</span></div>
<div id="cap-061" class="cap clip" data-start="134.632" data-duration="0.87" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-062" class="cap clip" data-start="135.862" data-duration="1.27" data-track-index="0"><span><b>73.10</b>.</span></div>
<div id="cap-063" class="cap clip" data-start="137.132" data-duration="0.87" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-064" class="cap clip" data-start="138.362" data-duration="1.27" data-track-index="0"><span><b>73.26</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="139.632" data-duration="0.87" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-066" class="cap clip" data-start="140.862" data-duration="1.27" data-track-index="0"><span><b>73.23</b>.</span></div>
<div id="cap-067" class="cap clip" data-start="142.132" data-duration="1.07" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-068" class="cap clip" data-start="143.372" data-duration="1.75" data-track-index="0"><span><b>94.03</b>.</span></div>
<div id="cap-069" class="cap clip" data-start="145.122" data-duration="2.124" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-070" class="cap clip" data-start="151.666" data-duration="0.73" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-071" class="cap clip" data-start="152.396" data-duration="0.98" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-072" class="cap clip" data-start="153.376" data-duration="2.52" data-track-index="0"><span>Önce eşyanın asıl maddesine bakıyoruz:</span></div>
<div id="cap-073" class="cap clip" data-start="155.896" data-duration="1.26" data-track-index="0"><span><b>paslanmaz çelik</b>.</span></div>
<div id="cap-074" class="cap clip" data-start="157.156" data-duration="2.74" data-track-index="0"><span>Plastik iç kova yalnızca bir <b>aksesuar</b>;</span></div>
<div id="cap-075" class="cap clip" data-start="159.896" data-duration="2.92" data-track-index="0"><span>eşya, demir veya çelik karakterini koruyor.</span></div>
<div id="cap-076" class="cap clip" data-start="162.816" data-duration="1.6" data-track-index="0"><span>Sonra kullanım yerine:</span></div>
<div id="cap-077" class="cap clip" data-start="164.416" data-duration="1.23" data-track-index="0"><span>ev ve mutfak.</span></div>
<div id="cap-078" class="cap clip" data-start="165.646" data-duration="3.67" data-track-index="0"><span><b>73.23</b> pozisyonu, demir veya çelikten sofra,</span></div>
<div id="cap-079" class="cap clip" data-start="169.316" data-duration="2.98" data-track-index="0"><span>mutfak ve diğer ev işlerinde kullanılan eşyayı</span></div>
<div id="cap-080" class="cap clip" data-start="172.296" data-duration="0.56" data-track-index="0"><span>kapsar;</span></div>
<div id="cap-081" class="cap clip" data-start="172.856" data-duration="2.72" data-track-index="0"><span><b>izahname</b> <b>çöp kutularını</b> açıkça sayar.</span></div>
<div id="cap-082" class="cap clip" data-start="175.576" data-duration="2.471" data-track-index="0"><span>Pedal mekanizması da sonucu değiştirmez.</span></div>
<div id="cap-083" class="cap clip" data-start="178.837" data-duration="4.54" data-track-index="0"><span>Cano ise iç kova plastik diye <b>39.24</b>&#x27;ü seçti.</span></div>
<div id="cap-084" class="cap clip" data-start="183.377" data-duration="0.66" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-085" class="cap clip" data-start="184.037" data-duration="2.71" data-track-index="0"><span>O pozisyon plastikten ev eşyası içindir;</span></div>
<div id="cap-086" class="cap clip" data-start="186.747" data-duration="2.65" data-track-index="0"><span>bu kovanın <b>esas niteliği</b> çelikten geliyor.</span></div>
<div id="cap-087" class="cap clip" data-start="189.397" data-duration="0.97" data-track-index="0"><span>Bir de dikkat:</span></div>
<div id="cap-088" class="cap clip" data-start="190.367" data-duration="2.92" data-track-index="0"><span><b>Atık kâğıt sepetleri</b> <b>73.23</b>&#x27;e girmez;</span></div>
<div id="cap-089" class="cap clip" data-start="193.287" data-duration="3.44" data-track-index="0"><span><b>73.25</b> ya da <b>73.26</b>&#x27;da sınıflandırılır.</span></div>
<div id="cap-090" class="cap clip" data-start="196.727" data-duration="2.08" data-track-index="0"><span>Ev eşyası listesini tahmin etmeyin;</span></div>
<div id="cap-091" class="cap clip" data-start="198.807" data-duration="1.47" data-track-index="0"><span><b>izahnameye</b> bakın.</span></div>
<div id="cap-092" class="cap clip" data-start="201.085" data-duration="1.22" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-093" class="cap clip" data-start="202.315" data-duration="3.03" data-track-index="0"><span>Mektup ve kolilere, posta pulu yerine geçen ücret</span></div>
<div id="cap-094" class="cap clip" data-start="205.345" data-duration="3.37" data-track-index="0"><span>damgasını basan, hesaplama tertibatı bulunan makineler</span></div>
<div id="cap-095" class="cap clip" data-start="208.715" data-duration="2.3" data-track-index="0"><span>hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-096" class="cap clip" data-start="211.015" data-duration="1.45" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-097" class="cap clip" data-start="212.815" data-duration="1.02" data-track-index="0"><span><b>84.43</b>.</span></div>
<div id="cap-098" class="cap clip" data-start="213.835" data-duration="0.92" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-099" class="cap clip" data-start="214.755" data-duration="1.64" data-track-index="0"><span><b>84.71</b>.</span></div>
<div id="cap-100" class="cap clip" data-start="216.395" data-duration="1.21" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-101" class="cap clip" data-start="217.935" data-duration="1.02" data-track-index="0"><span><b>84.72</b>.</span></div>
<div id="cap-102" class="cap clip" data-start="218.955" data-duration="1.45" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-103" class="cap clip" data-start="220.495" data-duration="1.02" data-track-index="0"><span><b>90.29</b>.</span></div>
<div id="cap-104" class="cap clip" data-start="221.515" data-duration="0.68" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-105" class="cap clip" data-start="222.195" data-duration="1.62" data-track-index="0"><span><b>84.70</b>.</span></div>
<div id="cap-106" class="cap clip" data-start="223.815" data-duration="2.47" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-107" class="cap clip" data-start="230.861" data-duration="1.05" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-108" class="cap clip" data-start="231.911" data-duration="0.7" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-109" class="cap clip" data-start="232.611" data-duration="3.62" data-track-index="0"><span><b>84.70</b> pozisyonunun metni bu makineleri <b>adıyla</b></span></div>
<div id="cap-110" class="cap clip" data-start="236.231" data-duration="0.4" data-track-index="0"><span>sayar:</span></div>
<div id="cap-111" class="cap clip" data-start="236.631" data-duration="2.81" data-track-index="0"><span>hesap makineleri, hesaplama tertibatlı muhasebe</span></div>
<div id="cap-112" class="cap clip" data-start="239.441" data-duration="3.61" data-track-index="0"><span>makineleri, posta pulu yerine damga basan makineler,</span></div>
<div id="cap-113" class="cap clip" data-start="243.051" data-duration="3.56" data-track-index="0"><span>bilet basma ve verme makineleri ve <b>yazar kasalar</b>.</span></div>
<div id="cap-114" class="cap clip" data-start="246.611" data-duration="3.23" data-track-index="0"><span>Pozisyon metni eşyayı açıkça kapsıyorsa birinci</span></div>
<div id="cap-115" class="cap clip" data-start="249.841" data-duration="0.93" data-track-index="0"><span>kural yeter.</span></div>
<div id="cap-116" class="cap clip" data-start="250.771" data-duration="2.5" data-track-index="0"><span>Bu gruptaki makinelerin ortak özelliği toplama</span></div>
<div id="cap-117" class="cap clip" data-start="253.271" data-duration="1.14" data-track-index="0"><span>tertibatıdır;</span></div>
<div id="cap-118" class="cap clip" data-start="254.411" data-duration="3.0" data-track-index="0"><span>yani en az <b>2</b> rakamı toplayabilen bir düzenek.</span></div>
<div id="cap-119" class="cap clip" data-start="257.411" data-duration="2.469" data-track-index="0"><span>Yazar kasalar bu şarttan muaftır.</span></div>
<div id="cap-120" class="cap clip" data-start="260.7" data-duration="3.37" data-track-index="0"><span>Yardımcımız, damga basıyor diye baskı makinelerini,</span></div>
<div id="cap-121" class="cap clip" data-start="264.07" data-duration="2.0" data-track-index="0"><span><b>84.43</b>&#x27;ü seçti.</span></div>
<div id="cap-122" class="cap clip" data-start="266.07" data-duration="1.91" data-track-index="0"><span>Gümrükçü Baba hemen uyardı:</span></div>
<div id="cap-123" class="cap clip" data-start="267.98" data-duration="2.5" data-track-index="0"><span>Pozisyon metni eşyayı <b>adıyla</b> sayıyorsa,</span></div>
<div id="cap-124" class="cap clip" data-start="270.48" data-duration="1.44" data-track-index="0"><span><b>en özel tanım</b> odur!</span></div>
<div id="cap-125" class="cap clip" data-start="271.92" data-duration="1.42" data-track-index="0"><span>Bir de sayaçlara dikkat:</span></div>
<div id="cap-126" class="cap clip" data-start="273.34" data-duration="2.89" data-track-index="0"><span>Sadece sayan ya da tek tek ekleyen düzenek toplama</span></div>
<div id="cap-127" class="cap clip" data-start="276.23" data-duration="1.49" data-track-index="0"><span>tertibatı sayılmaz;</span></div>
<div id="cap-128" class="cap clip" data-start="277.72" data-duration="3.353" data-track-index="0"><span>devir ve üretim sayaçları <b>90.29</b>&#x27;da yer alır.</span></div>
<div id="cap-129" class="cap clip" data-start="281.953" data-duration="0.87" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-130" class="cap clip" data-start="282.873" data-duration="1.64" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-131" class="cap clip" data-start="284.513" data-duration="0.55" data-track-index="0"><span>Bir:</span></div>
<div id="cap-132" class="cap clip" data-start="285.063" data-duration="1.84" data-track-index="0"><span>Başlık yol gösterir;</span></div>
<div id="cap-133" class="cap clip" data-start="286.913" data-duration="3.0" data-track-index="0"><span>karar, pozisyon metni ve notlarla verilir.</span></div>
<div id="cap-134" class="cap clip" data-start="289.913" data-duration="0.84" data-track-index="0"><span>İki:</span></div>
<div id="cap-135" class="cap clip" data-start="290.803" data-duration="1.83" data-track-index="0"><span>Başka maddeden bir <b>aksesuar</b>,</span></div>
<div id="cap-136" class="cap clip" data-start="292.633" data-duration="3.2" data-track-index="0"><span><b>esas niteliği</b> değiştirmiyorsa sonucu da değiştirmez.</span></div>
<div id="cap-137" class="cap clip" data-start="295.833" data-duration="0.59" data-track-index="0"><span>Üç:</span></div>
<div id="cap-138" class="cap clip" data-start="296.423" data-duration="2.84" data-track-index="0"><span>Pozisyon metni eşyayı <b>adıyla</b> sayıyorsa,</span></div>
<div id="cap-139" class="cap clip" data-start="299.263" data-duration="1.409" data-track-index="0"><span>önce oraya bakın.</span></div>
<div id="cap-140" class="cap clip" data-start="301.482" data-duration="1.6" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-141" class="cap clip" data-start="303.082" data-duration="2.87" data-track-index="0"><span>Birinci soru B, ikinci soru D,</span></div>
<div id="cap-142" class="cap clip" data-start="305.952" data-duration="1.44" data-track-index="0"><span>üçüncü soru E.</span></div>
<div id="cap-143" class="cap clip" data-start="307.392" data-duration="1.44" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-144" class="cap clip" data-start="308.832" data-duration="1.08" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-145" class="cap clip" data-start="309.912" data-duration="2.99" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-146" class="cap clip" data-start="313.072" data-duration="0.56" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-147" class="cap clip" data-start="313.632" data-duration="1.74" data-track-index="0"><span>Bir sonraki tarife dersinde,</span></div>
<div id="cap-148" class="cap clip" data-start="315.372" data-duration="1.95" data-track-index="0"><span>yeni <b>3</b> soruyla görüşmek üzere.</span></div>
