      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="293.69">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.08" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.76" data-duration="1.8" data-track-index="0"><span>beşincisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.56" data-duration="1.6" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.16" data-duration="2.96" data-track-index="0"><span><b>mineral mumlar</b>, <b>telsiz</b> kumanda cihazları ve deri</span></div>
<div id="cap-005" class="cap clip" data-start="11.12" data-duration="0.8" data-track-index="0"><span>eşya.</span></div>
<div id="cap-006" class="cap clip" data-start="11.92" data-duration="0.96" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="12.88" data-duration="3.16" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="16.04" data-duration="2.241" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="19.031" data-duration="1.05" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="20.231" data-duration="3.2" data-track-index="0"><span>Petrolden elde edilen, mikrokristal bünyeli petrol</span></div>
<div id="cap-011" class="cap clip" data-start="23.431" data-duration="3.12" data-track-index="0"><span>mumu hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-012" class="cap clip" data-start="26.551" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="27.431" data-duration="1.76" data-track-index="0"><span><b>34.04</b>.</span></div>
<div id="cap-014" class="cap clip" data-start="29.191" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="30.071" data-duration="1.56" data-track-index="0"><span><b>27.12</b>.</span></div>
<div id="cap-016" class="cap clip" data-start="31.631" data-duration="0.84" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="32.471" data-duration="1.52" data-track-index="0"><span><b>15.21</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="33.991" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-019" class="cap clip" data-start="34.871" data-duration="1.4" data-track-index="0"><span><b>27.10</b>.</span></div>
<div id="cap-020" class="cap clip" data-start="36.271" data-duration="0.84" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="37.111" data-duration="1.76" data-track-index="0"><span><b>33.04</b>.</span></div>
<div id="cap-022" class="cap clip" data-start="38.871" data-duration="1.883" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-023" class="cap clip" data-start="45.104" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-024" class="cap clip" data-start="45.904" data-duration="1.12" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="47.024" data-duration="3.92" data-track-index="0"><span><b>27.12</b> pozisyonunun metni bu ürünleri adıyla sayar:</span></div>
<div id="cap-026" class="cap clip" data-start="50.944" data-duration="3.12" data-track-index="0"><span>vazelin, parafin, mikrokristal bünyeli petrol</span></div>
<div id="cap-027" class="cap clip" data-start="54.064" data-duration="4.08" data-track-index="0"><span>mumu, ozokerit, linyit mumu ve diğer <b>mineral mumlar</b>.</span></div>
<div id="cap-028" class="cap clip" data-start="58.144" data-duration="2.16" data-track-index="0"><span>Bunlar <b>mineral kökenli</b> ürünlerdir;</span></div>
<div id="cap-029" class="cap clip" data-start="60.304" data-duration="2.56" data-track-index="0"><span>renklendirilmiş olsalar bile burada kalırlar.</span></div>
<div id="cap-030" class="cap clip" data-start="62.864" data-duration="2.44" data-track-index="0"><span>Yani mumun kaynağı belirleyicidir:</span></div>
<div id="cap-031" class="cap clip" data-start="65.304" data-duration="2.724" data-track-index="0"><span>petrol ve mineraller <b>27</b>. fasıl.</span></div>
<div id="cap-032" class="cap clip" data-start="68.858" data-duration="1.44" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-033" class="cap clip" data-start="70.298" data-duration="3.44" data-track-index="0"><span>Stajyerimiz, mum dediği için <b>34.04</b>&#x27;ü,</span></div>
<div id="cap-034" class="cap clip" data-start="73.738" data-duration="1.44" data-track-index="0"><span>suni mumları seçti.</span></div>
<div id="cap-035" class="cap clip" data-start="75.178" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-036" class="cap clip" data-start="76.058" data-duration="2.64" data-track-index="0"><span><b>Mineral kökenli</b> mumlar <b>27.12</b>&#x27;de;</span></div>
<div id="cap-037" class="cap clip" data-start="78.698" data-duration="3.68" data-track-index="0"><span><b>34.04</b> ise kimyasal yolla elde edilen <b>suni mumlar</b></span></div>
<div id="cap-038" class="cap clip" data-start="82.378" data-duration="1.787" data-track-index="0"><span>ve müstahzar mumlar içindir.</span></div>
<div id="cap-039" class="cap clip" data-start="84.165" data-duration="0.973" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-040" class="cap clip" data-start="85.138" data-duration="3.12" data-track-index="0"><span>Vazelin cilt bakımı için <b>perakende</b> ambalajlanmışsa,</span></div>
<div id="cap-041" class="cap clip" data-start="88.258" data-duration="3.64" data-track-index="0"><span>artık <b>27.12</b>&#x27;de değil, <b>33.04</b>&#x27;te <b>kozmetik</b> olarak</span></div>
<div id="cap-042" class="cap clip" data-start="91.898" data-duration="1.241" data-track-index="0"><span>sınıflandırılır.</span></div>
<div id="cap-043" class="cap clip" data-start="93.889" data-duration="1.25" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-044" class="cap clip" data-start="95.169" data-duration="2.92" data-track-index="0"><span>Radyo frekansıyla çalışan ve bir kule vincinin</span></div>
<div id="cap-045" class="cap clip" data-start="98.089" data-duration="2.92" data-track-index="0"><span>hareketlerini uzaktan kontrol etmeye yarayan telsiz</span></div>
<div id="cap-046" class="cap clip" data-start="101.009" data-duration="3.73" data-track-index="0"><span>kumanda cihazı hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-047" class="cap clip" data-start="104.769" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-048" class="cap clip" data-start="105.649" data-duration="1.76" data-track-index="0"><span><b>85.43</b>.</span></div>
<div id="cap-049" class="cap clip" data-start="107.409" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-050" class="cap clip" data-start="108.289" data-duration="1.76" data-track-index="0"><span><b>84.31</b>.</span></div>
<div id="cap-051" class="cap clip" data-start="110.049" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-052" class="cap clip" data-start="110.929" data-duration="1.76" data-track-index="0"><span><b>85.37</b>.</span></div>
<div id="cap-053" class="cap clip" data-start="112.689" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-054" class="cap clip" data-start="113.569" data-duration="1.68" data-track-index="0"><span><b>85.17</b>.</span></div>
<div id="cap-055" class="cap clip" data-start="115.249" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-056" class="cap clip" data-start="116.129" data-duration="1.53" data-track-index="0"><span><b>85.26</b>.</span></div>
<div id="cap-057" class="cap clip" data-start="118.689" data-duration="1.808" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-058" class="cap clip" data-start="124.847" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-059" class="cap clip" data-start="125.647" data-duration="1.0" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-060" class="cap clip" data-start="126.647" data-duration="2.52" data-track-index="0"><span><b>85.26</b> pozisyonunun metni,</span></div>
<div id="cap-061" class="cap clip" data-start="129.167" data-duration="3.36" data-track-index="0"><span>uzaktan kumanda etmeye mahsus <b>telsiz</b> kontrol cihazlarını</span></div>
<div id="cap-062" class="cap clip" data-start="132.527" data-duration="1.05" data-track-index="0"><span>adıyla sayar.</span></div>
<div id="cap-063" class="cap clip" data-start="133.647" data-duration="2.28" data-track-index="0"><span>Bu cihaz <b>radyo dalgalarıyla</b> çalışıyor;</span></div>
<div id="cap-064" class="cap clip" data-start="135.927" data-duration="1.24" data-track-index="0"><span>yani <b>telsiz</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="137.167" data-duration="2.52" data-track-index="0"><span>Vince ait olması da sonucu değiştirmez:</span></div>
<div id="cap-066" class="cap clip" data-start="139.687" data-duration="1.76" data-track-index="0"><span><b>16</b>. bölümün notuna göre,</span></div>
<div id="cap-067" class="cap clip" data-start="141.447" data-duration="2.56" data-track-index="0"><span><b>kendi pozisyonu</b> olan aksam ve parçalar,</span></div>
<div id="cap-068" class="cap clip" data-start="144.007" data-duration="3.04" data-track-index="0"><span>hangi makineye ait olursa olsun <b>kendi pozisyonlarında</b></span></div>
<div id="cap-069" class="cap clip" data-start="147.047" data-duration="1.221" data-track-index="0"><span>sınıflandırılır.</span></div>
<div id="cap-070" class="cap clip" data-start="149.178" data-duration="3.28" data-track-index="0"><span>Yardımcımız, vinçle birlikte kullanılıyor diye</span></div>
<div id="cap-071" class="cap clip" data-start="152.458" data-duration="2.88" data-track-index="0"><span><b>84.31</b>&#x27;i, vinç aksamını seçti.</span></div>
<div id="cap-072" class="cap clip" data-start="155.338" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-073" class="cap clip" data-start="156.218" data-duration="3.08" data-track-index="0"><span>Aksam pozisyonları, <b>kendi pozisyonu</b> olmayan parçalar</span></div>
<div id="cap-074" class="cap clip" data-start="159.298" data-duration="0.92" data-track-index="0"><span>içindir.</span></div>
<div id="cap-075" class="cap clip" data-start="160.218" data-duration="2.24" data-track-index="0"><span>Gümrükçü Baba da bir ayrımı hatırlattı:</span></div>
<div id="cap-076" class="cap clip" data-start="162.458" data-duration="2.64" data-track-index="0"><span>Televizyonların <b>kızılötesi</b> uzaktan kumandaları</span></div>
<div id="cap-077" class="cap clip" data-start="165.098" data-duration="1.28" data-track-index="0"><span><b>telsiz</b> değildir;</span></div>
<div id="cap-078" class="cap clip" data-start="166.378" data-duration="3.501" data-track-index="0"><span>fasıl notuna göre <b>85.43</b>&#x27;te sınıflandırılır.</span></div>
<div id="cap-079" class="cap clip" data-start="170.629" data-duration="1.2" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-080" class="cap clip" data-start="171.829" data-duration="4.8" data-track-index="0"><span>Aşağıdakilerden hangisi <b>42.02</b> pozisyonunda sınıflandırılmaz?</span></div>
<div id="cap-081" class="cap clip" data-start="176.629" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-082" class="cap clip" data-start="177.589" data-duration="3.44" data-track-index="0"><span>Dış yüzü dokumaya elverişli maddeden sırt çantası.</span></div>
<div id="cap-083" class="cap clip" data-start="181.029" data-duration="0.89" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-084" class="cap clip" data-start="181.989" data-duration="2.88" data-track-index="0"><span>Alüminyumdan yapılmış, tekerlekli valiz.</span></div>
<div id="cap-085" class="cap clip" data-start="184.869" data-duration="0.89" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-086" class="cap clip" data-start="185.829" data-duration="2.0" data-track-index="0"><span>Tabii deriden bel kemeri.</span></div>
<div id="cap-087" class="cap clip" data-start="187.829" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-088" class="cap clip" data-start="188.789" data-duration="2.32" data-track-index="0"><span>Vulkanize liften evrak çantası.</span></div>
<div id="cap-089" class="cap clip" data-start="191.109" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-090" class="cap clip" data-start="191.989" data-duration="2.89" data-track-index="0"><span>Plastik madde yaprağından tuvalet çantası.</span></div>
<div id="cap-091" class="cap clip" data-start="194.938" data-duration="1.701" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-092" class="cap clip" data-start="201.038" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-093" class="cap clip" data-start="201.838" data-duration="1.04" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-094" class="cap clip" data-start="202.878" data-duration="3.04" data-track-index="0"><span><b>42.02</b> pozisyonu iki gruptan oluşur.</span></div>
<div id="cap-095" class="cap clip" data-start="205.918" data-duration="1.76" data-track-index="0"><span><b>Birinci gruptaki</b> bavul,</span></div>
<div id="cap-096" class="cap clip" data-start="207.678" data-duration="2.2" data-track-index="0"><span>valiz, evrak ve okul çantası,</span></div>
<div id="cap-097" class="cap clip" data-start="209.878" data-duration="1.48" data-track-index="0"><span>gözlük kılıfı gibi eşya,</span></div>
<div id="cap-098" class="cap clip" data-start="211.358" data-duration="2.73" data-track-index="0"><span>hangi maddeden yapılırsa yapılsın buraya girer.</span></div>
<div id="cap-099" class="cap clip" data-start="214.158" data-duration="1.92" data-track-index="0"><span><b>İkinci gruptaki</b> seyahat,</span></div>
<div id="cap-100" class="cap clip" data-start="216.078" data-duration="1.64" data-track-index="0"><span>sırt ve tuvalet çantaları,</span></div>
<div id="cap-101" class="cap clip" data-start="217.718" data-duration="3.4" data-track-index="0"><span>cüzdanlar ve mücevher kutuları ise yalnızca deri,</span></div>
<div id="cap-102" class="cap clip" data-start="221.118" data-duration="3.04" data-track-index="0"><span>plastik yaprak, dokumaya elverişli madde,</span></div>
<div id="cap-103" class="cap clip" data-start="224.158" data-duration="2.8" data-track-index="0"><span>vulkanize lif veya kartondan olursa girer.</span></div>
<div id="cap-104" class="cap clip" data-start="226.958" data-duration="2.56" data-track-index="0"><span>Deri bel kemeri ise <b>giyim aksesuarıdır</b>:</span></div>
<div id="cap-105" class="cap clip" data-start="229.518" data-duration="1.419" data-track-index="0"><span><b>42.03</b>.</span></div>
<div id="cap-106" class="cap clip" data-start="231.847" data-duration="4.24" data-track-index="0"><span>Cano ise deriden olan her şey <b>42.02</b>&#x27;ye gider sandı.</span></div>
<div id="cap-107" class="cap clip" data-start="236.087" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-108" class="cap clip" data-start="236.887" data-duration="3.12" data-track-index="0"><span><b>42.02</b> çantalar ve mahfazalar içindir;</span></div>
<div id="cap-109" class="cap clip" data-start="240.007" data-duration="3.467" data-track-index="0"><span>deri <b>giyim eşyası</b> ve aksesuarı <b>42.03</b>&#x27;tedir.</span></div>
<div id="cap-110" class="cap clip" data-start="243.474" data-duration="1.653" data-track-index="0"><span>Bir de ikinci gruba <b>dikkat:</b></span></div>
<div id="cap-111" class="cap clip" data-start="245.127" data-duration="1.76" data-track-index="0"><span><b>Ahşaptan mücevher kutusu</b>,</span></div>
<div id="cap-112" class="cap clip" data-start="246.887" data-duration="3.32" data-track-index="0"><span>maddesi listede olmadığı için <b>42.02</b>&#x27;ye girmez;</span></div>
<div id="cap-113" class="cap clip" data-start="250.207" data-duration="2.001" data-track-index="0"><span><b>44.20</b>&#x27;de sınıflandırılır.</span></div>
<div id="cap-114" class="cap clip" data-start="253.038" data-duration="1.12" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-115" class="cap clip" data-start="254.158" data-duration="1.37" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-116" class="cap clip" data-start="255.678" data-duration="0.693" data-track-index="0"><span>Bir:</span></div>
<div id="cap-117" class="cap clip" data-start="256.371" data-duration="1.467" data-track-index="0"><span>Mumun kaynağına bakın;</span></div>
<div id="cap-118" class="cap clip" data-start="257.838" data-duration="4.56" data-track-index="0"><span><b>mineral mumlar</b> <b>27.12</b>, <b>suni mumlar</b> <b>34.04</b>.</span></div>
<div id="cap-119" class="cap clip" data-start="262.398" data-duration="0.68" data-track-index="0"><span>İki:</span></div>
<div id="cap-120" class="cap clip" data-start="263.078" data-duration="1.8" data-track-index="0"><span>Kendi pozisyonu olan parça,</span></div>
<div id="cap-121" class="cap clip" data-start="264.878" data-duration="2.72" data-track-index="0"><span>ait olduğu makinenin aksamı sayılmaz.</span></div>
<div id="cap-122" class="cap clip" data-start="267.598" data-duration="0.6" data-track-index="0"><span>Üç:</span></div>
<div id="cap-123" class="cap clip" data-start="268.198" data-duration="2.52" data-track-index="0"><span><b>42.02</b>&#x27;nin iki grubunu ayırın;</span></div>
<div id="cap-124" class="cap clip" data-start="270.718" data-duration="2.369" data-track-index="0"><span>ikinci grupta <b>madde şartı</b> vardır.</span></div>
<div id="cap-125" class="cap clip" data-start="273.837" data-duration="1.76" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-126" class="cap clip" data-start="275.597" data-duration="2.88" data-track-index="0"><span>Birinci soru B, ikinci soru E,</span></div>
<div id="cap-127" class="cap clip" data-start="278.477" data-duration="1.37" data-track-index="0"><span>üçüncü soru C.</span></div>
<div id="cap-128" class="cap clip" data-start="279.997" data-duration="1.36" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-129" class="cap clip" data-start="281.357" data-duration="1.12" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-130" class="cap clip" data-start="282.477" data-duration="3.04" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
