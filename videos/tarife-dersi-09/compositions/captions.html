      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="312.94">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.2" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.88" data-duration="1.84" data-track-index="0"><span>dokuzuncusuna hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.72" data-duration="1.48" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.2" data-duration="3.24" data-track-index="0"><span><b>özel amaçlı</b> taşıtlar, silahlı bastonlar ve kauçuk</span></div>
<div id="cap-005" class="cap clip" data-start="11.44" data-duration="0.84" data-track-index="0"><span>contalar.</span></div>
<div id="cap-006" class="cap clip" data-start="12.28" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="13.28" data-duration="3.32" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="16.6" data-duration="2.177" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="19.527" data-duration="1.2" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="20.727" data-duration="2.64" data-track-index="0"><span>Aşağıdaki taşıt çiftlerinden hangisinde,</span></div>
<div id="cap-011" class="cap clip" data-start="23.367" data-duration="3.65" data-track-index="0"><span>iki taşıt farklı tarife pozisyonlarında sınıflandırılır?</span></div>
<div id="cap-012" class="cap clip" data-start="27.047" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="28.007" data-duration="2.16" data-track-index="0"><span>Ambulans ve itfaiye aracı.</span></div>
<div id="cap-014" class="cap clip" data-start="30.167" data-duration="0.89" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="31.127" data-duration="1.93" data-track-index="0"><span>Cenaze arabası ve taksi.</span></div>
<div id="cap-016" class="cap clip" data-start="33.287" data-duration="1.04" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="34.327" data-duration="2.4" data-track-index="0"><span>Golf arabası ve motorlu karavan.</span></div>
<div id="cap-018" class="cap clip" data-start="36.727" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-019" class="cap clip" data-start="37.687" data-duration="3.04" data-track-index="0"><span>Beton mikser kamyonu ve vinçli kurtarıcı.</span></div>
<div id="cap-020" class="cap clip" data-start="40.727" data-duration="0.89" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="41.687" data-duration="2.597" data-track-index="0"><span>Hapishane minibüsü ve binek otomobili.</span></div>
<div id="cap-022" class="cap clip" data-start="44.647" data-duration="1.879" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-023" class="cap clip" data-start="50.876" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-024" class="cap clip" data-start="51.676" data-duration="0.89" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="52.636" data-duration="1.88" data-track-index="0"><span>Ambulans hastaları taşır;</span></div>
<div id="cap-026" class="cap clip" data-start="54.516" data-duration="3.68" data-track-index="0"><span><b>insan taşımaya mahsus</b> taşıt olarak <b>87.03</b>&#x27;tedir.</span></div>
<div id="cap-027" class="cap clip" data-start="58.196" data-duration="2.92" data-track-index="0"><span>İtfaiye aracı ise insan ya da eşya taşımak için</span></div>
<div id="cap-028" class="cap clip" data-start="61.116" data-duration="3.0" data-track-index="0"><span>değil, yangın söndürme hizmeti için donatılmıştır;</span></div>
<div id="cap-029" class="cap clip" data-start="64.116" data-duration="3.48" data-track-index="0"><span><b>özel amaçlı</b> taşıt olarak <b>87.05</b>&#x27;e gider.</span></div>
<div id="cap-030" class="cap clip" data-start="67.596" data-duration="3.16" data-track-index="0"><span>Diğer çiftlerde iki taşıt da <b>aynı pozisyondadır</b>:</span></div>
<div id="cap-031" class="cap clip" data-start="70.756" data-duration="3.08" data-track-index="0"><span>Cenaze arabası, taksi, golf arabası,</span></div>
<div id="cap-032" class="cap clip" data-start="73.836" data-duration="3.12" data-track-index="0"><span>motorlu karavan, hapishane minibüsü ve binek otomobili</span></div>
<div id="cap-033" class="cap clip" data-start="76.956" data-duration="1.56" data-track-index="0"><span><b>87.03</b>&#x27;te;</span></div>
<div id="cap-034" class="cap clip" data-start="78.516" data-duration="3.49" data-track-index="0"><span>beton mikser ve kurtarıcı ise <b>87.05</b>&#x27;te.</span></div>
<div id="cap-035" class="cap clip" data-start="82.885" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-036" class="cap clip" data-start="84.405" data-duration="3.52" data-track-index="0"><span>Cano, golf arabası spor malzemesidir diye C şıkkını</span></div>
<div id="cap-037" class="cap clip" data-start="87.925" data-duration="0.72" data-track-index="0"><span>seçti.</span></div>
<div id="cap-038" class="cap clip" data-start="88.645" data-duration="0.72" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-039" class="cap clip" data-start="89.365" data-duration="1.84" data-track-index="0"><span>Golf arabası <b>insan taşır</b>;</span></div>
<div id="cap-040" class="cap clip" data-start="91.205" data-duration="3.08" data-track-index="0"><span><b>87.03</b>&#x27;ün açıklama notunda <b>adıyla</b> sayılır,</span></div>
<div id="cap-041" class="cap clip" data-start="94.285" data-duration="1.667" data-track-index="0"><span>tıpkı motorlu karavan gibi.</span></div>
<div id="cap-042" class="cap clip" data-start="95.952" data-duration="1.053" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-043" class="cap clip" data-start="97.005" data-duration="2.76" data-track-index="0"><span>Ambulans ile cenaze arabasını <b>özel amaçlı</b> sanıp</span></div>
<div id="cap-044" class="cap clip" data-start="99.765" data-duration="3.4" data-track-index="0"><span><b>87.05</b>&#x27;e götürmek de sık yapılan bir hatadır.</span></div>
<div id="cap-045" class="cap clip" data-start="103.165" data-duration="0.84" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-046" class="cap clip" data-start="104.005" data-duration="1.56" data-track-index="0"><span>Taşıt insan mı taşıyor,</span></div>
<div id="cap-047" class="cap clip" data-start="105.565" data-duration="1.758" data-track-index="0"><span>yoksa hizmet mi veriyor?</span></div>
<div id="cap-048" class="cap clip" data-start="108.073" data-duration="1.05" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-049" class="cap clip" data-start="109.273" data-duration="2.64" data-track-index="0"><span>İçine kurşun doldurularak ağırlaştırılmış,</span></div>
<div id="cap-050" class="cap clip" data-start="111.913" data-duration="2.96" data-track-index="0"><span>savunma amacıyla da kullanılabilen yürüyüş bastonu,</span></div>
<div id="cap-051" class="cap clip" data-start="114.873" data-duration="3.28" data-track-index="0"><span>tarife cetvelinin hangi faslında sınıflandırılır?</span></div>
<div id="cap-052" class="cap clip" data-start="118.153" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-053" class="cap clip" data-start="119.113" data-duration="1.6" data-track-index="0"><span>Altmış altıncı fasıl.</span></div>
<div id="cap-054" class="cap clip" data-start="120.713" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-055" class="cap clip" data-start="121.593" data-duration="1.68" data-track-index="0"><span>Doksan beşinci fasıl.</span></div>
<div id="cap-056" class="cap clip" data-start="123.273" data-duration="0.8" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-057" class="cap clip" data-start="124.073" data-duration="1.52" data-track-index="0"><span>Doksanıncı fasıl.</span></div>
<div id="cap-058" class="cap clip" data-start="125.593" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-059" class="cap clip" data-start="126.473" data-duration="1.6" data-track-index="0"><span>Doksan üçüncü fasıl.</span></div>
<div id="cap-060" class="cap clip" data-start="128.073" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-061" class="cap clip" data-start="128.953" data-duration="1.45" data-track-index="0"><span>Kırk dördüncü fasıl.</span></div>
<div id="cap-062" class="cap clip" data-start="131.262" data-duration="1.903" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-063" class="cap clip" data-start="137.515" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-064" class="cap clip" data-start="138.315" data-duration="0.89" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="139.355" data-duration="2.24" data-track-index="0"><span>Altmış altıncı faslın birinci notu,</span></div>
<div id="cap-066" class="cap clip" data-start="141.595" data-duration="3.32" data-track-index="0"><span>tüfekli, kılıçlı ve kurşunlu bastonları açıkça</span></div>
<div id="cap-067" class="cap clip" data-start="144.915" data-duration="3.32" data-track-index="0"><span><b>fasıl dışında</b> bırakır ve <b>93</b>. fasla gönderir.</span></div>
<div id="cap-068" class="cap clip" data-start="148.235" data-duration="2.88" data-track-index="0"><span>Bu baston, içindeki kurşun ağırlık sayesinde bir</span></div>
<div id="cap-069" class="cap clip" data-start="151.115" data-duration="1.44" data-track-index="0"><span><b>silah niteliği</b> taşır.</span></div>
<div id="cap-070" class="cap clip" data-start="152.555" data-duration="2.72" data-track-index="0"><span>Bu yüzden şemsiye ve baston faslında değil,</span></div>
<div id="cap-071" class="cap clip" data-start="155.275" data-duration="1.76" data-track-index="0"><span><b>silahlar faslında</b> yer alır.</span></div>
<div id="cap-072" class="cap clip" data-start="157.035" data-duration="2.44" data-track-index="0"><span>Diğer şıklar başka eşyanın yeridir:</span></div>
<div id="cap-073" class="cap clip" data-start="159.475" data-duration="2.76" data-track-index="0"><span>Ölçü gösteren bastonlar <b>90</b>. fasılda,</span></div>
<div id="cap-074" class="cap clip" data-start="162.235" data-duration="3.6" data-track-index="0"><span>spor sopaları <b>95</b>&#x27;te, ahşap baston taslakları ise</span></div>
<div id="cap-075" class="cap clip" data-start="165.835" data-duration="1.736" data-track-index="0"><span><b>44</b>. fasıldadır.</span></div>
<div id="cap-076" class="cap clip" data-start="168.401" data-duration="1.13" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-077" class="cap clip" data-start="169.761" data-duration="3.2" data-track-index="0"><span>Stajyerimiz, baston bastondur diye A şıkkını,</span></div>
<div id="cap-078" class="cap clip" data-start="172.961" data-duration="1.76" data-track-index="0"><span><b>66</b>. faslı seçti.</span></div>
<div id="cap-079" class="cap clip" data-start="174.721" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-080" class="cap clip" data-start="175.601" data-duration="2.88" data-track-index="0"><span>Fasıl notu, <b>silah niteliği</b> taşıyan bastonları</span></div>
<div id="cap-081" class="cap clip" data-start="178.481" data-duration="1.547" data-track-index="0"><span>açıkça <b>dışarıda</b> bırakır.</span></div>
<div id="cap-082" class="cap clip" data-start="180.028" data-duration="0.973" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-083" class="cap clip" data-start="181.001" data-duration="2.64" data-track-index="0"><span>Üzerinde <b>ölçü işaretleri</b> bulunan bastonlar da</span></div>
<div id="cap-084" class="cap clip" data-start="183.641" data-duration="1.68" data-track-index="0"><span><b>66</b>. fasla girmez;</span></div>
<div id="cap-085" class="cap clip" data-start="185.321" data-duration="2.16" data-track-index="0"><span><b>90.17</b> pozisyonuna gider.</span></div>
<div id="cap-086" class="cap clip" data-start="187.481" data-duration="1.72" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-087" class="cap clip" data-start="189.201" data-duration="1.44" data-track-index="0"><span>Bastonun içinde ne var,</span></div>
<div id="cap-088" class="cap clip" data-start="190.641" data-duration="0.839" data-track-index="0"><span>ona bakın.</span></div>
<div id="cap-089" class="cap clip" data-start="192.23" data-duration="1.2" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-090" class="cap clip" data-start="193.43" data-duration="1.84" data-track-index="0"><span>Bir otomobil motoruna ait,</span></div>
<div id="cap-091" class="cap clip" data-start="195.27" data-duration="2.8" data-track-index="0"><span>sertleştirilmemiş vulkanize kauçuktan yapılmış</span></div>
<div id="cap-092" class="cap clip" data-start="198.07" data-duration="2.92" data-track-index="0"><span>subap kapağı contası hangi tarife pozisyonunda</span></div>
<div id="cap-093" class="cap clip" data-start="200.99" data-duration="1.01" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-094" class="cap clip" data-start="202.23" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-095" class="cap clip" data-start="203.19" data-duration="1.92" data-track-index="0"><span><b>84.09</b>.</span></div>
<div id="cap-096" class="cap clip" data-start="205.11" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-097" class="cap clip" data-start="205.99" data-duration="1.92" data-track-index="0"><span><b>87.08</b>.</span></div>
<div id="cap-098" class="cap clip" data-start="207.91" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-099" class="cap clip" data-start="208.79" data-duration="1.36" data-track-index="0"><span><b>40.16</b>.</span></div>
<div id="cap-100" class="cap clip" data-start="210.15" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-101" class="cap clip" data-start="211.03" data-duration="1.76" data-track-index="0"><span><b>84.84</b>.</span></div>
<div id="cap-102" class="cap clip" data-start="212.79" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-103" class="cap clip" data-start="213.67" data-duration="1.05" data-track-index="0"><span><b>40.17</b>.</span></div>
<div id="cap-104" class="cap clip" data-start="215.15" data-duration="1.937" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-105" class="cap clip" data-start="221.437" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-106" class="cap clip" data-start="222.237" data-duration="1.04" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-107" class="cap clip" data-start="223.277" data-duration="2.12" data-track-index="0"><span>On altıncı bölümün birinci notu,</span></div>
<div id="cap-108" class="cap clip" data-start="225.397" data-duration="3.08" data-track-index="0"><span>sertleştirilmemiş vulkanize kauçuktan teknik eşyayı</span></div>
<div id="cap-109" class="cap clip" data-start="228.477" data-duration="3.0" data-track-index="0"><span><b>bölüm dışında</b> bırakır ve <b>40.16</b>&#x27;ya gönderir.</span></div>
<div id="cap-110" class="cap clip" data-start="231.477" data-duration="4.04" data-track-index="0"><span>Bu yüzden conta, motora ait olsa da <b>84.09</b>&#x27;a,</span></div>
<div id="cap-111" class="cap clip" data-start="235.517" data-duration="2.04" data-track-index="0"><span>yani <b>motor aksamına</b> girmez.</span></div>
<div id="cap-112" class="cap clip" data-start="237.557" data-duration="4.0" data-track-index="0"><span>Taşıt aksamı pozisyonu <b>87.08</b> de bu eşyayı almaz.</span></div>
<div id="cap-113" class="cap clip" data-start="241.557" data-duration="2.76" data-track-index="0"><span>Sertleştirilmiş kauçuk olmadığı için <b>40.17</b>&#x27;ye</span></div>
<div id="cap-114" class="cap clip" data-start="244.317" data-duration="0.88" data-track-index="0"><span>de gitmez.</span></div>
<div id="cap-115" class="cap clip" data-start="245.197" data-duration="3.04" data-track-index="0"><span>Doğru yer, kauçuk eşyanın <b>artık pozisyonu</b> olan</span></div>
<div id="cap-116" class="cap clip" data-start="248.237" data-duration="1.244" data-track-index="0"><span><b>40.16</b>&#x27;dır.</span></div>
<div id="cap-117" class="cap clip" data-start="250.311" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-118" class="cap clip" data-start="251.831" data-duration="3.12" data-track-index="0"><span>Yardımcımız, motordan söküldüğü için A şıkkını,</span></div>
<div id="cap-119" class="cap clip" data-start="254.951" data-duration="1.64" data-track-index="0"><span>motor aksamını seçti.</span></div>
<div id="cap-120" class="cap clip" data-start="256.591" data-duration="0.64" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-121" class="cap clip" data-start="257.231" data-duration="3.32" data-track-index="0"><span>Aksam pozisyonu, kendi pozisyonu olan eşyayı almaz;</span></div>
<div id="cap-122" class="cap clip" data-start="260.551" data-duration="2.0" data-track-index="0"><span>kauçuk conta <b>40.16</b>&#x27;dadır.</span></div>
<div id="cap-123" class="cap clip" data-start="262.551" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-124" class="cap clip" data-start="263.591" data-duration="2.6" data-track-index="0"><span>Farklı malzemelerden contalar bir poşette takım</span></div>
<div id="cap-125" class="cap clip" data-start="266.191" data-duration="3.507" data-track-index="0"><span>hâlinde gelirse, <b>84.84</b> pozisyonuna gider.</span></div>
<div id="cap-126" class="cap clip" data-start="269.698" data-duration="0.813" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-127" class="cap clip" data-start="270.511" data-duration="1.56" data-track-index="0"><span>Önce malzemenin notuna,</span></div>
<div id="cap-128" class="cap clip" data-start="272.071" data-duration="1.398" data-track-index="0"><span>sonra makineye bakın.</span></div>
<div id="cap-129" class="cap clip" data-start="274.299" data-duration="1.12" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-130" class="cap clip" data-start="275.419" data-duration="1.48" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-131" class="cap clip" data-start="276.899" data-duration="0.76" data-track-index="0"><span>Bir:</span></div>
<div id="cap-132" class="cap clip" data-start="277.659" data-duration="2.72" data-track-index="0"><span>Taşıt insan taşıyorsa <b>87.03</b>,</span></div>
