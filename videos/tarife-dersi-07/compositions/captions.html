      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="305.15">
<div id="cap-001" class="cap clip" data-start="1.808" data-duration="2.992" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.8" data-duration="1.76" data-track-index="0"><span>yedincisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.56" data-duration="1.52" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.08" data-duration="3.44" data-track-index="0"><span>yem bitkileri, ev aletleri ve eritilmiş kuvars.</span></div>
<div id="cap-005" class="cap clip" data-start="11.52" data-duration="0.96" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-006" class="cap clip" data-start="12.48" data-duration="3.32" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-007" class="cap clip" data-start="15.8" data-duration="2.246" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.796" data-duration="0.97" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-009" class="cap clip" data-start="19.996" data-duration="3.88" data-track-index="0"><span>Aşağıdakilerden hangisi tarife cetvelinin <b>12</b>. faslında</span></div>
<div id="cap-010" class="cap clip" data-start="23.876" data-duration="1.24" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-011" class="cap clip" data-start="25.116" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-012" class="cap clip" data-start="26.076" data-duration="2.89" data-track-index="0"><span>Kuş yemi olarak kullanılan kanarya otu tohumu.</span></div>
<div id="cap-013" class="cap clip" data-start="29.116" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-014" class="cap clip" data-start="29.996" data-duration="1.12" data-track-index="0"><span>Karabuğday.</span></div>
<div id="cap-015" class="cap clip" data-start="31.116" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-016" class="cap clip" data-start="31.996" data-duration="0.88" data-track-index="0"><span>Yulaf.</span></div>
<div id="cap-017" class="cap clip" data-start="32.876" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-018" class="cap clip" data-start="33.756" data-duration="3.28" data-track-index="0"><span>Hayvan yemi olarak kullanılan kurutulmuş fiğ otu.</span></div>
<div id="cap-019" class="cap clip" data-start="37.036" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-020" class="cap clip" data-start="37.916" data-duration="1.077" data-track-index="0"><span>Tane sorgum.</span></div>
<div id="cap-021" class="cap clip" data-start="39.676" data-duration="1.888" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-022" class="cap clip" data-start="45.914" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-023" class="cap clip" data-start="46.794" data-duration="1.04" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-024" class="cap clip" data-start="47.834" data-duration="3.32" data-track-index="0"><span>Fiğ, hayvan yemi olarak yetiştirilen bir yem bitkisidir;</span></div>
<div id="cap-025" class="cap clip" data-start="51.154" data-duration="1.56" data-track-index="0"><span>tane olarak yenmez.</span></div>
<div id="cap-026" class="cap clip" data-start="52.714" data-duration="2.44" data-track-index="0"><span><b>12.14</b> pozisyonu, yonca,</span></div>
<div id="cap-027" class="cap clip" data-start="55.154" data-duration="3.16" data-track-index="0"><span>korunga, fiğ ve benzeri <b>kaba yem</b> ürünlerini <b>adıyla</b></span></div>
<div id="cap-028" class="cap clip" data-start="58.314" data-duration="0.72" data-track-index="0"><span>sayar;</span></div>
<div id="cap-029" class="cap clip" data-start="59.034" data-duration="2.4" data-track-index="0"><span>kurutulmuş olması da sonucu değiştirmez.</span></div>
<div id="cap-030" class="cap clip" data-start="61.434" data-duration="3.4" data-track-index="0"><span>Diğer dört ürün hububattır ve <b>10</b>. fasılda kalır:</span></div>
<div id="cap-031" class="cap clip" data-start="64.834" data-duration="3.28" data-track-index="0"><span>Kanarya otu tohumu ve karabuğday <b>10.08</b>,</span></div>
<div id="cap-032" class="cap clip" data-start="68.114" data-duration="4.721" data-track-index="0"><span>yulaf <b>10.04</b>, tane sorgum ise <b>10.07</b> pozisyonundadır.</span></div>
<div id="cap-033" class="cap clip" data-start="73.665" data-duration="1.33" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-034" class="cap clip" data-start="75.025" data-duration="3.44" data-track-index="0"><span>Cano, kuş yemi de bir tohumdur diye A şıkkını,</span></div>
<div id="cap-035" class="cap clip" data-start="78.465" data-duration="1.92" data-track-index="0"><span>kanarya otu tohumunu seçti.</span></div>
<div id="cap-036" class="cap clip" data-start="80.385" data-duration="0.72" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-037" class="cap clip" data-start="81.105" data-duration="1.84" data-track-index="0"><span>Kanarya otu bir hububattır;</span></div>
<div id="cap-038" class="cap clip" data-start="82.945" data-duration="2.88" data-track-index="0"><span>kuşlara yem olarak verilse de <b>10</b>. fasılda,</span></div>
<div id="cap-039" class="cap clip" data-start="85.825" data-duration="2.16" data-track-index="0"><span><b>10.08</b> pozisyonunda kalır.</span></div>
<div id="cap-040" class="cap clip" data-start="87.985" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-041" class="cap clip" data-start="89.025" data-duration="2.16" data-track-index="0"><span>Fiğin tohumu da <b>12</b>. fasıldadır;</span></div>
<div id="cap-042" class="cap clip" data-start="91.185" data-duration="3.8" data-track-index="0"><span>fasıl notu onu <b>ekime mahsus</b> tohum sayar ve <b>12.09</b>&#x27;a</span></div>
<div id="cap-043" class="cap clip" data-start="94.985" data-duration="0.84" data-track-index="0"><span>gönderir.</span></div>
<div id="cap-044" class="cap clip" data-start="95.825" data-duration="0.8" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-045" class="cap clip" data-start="96.625" data-duration="1.28" data-track-index="0"><span>Önce bitkiyi tanıyın;</span></div>
<div id="cap-046" class="cap clip" data-start="97.905" data-duration="2.131" data-track-index="0"><span>hububat mı, yem bitkisi mi?</span></div>
<div id="cap-047" class="cap clip" data-start="100.786" data-duration="1.2" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-048" class="cap clip" data-start="101.986" data-duration="2.36" data-track-index="0"><span>Aşağıdaki ev aletlerinden hangisi,</span></div>
<div id="cap-049" class="cap clip" data-start="104.346" data-duration="3.0" data-track-index="0"><span>diğerlerinden farklı bir fasılda sınıflandırılır?</span></div>
<div id="cap-050" class="cap clip" data-start="107.346" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-051" class="cap clip" data-start="108.306" data-duration="2.32" data-track-index="0"><span>Ev tipi bulaşık yıkama makinesi.</span></div>
<div id="cap-052" class="cap clip" data-start="110.626" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-053" class="cap clip" data-start="111.586" data-duration="1.92" data-track-index="0"><span>Ev tipi mikrodalga fırın.</span></div>
<div id="cap-054" class="cap clip" data-start="113.506" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-055" class="cap clip" data-start="114.466" data-duration="2.32" data-track-index="0"><span>Ev tipi çamaşır kurutma makinesi.</span></div>
<div id="cap-056" class="cap clip" data-start="116.786" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-057" class="cap clip" data-start="117.746" data-duration="1.84" data-track-index="0"><span>Duvar tipi split klima.</span></div>
<div id="cap-058" class="cap clip" data-start="119.586" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-059" class="cap clip" data-start="120.466" data-duration="1.397" data-track-index="0"><span>Ev tipi buzdolabı.</span></div>
<div id="cap-060" class="cap clip" data-start="122.426" data-duration="1.81" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-061" class="cap clip" data-start="128.635" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-062" class="cap clip" data-start="129.515" data-duration="1.04" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-063" class="cap clip" data-start="130.555" data-duration="3.6" data-track-index="0"><span>Mikrodalga fırın, yiyeceği elektrikle ısıtan <b>elektrotermik</b></span></div>
<div id="cap-064" class="cap clip" data-start="134.155" data-duration="1.32" data-track-index="0"><span>bir ev cihazıdır;</span></div>
<div id="cap-065" class="cap clip" data-start="135.475" data-duration="3.92" data-track-index="0"><span><b>85</b>. fasılda, <b>85.16</b> pozisyonunda yer alır.</span></div>
<div id="cap-066" class="cap clip" data-start="139.395" data-duration="2.4" data-track-index="0"><span>Diğerleri <b>84</b>. fasıldadır:</span></div>
<div id="cap-067" class="cap clip" data-start="141.795" data-duration="4.013" data-track-index="0"><span>Klima <b>84.15</b>, buzdolabı <b>84.18</b>,</span></div>
<div id="cap-068" class="cap clip" data-start="145.808" data-duration="2.387" data-track-index="0"><span>bulaşık makinesi <b>84.22</b>,</span></div>
<div id="cap-069" class="cap clip" data-start="148.195" data-duration="4.096" data-track-index="0"><span>çamaşır kurutma makinesi ise <b>84.51</b> pozisyonundadır.</span></div>
<div id="cap-070" class="cap clip" data-start="153.121" data-duration="1.41" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-071" class="cap clip" data-start="154.561" data-duration="3.92" data-track-index="0"><span>Stajyerimiz, saç kurutma makinesi <b>85.16</b>&#x27;da diye</span></div>
<div id="cap-072" class="cap clip" data-start="158.481" data-duration="2.64" data-track-index="0"><span>çamaşır kurutma makinesini de oraya koydu ve C</span></div>
<div id="cap-073" class="cap clip" data-start="161.121" data-duration="1.12" data-track-index="0"><span>şıkkını seçti.</span></div>
<div id="cap-074" class="cap clip" data-start="162.241" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-075" class="cap clip" data-start="163.041" data-duration="1.44" data-track-index="0"><span><b>Çamaşır kurutma</b> makinesi,</span></div>
<div id="cap-076" class="cap clip" data-start="164.481" data-duration="2.88" data-track-index="0"><span><b>dokumaya elverişli</b> eşyayı kurutan bir makinedir;</span></div>
<div id="cap-077" class="cap clip" data-start="167.361" data-duration="1.6" data-track-index="0"><span><b>84.51</b>&#x27;dedir.</span></div>
<div id="cap-078" class="cap clip" data-start="168.961" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-079" class="cap clip" data-start="170.001" data-duration="2.32" data-track-index="0"><span>Demir ya da çelikten, <b>gazla çalışan</b>,</span></div>
<div id="cap-080" class="cap clip" data-start="172.321" data-duration="4.37" data-track-index="0"><span>elektriksiz ev tipi fırın ve ocaklar ise <b>73.21</b>&#x27;dedir.</span></div>
<div id="cap-081" class="cap clip" data-start="176.721" data-duration="1.76" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-082" class="cap clip" data-start="178.481" data-duration="1.36" data-track-index="0"><span>Ne kuruttuğuna bakın;</span></div>
<div id="cap-083" class="cap clip" data-start="179.841" data-duration="1.741" data-track-index="0"><span>saç mı, çamaşır mı?</span></div>
<div id="cap-084" class="cap clip" data-start="182.332" data-duration="1.25" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-085" class="cap clip" data-start="183.612" data-duration="2.0" data-track-index="0"><span>Laboratuvarda kullanılmak üzere,</span></div>
<div id="cap-086" class="cap clip" data-start="185.612" data-duration="2.68" data-track-index="0"><span>eritilmiş kuvarstan yapılmış deney tüpü tarife</span></div>
<div id="cap-087" class="cap clip" data-start="188.292" data-duration="2.93" data-track-index="0"><span>cetvelinin hangi faslında sınıflandırılır?</span></div>
<div id="cap-088" class="cap clip" data-start="191.292" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-089" class="cap clip" data-start="192.252" data-duration="1.52" data-track-index="0"><span>Yirmi beşinci fasıl.</span></div>
<div id="cap-090" class="cap clip" data-start="193.772" data-duration="0.933" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-091" class="cap clip" data-start="194.705" data-duration="1.547" data-track-index="0"><span>Yirmi sekizinci fasıl.</span></div>
<div id="cap-092" class="cap clip" data-start="196.252" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-093" class="cap clip" data-start="197.132" data-duration="1.68" data-track-index="0"><span>Altmış dokuzuncu fasıl.</span></div>
<div id="cap-094" class="cap clip" data-start="198.812" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-095" class="cap clip" data-start="199.692" data-duration="1.6" data-track-index="0"><span>Yetmiş birinci fasıl.</span></div>
<div id="cap-096" class="cap clip" data-start="201.292" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-097" class="cap clip" data-start="202.172" data-duration="1.21" data-track-index="0"><span>Yetmişinci fasıl.</span></div>
<div id="cap-098" class="cap clip" data-start="203.772" data-duration="1.798" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-099" class="cap clip" data-start="209.92" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-100" class="cap clip" data-start="210.8" data-duration="1.04" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-101" class="cap clip" data-start="211.84" data-duration="2.96" data-track-index="0"><span>Yetmişinci faslın beşinci notuna göre eritilmiş</span></div>
<div id="cap-102" class="cap clip" data-start="214.8" data-duration="2.2" data-track-index="0"><span>kuvars ve diğer eritilmiş silis,</span></div>
<div id="cap-103" class="cap clip" data-start="217.0" data-duration="3.08" data-track-index="0"><span>tarifenin neresinde geçerse geçsin <b>cam sayılır</b>.</span></div>
<div id="cap-104" class="cap clip" data-start="220.08" data-duration="2.2" data-track-index="0"><span>Eşya bir laboratuvar deney tüpüdür;</span></div>
<div id="cap-105" class="cap clip" data-start="222.28" data-duration="2.56" data-track-index="0"><span>yani laboratuvarda kullanılan cam eşya.</span></div>
<div id="cap-106" class="cap clip" data-start="224.84" data-duration="1.92" data-track-index="0"><span>Bu nedenle <b>70</b>. fasılda,</span></div>
<div id="cap-107" class="cap clip" data-start="226.76" data-duration="2.16" data-track-index="0"><span><b>70.17</b> pozisyonunda yer alır.</span></div>
<div id="cap-108" class="cap clip" data-start="228.92" data-duration="2.2" data-track-index="0"><span>Diğer fasıllar bu eşyayı almaz:</span></div>
<div id="cap-109" class="cap clip" data-start="231.12" data-duration="3.76" data-track-index="0"><span>Doğal kuvars <b>25</b>&#x27;te, silisyum dioksit <b>28</b>&#x27;de,</span></div>
<div id="cap-110" class="cap clip" data-start="234.88" data-duration="4.521" data-track-index="0"><span>seramik eşya <b>69</b>&#x27;da, yarı kıymetli taşlar ise <b>71</b>&#x27;dedir.</span></div>
<div id="cap-111" class="cap clip" data-start="240.231" data-duration="1.44" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-112" class="cap clip" data-start="241.671" data-duration="3.52" data-track-index="0"><span>Yardımcımız, kuvars bir mineraldir diye A şıkkını,</span></div>
<div id="cap-113" class="cap clip" data-start="245.191" data-duration="1.84" data-track-index="0"><span><b>25</b>. faslı seçti.</span></div>
<div id="cap-114" class="cap clip" data-start="247.031" data-duration="0.6" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-115" class="cap clip" data-start="247.631" data-duration="3.16" data-track-index="0"><span>Kuvars eritildiği anda tarifenin gözünde <b>camdır</b>;</span></div>
<div id="cap-116" class="cap clip" data-start="250.791" data-duration="2.68" data-track-index="0"><span>fasıl notu bunu tarifenin her yeri için söyler.</span></div>
<div id="cap-117" class="cap clip" data-start="253.471" data-duration="0.893" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-118" class="cap clip" data-start="254.364" data-duration="2.587" data-track-index="0"><span>Eritilmiş kuvarstan, henüz <b>işlenmemiş</b> borular</span></div>
<div id="cap-119" class="cap clip" data-start="256.951" data-duration="3.093" data-track-index="0"><span>da <b>70</b>. fasıldadır, bu kez <b>70.02</b>&#x27;de.</span></div>
<div id="cap-120" class="cap clip" data-start="260.044" data-duration="0.72" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-121" class="cap clip" data-start="260.764" data-duration="2.625" data-track-index="0"><span>Kuvars <b>eritildiyse</b>, cam faslına bakın.</span></div>
<div id="cap-122" class="cap clip" data-start="264.326" data-duration="1.013" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-123" class="cap clip" data-start="265.339" data-duration="1.56" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-124" class="cap clip" data-start="266.899" data-duration="0.76" data-track-index="0"><span>Bir:</span></div>
<div id="cap-125" class="cap clip" data-start="267.659" data-duration="1.8" data-track-index="0"><span>Hububat <b>10</b>. fasılda;</span></div>
<div id="cap-126" class="cap clip" data-start="269.459" data-duration="3.4" data-track-index="0"><span>fiğ, yonca gibi yem bitkileri <b>12</b>. fasılda.</span></div>
<div id="cap-127" class="cap clip" data-start="272.859" data-duration="0.72" data-track-index="0"><span>İki:</span></div>
<div id="cap-128" class="cap clip" data-start="273.579" data-duration="1.973" data-track-index="0"><span>Ev aletinde ne yaptığına bakın;</span></div>
<div id="cap-129" class="cap clip" data-start="275.552" data-duration="2.227" data-track-index="0"><span>mikrodalga fırın <b>85.16</b>,</span></div>
<div id="cap-130" class="cap clip" data-start="277.779" data-duration="3.0" data-track-index="0"><span>çamaşır kurutma makinesi <b>84.51</b>.</span></div>
<div id="cap-131" class="cap clip" data-start="280.779" data-duration="0.64" data-track-index="0"><span>Üç:</span></div>
<div id="cap-132" class="cap clip" data-start="281.419" data-duration="3.398" data-track-index="0"><span>Eritilmiş kuvars, tarifenin her yerinde <b>camdır</b>.</span></div>
<div id="cap-133" class="cap clip" data-start="285.567" data-duration="1.68" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
