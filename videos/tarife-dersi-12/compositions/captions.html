      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="328.58">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.12" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.8" data-duration="1.84" data-track-index="0"><span><b>12</b>&#x27;ncisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.64" data-duration="1.56" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.2" data-duration="3.64" data-track-index="0"><span>pul biber, güneş paneli ve iki tekerlekli taşıtlar.</span></div>
<div id="cap-005" class="cap clip" data-start="11.84" data-duration="1.04" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-006" class="cap clip" data-start="12.88" data-duration="3.227" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-007" class="cap clip" data-start="16.107" data-duration="2.252" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="19.109" data-duration="1.2" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-009" class="cap clip" data-start="20.309" data-duration="2.24" data-track-index="0"><span>Kurutulup pul hâlinde ezilmiş,</span></div>
<div id="cap-010" class="cap clip" data-start="22.549" data-duration="2.8" data-track-index="0"><span>başka hiçbir madde katılmamış kırmızı biber,</span></div>
<div id="cap-011" class="cap clip" data-start="25.349" data-duration="4.0" data-track-index="0"><span>yani pul biber, hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-012" class="cap clip" data-start="29.349" data-duration="1.04" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="30.389" data-duration="1.92" data-track-index="0"><span><b>07.09</b>.</span></div>
<div id="cap-014" class="cap clip" data-start="32.309" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="33.269" data-duration="1.56" data-track-index="0"><span><b>07.12</b>.</span></div>
<div id="cap-016" class="cap clip" data-start="34.829" data-duration="1.0" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="35.829" data-duration="1.8" data-track-index="0"><span><b>09.04</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="37.629" data-duration="0.92" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-019" class="cap clip" data-start="38.549" data-duration="1.52" data-track-index="0"><span><b>20.05</b>.</span></div>
<div id="cap-020" class="cap clip" data-start="40.069" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="40.949" data-duration="1.76" data-track-index="0"><span><b>21.03</b>.</span></div>
<div id="cap-022" class="cap clip" data-start="42.709" data-duration="1.884" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-023" class="cap clip" data-start="48.943" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-024" class="cap clip" data-start="49.743" data-duration="1.04" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="50.783" data-duration="3.12" data-track-index="0"><span>Pul biber, Capsicum cinsi kırmızı biberin <b>kurutulup</b></span></div>
<div id="cap-026" class="cap clip" data-start="53.903" data-duration="1.53" data-track-index="0"><span>ezilmiş hâlidir.</span></div>
<div id="cap-027" class="cap clip" data-start="55.503" data-duration="1.92" data-track-index="0"><span><b>7</b>. faslın <b>açıklama notu</b>,</span></div>
<div id="cap-028" class="cap clip" data-start="57.423" data-duration="3.04" data-track-index="0"><span>Capsicum ve Pimenta cinsi biberlerin kurutulmuş,</span></div>
<div id="cap-029" class="cap clip" data-start="60.463" data-duration="3.08" data-track-index="0"><span>ezilmiş veya öğütülmüş meyvelerini bu fasıl dışında</span></div>
<div id="cap-030" class="cap clip" data-start="63.543" data-duration="0.76" data-track-index="0"><span>bırakır.</span></div>
<div id="cap-031" class="cap clip" data-start="64.303" data-duration="2.96" data-track-index="0"><span><b>09.04</b> de bunları <b>adıyla</b> sayar.</span></div>
<div id="cap-032" class="cap clip" data-start="67.263" data-duration="1.12" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-033" class="cap clip" data-start="68.383" data-duration="1.56" data-track-index="0"><span><b>09.04</b>.</span></div>
<div id="cap-034" class="cap clip" data-start="69.943" data-duration="2.969" data-track-index="0"><span>Taze biber ise <b>07.09</b>&#x27;dadır.</span></div>
<div id="cap-035" class="cap clip" data-start="73.742" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-036" class="cap clip" data-start="75.262" data-duration="2.16" data-track-index="0"><span>Cano, biber bir sebzedir,</span></div>
<div id="cap-037" class="cap clip" data-start="77.422" data-duration="3.36" data-track-index="0"><span>kurutulmuş sebze de <b>07.12</b>&#x27;dedir diye B şıkkını</span></div>
<div id="cap-038" class="cap clip" data-start="80.782" data-duration="0.72" data-track-index="0"><span>seçti.</span></div>
<div id="cap-039" class="cap clip" data-start="81.502" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-040" class="cap clip" data-start="82.302" data-duration="3.84" data-track-index="0"><span><b>07.12</b>, Capsicum ve Pimenta cinsi kurutulmuş biberleri</span></div>
<div id="cap-041" class="cap clip" data-start="86.142" data-duration="1.4" data-track-index="0"><span>açıkça hariç tutar;</span></div>
<div id="cap-042" class="cap clip" data-start="87.542" data-duration="2.547" data-track-index="0"><span>bunlar <b>baharat</b> olarak <b>9</b>. fasıldadır.</span></div>
<div id="cap-043" class="cap clip" data-start="90.089" data-duration="0.893" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-044" class="cap clip" data-start="90.982" data-duration="2.76" data-track-index="0"><span>Biber salçası ya da biber turşusu gibi hazırlanmış</span></div>
<div id="cap-045" class="cap clip" data-start="93.742" data-duration="1.973" data-track-index="0"><span>ürünler <b>20</b>. fasla gider.</span></div>
<div id="cap-046" class="cap clip" data-start="95.715" data-duration="0.854" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-047" class="cap clip" data-start="96.569" data-duration="2.969" data-track-index="0"><span>Biber <b>kuruysa</b> <b>baharat</b>, <b>tazeyse</b> sebze.</span></div>
<div id="cap-048" class="cap clip" data-start="100.288" data-duration="1.05" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-049" class="cap clip" data-start="101.568" data-duration="2.64" data-track-index="0"><span>Yalnızca birbirine bağlanmış güneş pillerinden</span></div>
<div id="cap-050" class="cap clip" data-start="104.208" data-duration="0.72" data-track-index="0"><span>oluşan;</span></div>
<div id="cap-051" class="cap clip" data-start="104.928" data-duration="3.44" data-track-index="0"><span>invertör, akü veya bir motoru doğrudan besleyen</span></div>
<div id="cap-052" class="cap clip" data-start="108.368" data-duration="3.12" data-track-index="0"><span>başka bir eleman içermeyen fotovoltaik güneş paneli</span></div>
<div id="cap-053" class="cap clip" data-start="111.488" data-duration="2.69" data-track-index="0"><span>hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-054" class="cap clip" data-start="114.208" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-055" class="cap clip" data-start="115.088" data-duration="1.57" data-track-index="0"><span><b>85.01</b>.</span></div>
<div id="cap-056" class="cap clip" data-start="116.688" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-057" class="cap clip" data-start="117.568" data-duration="1.76" data-track-index="0"><span><b>85.04</b>.</span></div>
<div id="cap-058" class="cap clip" data-start="119.328" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-059" class="cap clip" data-start="120.208" data-duration="1.68" data-track-index="0"><span><b>85.07</b>.</span></div>
<div id="cap-060" class="cap clip" data-start="121.888" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-061" class="cap clip" data-start="122.768" data-duration="1.6" data-track-index="0"><span><b>85.41</b>.</span></div>
<div id="cap-062" class="cap clip" data-start="124.368" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-063" class="cap clip" data-start="125.248" data-duration="1.53" data-track-index="0"><span><b>94.05</b>.</span></div>
<div id="cap-064" class="cap clip" data-start="127.568" data-duration="1.731" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-065" class="cap clip" data-start="133.649" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-066" class="cap clip" data-start="134.449" data-duration="1.04" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-067" class="cap clip" data-start="135.489" data-duration="2.907" data-track-index="0"><span>Güneş ışığını doğrudan elektriğe çeviren fotovoltaik</span></div>
<div id="cap-068" class="cap clip" data-start="138.396" data-duration="3.013" data-track-index="0"><span>hücreler, modül ya da panel hâlinde birleştirilmiş</span></div>
<div id="cap-069" class="cap clip" data-start="141.409" data-duration="3.76" data-track-index="0"><span>olsalar da <b>yarı iletken</b> cihaz sayılır ve <b>85.41</b>&#x27;de</span></div>
<div id="cap-070" class="cap clip" data-start="145.169" data-duration="1.0" data-track-index="0"><span>yer alır.</span></div>
<div id="cap-071" class="cap clip" data-start="146.169" data-duration="3.76" data-track-index="0"><span><b>85.01</b>&#x27;in <b>açıklama notu</b> ise yalnızca akü,</span></div>
<div id="cap-072" class="cap clip" data-start="149.929" data-duration="2.6" data-track-index="0"><span>invertör gibi cihazlarla birleştirilmiş ya da</span></div>
<div id="cap-073" class="cap clip" data-start="152.529" data-duration="2.88" data-track-index="0"><span>gücü doğrudan bir motora veren elemanlarla donatılmış</span></div>
<div id="cap-074" class="cap clip" data-start="155.409" data-duration="2.8" data-track-index="0"><span>panelleri <b>fotovoltaik jeneratör</b> olarak alır.</span></div>
<div id="cap-075" class="cap clip" data-start="158.209" data-duration="1.69" data-track-index="0"><span>Bizim panelimizde bunlar yok.</span></div>
<div id="cap-076" class="cap clip" data-start="160.049" data-duration="1.04" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-077" class="cap clip" data-start="161.089" data-duration="1.48" data-track-index="0"><span><b>85.41</b>.</span></div>
<div id="cap-078" class="cap clip" data-start="162.569" data-duration="3.24" data-track-index="0"><span>Konvertörler, akümülatörler ve aydınlatma cihazları</span></div>
<div id="cap-079" class="cap clip" data-start="165.809" data-duration="1.971" data-track-index="0"><span>ise başka pozisyonlardadır.</span></div>
<div id="cap-080" class="cap clip" data-start="168.61" data-duration="1.44" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-081" class="cap clip" data-start="170.05" data-duration="2.64" data-track-index="0"><span>Yardımcımız, panel elektrik üretiyor,</span></div>
<div id="cap-082" class="cap clip" data-start="172.69" data-duration="2.52" data-track-index="0"><span>o hâlde jeneratördür diye A şıkkını,</span></div>
<div id="cap-083" class="cap clip" data-start="175.21" data-duration="1.8" data-track-index="0"><span><b>85.01</b>&#x27;i seçti.</span></div>
<div id="cap-084" class="cap clip" data-start="177.01" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-085" class="cap clip" data-start="177.89" data-duration="4.52" data-track-index="0"><span><b>85.01</b>, ancak akü, invertör gibi cihazlarla birleştirilmiş</span></div>
<div id="cap-086" class="cap clip" data-start="182.41" data-duration="2.2" data-track-index="0"><span>fotovoltaik jeneratörleri kapsar.</span></div>
<div id="cap-087" class="cap clip" data-start="184.61" data-duration="2.587" data-track-index="0"><span><b>Tek başına</b> panel <b>85.41</b>&#x27;dedir.</span></div>
<div id="cap-088" class="cap clip" data-start="187.197" data-duration="1.013" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-089" class="cap clip" data-start="188.21" data-duration="3.2" data-track-index="0"><span>Fotovoltaik, LED ışık kaynaklı aydınlatma cihazları</span></div>
<div id="cap-090" class="cap clip" data-start="191.41" data-duration="1.89" data-track-index="0"><span><b>94.05</b>&#x27;tedir.</span></div>
<div id="cap-091" class="cap clip" data-start="193.33" data-duration="1.84" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-092" class="cap clip" data-start="195.17" data-duration="2.136" data-track-index="0"><span><b>Panelin yanında</b> başka ne var?</span></div>
<div id="cap-093" class="cap clip" data-start="198.056" data-duration="1.2" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-094" class="cap clip" data-start="199.256" data-duration="4.88" data-track-index="0"><span>Aşağıdakilerden hangisi <b>87.11</b> pozisyonunda sınıflandırılmaz?</span></div>
<div id="cap-095" class="cap clip" data-start="204.136" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-096" class="cap clip" data-start="205.096" data-duration="2.0" data-track-index="0"><span>Pedal çevrildiğinde devreye giren,</span></div>
<div id="cap-097" class="cap clip" data-start="207.096" data-duration="2.48" data-track-index="0"><span>yardımcı elektrik motorlu bisiklet.</span></div>
<div id="cap-098" class="cap clip" data-start="209.576" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-099" class="cap clip" data-start="210.536" data-duration="1.6" data-track-index="0"><span>Ayakla itilerek ilerleyen,</span></div>
<div id="cap-100" class="cap clip" data-start="212.136" data-duration="3.2" data-track-index="0"><span>yetişkinlerin de kullanabildiği motorsuz skuter.</span></div>
<div id="cap-101" class="cap clip" data-start="215.336" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-102" class="cap clip" data-start="216.296" data-duration="1.52" data-track-index="0"><span>Kendi kendini dengeleyen,</span></div>
<div id="cap-103" class="cap clip" data-start="217.816" data-duration="3.36" data-track-index="0"><span>tek kişilik, iki tekerlekli elektrikli nakil aracı.</span></div>
<div id="cap-104" class="cap clip" data-start="221.176" data-duration="0.81" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-105" class="cap clip" data-start="222.056" data-duration="2.72" data-track-index="0"><span>Hem motoru hem pedalı bulunan mopet.</span></div>
<div id="cap-106" class="cap clip" data-start="224.776" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-107" class="cap clip" data-start="225.656" data-duration="2.41" data-track-index="0"><span>Motosiklete takılan yan sepet.</span></div>
<div id="cap-108" class="cap clip" data-start="228.216" data-duration="1.803" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-109" class="cap clip" data-start="234.369" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-110" class="cap clip" data-start="235.169" data-duration="1.12" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-111" class="cap clip" data-start="236.289" data-duration="4.0" data-track-index="0"><span><b>87.11</b>, motosikletleri ve <b>yardımcı motorlu</b> bisikletleri</span></div>
<div id="cap-112" class="cap clip" data-start="240.289" data-duration="0.73" data-track-index="0"><span>kapsar.</span></div>
<div id="cap-113" class="cap clip" data-start="241.169" data-duration="1.92" data-track-index="0"><span><b>Açıklama notuna</b> göre mopetler,</span></div>
<div id="cap-114" class="cap clip" data-start="243.089" data-duration="2.56" data-track-index="0"><span>kaldırımda kullanılan, kendi kendini dengeleyen</span></div>
<div id="cap-115" class="cap clip" data-start="245.649" data-duration="2.88" data-track-index="0"><span>iki tekerlekli elektrikli araçlar ve motosiklet</span></div>
<div id="cap-116" class="cap clip" data-start="248.529" data-duration="1.77" data-track-index="0"><span>sepetleri de bu pozisyondadır.</span></div>
<div id="cap-117" class="cap clip" data-start="250.369" data-duration="3.08" data-track-index="0"><span>Motorsuz, ayakla itilen skuterler ise yetişkinler</span></div>
<div id="cap-118" class="cap clip" data-start="253.449" data-duration="3.08" data-track-index="0"><span>için tasarlanmış olsa bile <b>95.03</b>&#x27;te,</span></div>
<div id="cap-119" class="cap clip" data-start="256.529" data-duration="2.436" data-track-index="0"><span><b>tekerlekli oyuncaklar</b> arasında sayılır.</span></div>
<div id="cap-120" class="cap clip" data-start="259.795" data-duration="1.36" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-121" class="cap clip" data-start="261.155" data-duration="2.48" data-track-index="0"><span>Stajyerimiz, bisiklet bisiklettir,</span></div>
<div id="cap-122" class="cap clip" data-start="263.635" data-duration="2.96" data-track-index="0"><span><b>87.12</b>&#x27;dedir diye A şıkkını seçti.</span></div>
<div id="cap-123" class="cap clip" data-start="266.595" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-124" class="cap clip" data-start="267.395" data-duration="2.96" data-track-index="0"><span><b>87.12</b> motorsuz bisikletler içindir;</span></div>
<div id="cap-125" class="cap clip" data-start="270.355" data-duration="1.68" data-track-index="0"><span>yardımcı motoru olan bisiklet,</span></div>
<div id="cap-126" class="cap clip" data-start="272.035" data-duration="3.28" data-track-index="0"><span>motoru elektrikli olsa da <b>87.11</b>&#x27;dedir.</span></div>
<div id="cap-127" class="cap clip" data-start="275.315" data-duration="0.96" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-128" class="cap clip" data-start="276.275" data-duration="4.13" data-track-index="0"><span>Çocuklar için üç tekerlekli bisikletler <b>95.03</b>&#x27;tedir.</span></div>
<div id="cap-129" class="cap clip" data-start="280.435" data-duration="1.92" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-130" class="cap clip" data-start="282.355" data-duration="1.172" data-track-index="0"><span><b>Motor var mı?</b></span></div>
<div id="cap-131" class="cap clip" data-start="284.357" data-duration="1.12" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-132" class="cap clip" data-start="285.477" data-duration="1.48" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-133" class="cap clip" data-start="286.957" data-duration="0.787" data-track-index="0"><span>Bir:</span></div>
