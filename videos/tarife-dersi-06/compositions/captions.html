      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="319.05">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.2" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.88" data-duration="1.76" data-track-index="0"><span>altıncısına hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.64" data-duration="1.64" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.28" data-duration="1.96" data-track-index="0"><span>tarife cetvelinin yasal dayanağı,</span></div>
<div id="cap-005" class="cap clip" data-start="10.24" data-duration="2.28" data-track-index="0"><span>kod seviyeleri ve meyve faslı.</span></div>
<div id="cap-006" class="cap clip" data-start="12.52" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="13.52" data-duration="3.307" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="16.827" data-duration="2.185" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="19.762" data-duration="1.25" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="21.042" data-duration="2.8" data-track-index="0"><span>Gümrük Giriş Tarife Cetveli ile ilgili aşağıdaki</span></div>
<div id="cap-011" class="cap clip" data-start="23.842" data-duration="2.09" data-track-index="0"><span>ifadelerden hangisi doğrudur?</span></div>
<div id="cap-012" class="cap clip" data-start="26.162" data-duration="1.04" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="27.202" data-duration="3.76" data-track-index="0"><span>Cetvel Brüksel Nomanklatürü esas alınarak düzenlenmiştir;</span></div>
<div id="cap-014" class="cap clip" data-start="30.962" data-duration="3.37" data-track-index="0"><span>pozisyonlarını değiştirmeye Cumhurbaşkanı yetkilidir.</span></div>
<div id="cap-015" class="cap clip" data-start="34.402" data-duration="1.04" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-016" class="cap clip" data-start="35.442" data-duration="3.0" data-track-index="0"><span>Cetvel Armonize Sistem Nomanklatürü esas alınarak</span></div>
<div id="cap-017" class="cap clip" data-start="38.442" data-duration="1.08" data-track-index="0"><span>düzenlenmiştir;</span></div>
<div id="cap-018" class="cap clip" data-start="39.522" data-duration="2.6" data-track-index="0"><span>pozisyonlarını değiştirmeye Ticaret Bakanlığı</span></div>
<div id="cap-019" class="cap clip" data-start="42.122" data-duration="1.09" data-track-index="0"><span>yetkilidir.</span></div>
<div id="cap-020" class="cap clip" data-start="43.282" data-duration="1.04" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="44.322" data-duration="3.2" data-track-index="0"><span>Cetvel Dünya Gümrük Örgütü tarafından yayımlanır;</span></div>
<div id="cap-022" class="cap clip" data-start="47.522" data-duration="2.57" data-track-index="0"><span>ülkeler pozisyonlarını değiştiremez.</span></div>
<div id="cap-023" class="cap clip" data-start="50.162" data-duration="1.04" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-024" class="cap clip" data-start="51.202" data-duration="2.96" data-track-index="0"><span>Cetvel Armonize Sistem Nomanklatürü esas alınarak</span></div>
<div id="cap-025" class="cap clip" data-start="54.162" data-duration="1.12" data-track-index="0"><span>düzenlenmiştir;</span></div>
<div id="cap-026" class="cap clip" data-start="55.282" data-duration="2.96" data-track-index="0"><span>pozisyonlarını ve notlarını değiştirmeye Cumhurbaşkanı</span></div>
<div id="cap-027" class="cap clip" data-start="58.242" data-duration="1.13" data-track-index="0"><span>yetkilidir.</span></div>
<div id="cap-028" class="cap clip" data-start="59.442" data-duration="1.04" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-029" class="cap clip" data-start="60.482" data-duration="3.52" data-track-index="0"><span>Cetvelin ilk <b>6</b> hanesi ulusal düzeyde belirlenir;</span></div>
<div id="cap-030" class="cap clip" data-start="64.002" data-duration="3.41" data-track-index="0"><span>Armonize Sistem yalnızca fasılları belirler.</span></div>
<div id="cap-031" class="cap clip" data-start="67.762" data-duration="1.883" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-032" class="cap clip" data-start="73.995" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-033" class="cap clip" data-start="74.875" data-duration="1.04" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-034" class="cap clip" data-start="75.915" data-duration="2.96" data-track-index="0"><span>Gümrük Giriş Tarife Cetveli Hakkında Kanuna göre,</span></div>
<div id="cap-035" class="cap clip" data-start="78.875" data-duration="3.0" data-track-index="0"><span>cetvel <b>Armonize Sistem Nomanklatürü</b> esas alınarak</span></div>
<div id="cap-036" class="cap clip" data-start="81.875" data-duration="1.12" data-track-index="0"><span>düzenlenmiştir.</span></div>
<div id="cap-037" class="cap clip" data-start="82.995" data-duration="3.6" data-track-index="0"><span>Pozisyonları, notları ve genel kuralları genişletmeye,</span></div>
<div id="cap-038" class="cap clip" data-start="86.595" data-duration="3.21" data-track-index="0"><span>açmaya ve değiştirmeye <b>Cumhurbaşkanı</b> yetkilidir.</span></div>
<div id="cap-039" class="cap clip" data-start="89.835" data-duration="1.21" data-track-index="0"><span>Diğerleri yanlış:</span></div>
<div id="cap-040" class="cap clip" data-start="91.195" data-duration="2.56" data-track-index="0"><span><b>Brüksel Nomanklatürü</b> <b>eski sistemdir</b>;</span></div>
<div id="cap-041" class="cap clip" data-start="93.755" data-duration="2.56" data-track-index="0"><span>yetki Ticaret Bakanlığında değildir;</span></div>
<div id="cap-042" class="cap clip" data-start="96.315" data-duration="2.76" data-track-index="0"><span>cetveli Dünya Gümrük Örgütü yayımlamaz;</span></div>
<div id="cap-043" class="cap clip" data-start="99.075" data-duration="3.0" data-track-index="0"><span>ilk <b>6</b> hane ise bütün Armonize Sistem ülkelerinde</span></div>
<div id="cap-044" class="cap clip" data-start="102.075" data-duration="1.009" data-track-index="0"><span><b>ortaktır</b>.</span></div>
<div id="cap-045" class="cap clip" data-start="103.914" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-046" class="cap clip" data-start="105.434" data-duration="2.96" data-track-index="0"><span>Cano, cetveli her yıl bakanlık yayımlıyor diye</span></div>
<div id="cap-047" class="cap clip" data-start="108.394" data-duration="1.36" data-track-index="0"><span>B şıkkını seçti.</span></div>
<div id="cap-048" class="cap clip" data-start="109.754" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-049" class="cap clip" data-start="110.554" data-duration="3.24" data-track-index="0"><span>Cetvel her yıl <b>Cumhurbaşkanı</b> kararı olarak yayımlanır;</span></div>
<div id="cap-050" class="cap clip" data-start="113.794" data-duration="3.08" data-track-index="0"><span>Kanun, değiştirme yetkisini açıkça <b>Cumhurbaşkanına</b></span></div>
<div id="cap-051" class="cap clip" data-start="116.874" data-duration="0.587" data-track-index="0"><span>verir.</span></div>
<div id="cap-052" class="cap clip" data-start="117.461" data-duration="1.013" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-053" class="cap clip" data-start="118.474" data-duration="1.88" data-track-index="0"><span>A şıkkının ilk yarısı da tuzak.</span></div>
<div id="cap-054" class="cap clip" data-start="120.354" data-duration="3.0" data-track-index="0"><span><b>Brüksel Nomanklatürü</b>, Armonize Sistemden önceki</span></div>
<div id="cap-055" class="cap clip" data-start="123.354" data-duration="1.24" data-track-index="0"><span><b>eski sistemdir</b>.</span></div>
<div id="cap-056" class="cap clip" data-start="124.594" data-duration="2.84" data-track-index="0"><span>Bu tür sorularda her şıkkın <b>iki yarısını</b> da ayrı</span></div>
<div id="cap-057" class="cap clip" data-start="127.434" data-duration="1.257" data-track-index="0"><span>ayrı kontrol edin.</span></div>
<div id="cap-058" class="cap clip" data-start="129.441" data-duration="1.05" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-059" class="cap clip" data-start="130.641" data-duration="3.2" data-track-index="0"><span>Aşağıdaki kodlardan hangisi bir Armonize Sistem</span></div>
<div id="cap-060" class="cap clip" data-start="133.841" data-duration="1.44" data-track-index="0"><span>alt pozisyonudur?</span></div>
<div id="cap-061" class="cap clip" data-start="135.281" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-062" class="cap clip" data-start="136.161" data-duration="1.76" data-track-index="0"><span><b>85.01</b>.</span></div>
<div id="cap-063" class="cap clip" data-start="137.921" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-064" class="cap clip" data-start="138.801" data-duration="2.2" data-track-index="0"><span><b>8501.10</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="141.001" data-duration="0.84" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-066" class="cap clip" data-start="141.841" data-duration="1.2" data-track-index="0"><span><b>85</b>.</span></div>
<div id="cap-067" class="cap clip" data-start="143.041" data-duration="0.92" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-068" class="cap clip" data-start="143.961" data-duration="4.6" data-track-index="0"><span><b>8501.10.10.00.00</b>.</span></div>
<div id="cap-069" class="cap clip" data-start="148.561" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-070" class="cap clip" data-start="149.441" data-duration="2.8" data-track-index="0"><span><b>8501.10.10</b>.</span></div>
<div id="cap-071" class="cap clip" data-start="152.241" data-duration="1.901" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-072" class="cap clip" data-start="158.492" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-073" class="cap clip" data-start="159.292" data-duration="1.04" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-074" class="cap clip" data-start="160.332" data-duration="1.64" data-track-index="0"><span>Kod merdivenini kuralım.</span></div>
<div id="cap-075" class="cap clip" data-start="161.972" data-duration="3.68" data-track-index="0"><span>İlk <b>2</b> hane faslı, ilk <b>4</b> hane pozisyonu gösterir.</span></div>
<div id="cap-076" class="cap clip" data-start="165.652" data-duration="3.32" data-track-index="0"><span>İlk <b>6</b> hane ise Armonize Sistem <b>alt pozisyonudur</b></span></div>
<div id="cap-077" class="cap clip" data-start="168.972" data-duration="2.92" data-track-index="0"><span>ve bütün Armonize Sistem ülkelerinde <b>ortaktır</b>.</span></div>
<div id="cap-078" class="cap clip" data-start="171.892" data-duration="3.08" data-track-index="0"><span><b>8501.10</b> tam <b>6</b> hanedir;</span></div>
<div id="cap-079" class="cap clip" data-start="174.972" data-duration="1.04" data-track-index="0"><span>cevap budur.</span></div>
<div id="cap-080" class="cap clip" data-start="176.012" data-duration="3.36" data-track-index="0"><span><b>8</b> hane Avrupa Birliği Kombine Nomanklatürünü,</span></div>
<div id="cap-081" class="cap clip" data-start="179.372" data-duration="3.08" data-track-index="0"><span><b>12</b> hane ise Gümrük Tarife İstatistik Pozisyonunu</span></div>
<div id="cap-082" class="cap clip" data-start="182.452" data-duration="0.976" data-track-index="0"><span>gösterir.</span></div>
<div id="cap-083" class="cap clip" data-start="184.258" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-084" class="cap clip" data-start="185.778" data-duration="3.24" data-track-index="0"><span>Stajyerimiz, en uzun kod en ayrıntılısıdır diye</span></div>
<div id="cap-085" class="cap clip" data-start="189.018" data-duration="1.64" data-track-index="0"><span><b>12</b> haneli kodu seçti.</span></div>
<div id="cap-086" class="cap clip" data-start="190.658" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-087" class="cap clip" data-start="191.458" data-duration="2.36" data-track-index="0"><span>Soru Armonize Sistem düzeyini soruyor;</span></div>
<div id="cap-088" class="cap clip" data-start="193.818" data-duration="1.88" data-track-index="0"><span>o düzey <b>6 hanede biter</b>.</span></div>
<div id="cap-089" class="cap clip" data-start="195.698" data-duration="3.04" data-track-index="0"><span><b>7</b>. ve <b>8</b>. haneler Kombine Nomanklatürden,</span></div>
<div id="cap-090" class="cap clip" data-start="198.738" data-duration="2.293" data-track-index="0"><span>sonrakiler ulusal açılımdan gelir.</span></div>
<div id="cap-091" class="cap clip" data-start="201.031" data-duration="1.76" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-092" class="cap clip" data-start="202.791" data-duration="1.867" data-track-index="0"><span>Soruda hangi sistem geçiyorsa,</span></div>
<div id="cap-093" class="cap clip" data-start="204.658" data-duration="2.052" data-track-index="0"><span>o sistemin <b>hane sayısını</b> sayın.</span></div>
<div id="cap-094" class="cap clip" data-start="207.46" data-duration="1.2" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-095" class="cap clip" data-start="208.66" data-duration="3.88" data-track-index="0"><span>Aşağıdakilerden hangisi tarife cetvelinin <b>8</b>. faslında</span></div>
<div id="cap-096" class="cap clip" data-start="212.54" data-duration="1.4" data-track-index="0"><span>sınıflandırılmaz?</span></div>
<div id="cap-097" class="cap clip" data-start="213.94" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-098" class="cap clip" data-start="214.9" data-duration="1.28" data-track-index="0"><span>Susam tohumu.</span></div>
<div id="cap-099" class="cap clip" data-start="216.18" data-duration="0.89" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-100" class="cap clip" data-start="217.14" data-duration="1.76" data-track-index="0"><span>Kabuğu soyulmuş badem.</span></div>
<div id="cap-101" class="cap clip" data-start="218.9" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-102" class="cap clip" data-start="219.86" data-duration="1.44" data-track-index="0"><span>Taze avokado.</span></div>
<div id="cap-103" class="cap clip" data-start="221.3" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-104" class="cap clip" data-start="222.26" data-duration="1.52" data-track-index="0"><span>Kurutulmuş kayısı.</span></div>
<div id="cap-105" class="cap clip" data-start="223.78" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-106" class="cap clip" data-start="224.66" data-duration="1.17" data-track-index="0"><span>Kaju cevizi.</span></div>
<div id="cap-107" class="cap clip" data-start="225.94" data-duration="1.806" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-108" class="cap clip" data-start="232.096" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-109" class="cap clip" data-start="232.896" data-duration="1.08" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-110" class="cap clip" data-start="233.976" data-duration="3.52" data-track-index="0"><span><b>8</b>. fasıl yenilen meyveleri ve yenilen sert kabuklu</span></div>
<div id="cap-111" class="cap clip" data-start="237.496" data-duration="1.17" data-track-index="0"><span>meyveleri kapsar.</span></div>
<div id="cap-112" class="cap clip" data-start="238.816" data-duration="1.88" data-track-index="0"><span>Susam ise bir yağlı tohumdur;</span></div>
<div id="cap-113" class="cap clip" data-start="240.696" data-duration="3.92" data-track-index="0"><span><b>12</b>. fasılda, <b>12.07</b> pozisyonunda sınıflandırılır.</span></div>
<div id="cap-114" class="cap clip" data-start="244.616" data-duration="2.04" data-track-index="0"><span>Diğerleri <b>8</b>. fasılda:</span></div>
<div id="cap-115" class="cap clip" data-start="246.656" data-duration="4.36" data-track-index="0"><span>Badem <b>08.02</b>, avokado <b>08.04</b>,</span></div>
<div id="cap-116" class="cap clip" data-start="251.016" data-duration="4.68" data-track-index="0"><span>kaju cevizi <b>08.01</b>, kurutulmuş kayısı ise <b>08.13</b></span></div>
<div id="cap-117" class="cap clip" data-start="255.696" data-duration="1.336" data-track-index="0"><span>pozisyonundadır.</span></div>
<div id="cap-118" class="cap clip" data-start="257.862" data-duration="1.36" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-119" class="cap clip" data-start="259.222" data-duration="2.8" data-track-index="0"><span>Yardımcımız, çerez gibi yeniyor diye susamı da</span></div>
<div id="cap-120" class="cap clip" data-start="262.022" data-duration="1.52" data-track-index="0"><span><b>8</b>. fasla koydu.</span></div>
<div id="cap-121" class="cap clip" data-start="263.542" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-122" class="cap clip" data-start="264.422" data-duration="3.2" data-track-index="0"><span><b>Yer fıstığı</b>, susam, ayçiçeği gibi yağlı tohumlar</span></div>
<div id="cap-123" class="cap clip" data-start="267.622" data-duration="1.36" data-track-index="0"><span><b>12</b>. fasıldadır.</span></div>
<div id="cap-124" class="cap clip" data-start="268.982" data-duration="1.12" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-125" class="cap clip" data-start="270.102" data-duration="2.64" data-track-index="0"><span><b>Yer fıstığı</b> sert kabuklu bir meyve gibi görünse</span></div>
<div id="cap-126" class="cap clip" data-start="272.742" data-duration="1.85" data-track-index="0"><span>de <b>12.02</b>&#x27;de yer alır.</span></div>
<div id="cap-127" class="cap clip" data-start="274.662" data-duration="2.48" data-track-index="0"><span><b>Kavrulmuş</b> ya da başka şekilde hazırlanmış olanlar</span></div>
<div id="cap-128" class="cap clip" data-start="277.142" data-duration="1.971" data-track-index="0"><span>ise <b>20</b>. fasla gider.</span></div>
<div id="cap-129" class="cap clip" data-start="279.943" data-duration="0.97" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-130" class="cap clip" data-start="281.063" data-duration="1.48" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-131" class="cap clip" data-start="282.543" data-duration="0.72" data-track-index="0"><span>Bir:</span></div>
<div id="cap-132" class="cap clip" data-start="283.263" data-duration="2.48" data-track-index="0"><span>Cetvelin dayanağı Armonize Sistemdir;</span></div>
<div id="cap-133" class="cap clip" data-start="285.743" data-duration="2.52" data-track-index="0"><span>değiştirme yetkisi Cumhurbaşkanındadır.</span></div>
