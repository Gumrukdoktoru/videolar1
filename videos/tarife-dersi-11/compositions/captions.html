<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.2" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.88" data-duration="2.0" data-track-index="0"><span><b>11</b>&#x27;incisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.88" data-duration="1.92" data-track-index="0"><span>Bugün bu kez <b>5</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.8" data-duration="2.8" data-track-index="0"><span>pozisyon sırası, <b>boru bağlantı parçaları</b>,</span></div>
<div id="cap-005" class="cap clip" data-start="11.6" data-duration="2.88" data-track-index="0"><span><b>diğer adi metaller</b>, teleferik ve füniküler,</span></div>
<div id="cap-006" class="cap clip" data-start="14.48" data-duration="2.04" data-track-index="0"><span>son olarak da manyetik aynalar.</span></div>
<div id="cap-007" class="cap clip" data-start="16.52" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-008" class="cap clip" data-start="17.52" data-duration="3.32" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-009" class="cap clip" data-start="20.84" data-duration="2.169" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-010" class="cap clip" data-start="23.759" data-duration="1.05" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-011" class="cap clip" data-start="24.959" data-duration="2.6" data-track-index="0"><span>Aşağıdakilerden hangisinde eşyalar,</span></div>
<div id="cap-012" class="cap clip" data-start="27.559" data-duration="2.68" data-track-index="0"><span>tarife cetvelindeki pozisyon numaralarına göre</span></div>
<div id="cap-013" class="cap clip" data-start="30.239" data-duration="2.61" data-track-index="0"><span>küçükten büyüğe doğru sıralanmıştır?</span></div>
<div id="cap-014" class="cap clip" data-start="32.879" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="33.839" data-duration="2.56" data-track-index="0"><span>Deri saplı kamçı, plastik baret,</span></div>
<div id="cap-016" class="cap clip" data-start="36.399" data-duration="2.64" data-track-index="0"><span>yağmur şemsiyesi, sentetik peruk.</span></div>
<div id="cap-017" class="cap clip" data-start="39.039" data-duration="0.89" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-018" class="cap clip" data-start="39.999" data-duration="2.4" data-track-index="0"><span>Plastik baret, deri saplı kamçı,</span></div>
<div id="cap-019" class="cap clip" data-start="42.399" data-duration="2.41" data-track-index="0"><span>yağmur şemsiyesi, sentetik peruk.</span></div>
<div id="cap-020" class="cap clip" data-start="44.959" data-duration="1.04" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="45.999" data-duration="2.16" data-track-index="0"><span>Sentetik peruk, plastik baret,</span></div>
<div id="cap-022" class="cap clip" data-start="48.159" data-duration="2.72" data-track-index="0"><span>yağmur şemsiyesi, deri saplı kamçı.</span></div>
<div id="cap-023" class="cap clip" data-start="50.879" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-024" class="cap clip" data-start="51.759" data-duration="2.4" data-track-index="0"><span>Plastik baret, yağmur şemsiyesi,</span></div>
<div id="cap-025" class="cap clip" data-start="54.159" data-duration="2.56" data-track-index="0"><span>deri saplı kamçı, sentetik peruk.</span></div>
<div id="cap-026" class="cap clip" data-start="56.719" data-duration="0.96" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-027" class="cap clip" data-start="57.679" data-duration="2.56" data-track-index="0"><span>Yağmur şemsiyesi, deri saplı kamçı,</span></div>
<div id="cap-028" class="cap clip" data-start="60.239" data-duration="2.223" data-track-index="0"><span>sentetik peruk, plastik baret.</span></div>
<div id="cap-029" class="cap clip" data-start="62.959" data-duration="1.723" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-030" class="cap clip" data-start="69.032" data-duration="0.81" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-031" class="cap clip" data-start="69.912" data-duration="0.89" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-032" class="cap clip" data-start="70.952" data-duration="2.4" data-track-index="0"><span>Plastik baret bir koruyucu başlıktır:</span></div>
<div id="cap-033" class="cap clip" data-start="73.352" data-duration="1.6" data-track-index="0"><span><b>65.06</b>.</span></div>
<div id="cap-034" class="cap clip" data-start="74.952" data-duration="2.84" data-track-index="0"><span>Yağmur şemsiyesi <b>66.01</b>.</span></div>
<div id="cap-035" class="cap clip" data-start="77.792" data-duration="3.24" data-track-index="0"><span>Kamçı, deri saplı olsa da <b>bastonlarla birlikte</b></span></div>
<div id="cap-036" class="cap clip" data-start="81.032" data-duration="1.72" data-track-index="0"><span><b>66.02</b>.</span></div>
<div id="cap-037" class="cap clip" data-start="82.752" data-duration="2.8" data-track-index="0"><span>Sentetik peruk ise <b>67.04</b>.</span></div>
<div id="cap-038" class="cap clip" data-start="85.552" data-duration="2.48" data-track-index="0"><span>Diğer şıklarda kamçı, şemsiye,</span></div>
<div id="cap-039" class="cap clip" data-start="88.032" data-duration="2.252" data-track-index="0"><span>peruk ya da baret yanlış yerde.</span></div>
<div id="cap-040" class="cap clip" data-start="91.114" data-duration="1.41" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-041" class="cap clip" data-start="92.554" data-duration="3.48" data-track-index="0"><span>Cano, kamçının sapı deri diye onu saraciye eşyası</span></div>
<div id="cap-042" class="cap clip" data-start="96.034" data-duration="2.0" data-track-index="0"><span>sandı ve A şıkkını seçti.</span></div>
<div id="cap-043" class="cap clip" data-start="98.034" data-duration="0.76" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-044" class="cap clip" data-start="98.794" data-duration="3.493" data-track-index="0"><span><b>42</b>. faslın notları kamçı ve kırbaçları fasıl dışında</span></div>
<div id="cap-045" class="cap clip" data-start="102.287" data-duration="0.707" data-track-index="0"><span>bırakır;</span></div>
<div id="cap-046" class="cap clip" data-start="102.994" data-duration="3.907" data-track-index="0"><span>kamçı, <b>malzemesi ne olursa olsun</b> <b>66.02</b>&#x27;dedir.</span></div>
<div id="cap-047" class="cap clip" data-start="106.901" data-duration="1.013" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-048" class="cap clip" data-start="107.914" data-duration="3.32" data-track-index="0"><span>Plastikten olsa da baret <b>39</b>. fasla girmez;</span></div>
<div id="cap-049" class="cap clip" data-start="111.234" data-duration="3.533" data-track-index="0"><span>Fasıl <b>39</b>&#x27;un <b>2</b>. notu, <b>12</b>. bölümün başlıklarını</span></div>
<div id="cap-050" class="cap clip" data-start="114.767" data-duration="1.187" data-track-index="0"><span>dışarıda bırakır.</span></div>
<div id="cap-051" class="cap clip" data-start="115.954" data-duration="0.88" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-052" class="cap clip" data-start="116.834" data-duration="2.088" data-track-index="0"><span><b>Malzemeye değil</b>, <b>eşyaya bakın</b>.</span></div>
<div id="cap-053" class="cap clip" data-start="119.672" data-duration="1.25" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-054" class="cap clip" data-start="120.952" data-duration="2.88" data-track-index="0"><span>Demir veya çelikten yapılmış aşağıdaki eşyadan</span></div>
<div id="cap-055" class="cap clip" data-start="123.832" data-duration="2.92" data-track-index="0"><span>hangisi <b>73.07</b> pozisyonunda,</span></div>
<div id="cap-056" class="cap clip" data-start="126.752" data-duration="3.77" data-track-index="0"><span>yani boru bağlantı parçaları arasında sınıflandırılmaz?</span></div>
<div id="cap-057" class="cap clip" data-start="130.552" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-058" class="cap clip" data-start="131.512" data-duration="2.48" data-track-index="0"><span>Uç uca kaynak yapılacak dirsek.</span></div>
<div id="cap-059" class="cap clip" data-start="133.992" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-060" class="cap clip" data-start="134.952" data-duration="3.44" data-track-index="0"><span>Esnek hortumu sıkarak sabitleyen hortum kelepçesi.</span></div>
<div id="cap-061" class="cap clip" data-start="138.392" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-062" class="cap clip" data-start="139.352" data-duration="2.61" data-track-index="0"><span>Boruyu bir cihaza bağlayan flanş.</span></div>
<div id="cap-063" class="cap clip" data-start="141.992" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-064" class="cap clip" data-start="142.952" data-duration="3.2" data-track-index="0"><span>İki farklı çaptaki boruyu birleştiren redüksiyon.</span></div>
<div id="cap-065" class="cap clip" data-start="146.152" data-duration="0.81" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-066" class="cap clip" data-start="147.032" data-duration="2.517" data-track-index="0"><span>Borunun açık ucunu kapatan kör tapa.</span></div>
<div id="cap-067" class="cap clip" data-start="150.352" data-duration="1.857" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-068" class="cap clip" data-start="156.559" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-069" class="cap clip" data-start="157.359" data-duration="1.12" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-070" class="cap clip" data-start="158.479" data-duration="2.32" data-track-index="0"><span><b>73.07</b>&#x27;nin <b>açıklama notu</b>,</span></div>
<div id="cap-071" class="cap clip" data-start="160.799" data-duration="2.4" data-track-index="0"><span>bu pozisyonu iki boruyu birleştiren,</span></div>
<div id="cap-072" class="cap clip" data-start="163.199" data-duration="2.72" data-track-index="0"><span>boruyu bir cihaza bağlayan ya da borunun ucunu</span></div>
<div id="cap-073" class="cap clip" data-start="165.919" data-duration="1.88" data-track-index="0"><span>kapatan parçalarla sınırlar.</span></div>
<div id="cap-074" class="cap clip" data-start="167.799" data-duration="2.72" data-track-index="0"><span>Hortum kelepçesi boru çapıyla <b>birleşmez</b>;</span></div>
<div id="cap-075" class="cap clip" data-start="170.519" data-duration="2.16" data-track-index="0"><span>esnek hortumu sıkıştırıp sabitler.</span></div>
<div id="cap-076" class="cap clip" data-start="172.679" data-duration="2.36" data-track-index="0"><span>Bu yüzden <b>73.26</b>&#x27;da yer alır.</span></div>
<div id="cap-077" class="cap clip" data-start="175.039" data-duration="4.836" data-track-index="0"><span>Dirsek, flanş, redüksiyon ve kör tapa ise <b>73.07</b>&#x27;dedir.</span></div>
<div id="cap-078" class="cap clip" data-start="180.705" data-duration="1.13" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-079" class="cap clip" data-start="182.065" data-duration="3.28" data-track-index="0"><span>Stajyerimiz, kör tapa iki boruyu birbirine bağlamıyor</span></div>
<div id="cap-080" class="cap clip" data-start="185.345" data-duration="1.68" data-track-index="0"><span>diye E şıkkını seçti.</span></div>
<div id="cap-081" class="cap clip" data-start="187.025" data-duration="0.73" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-082" class="cap clip" data-start="187.825" data-duration="3.28" data-track-index="0"><span><b>Açıklama notu</b>, borunun açık <b>ucunu kapatan</b> parçaları</span></div>
<div id="cap-083" class="cap clip" data-start="191.105" data-duration="2.2" data-track-index="0"><span>da <b>73.07</b>&#x27;ye dahil eder;</span></div>
<div id="cap-084" class="cap clip" data-start="193.305" data-duration="2.52" data-track-index="0"><span>kör tapa bir boru bağlantı parçasıdır.</span></div>
<div id="cap-085" class="cap clip" data-start="195.825" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-086" class="cap clip" data-start="196.865" data-duration="3.84" data-track-index="0"><span>Boruyu duvara tutturan kanca ve destekler de <b>73.07</b>&#x27;de</span></div>
<div id="cap-087" class="cap clip" data-start="200.705" data-duration="0.81" data-track-index="0"><span>değildir.</span></div>
<div id="cap-088" class="cap clip" data-start="201.745" data-duration="1.77" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-089" class="cap clip" data-start="203.585" data-duration="2.132" data-track-index="0"><span>Parça boruyla <b>bütünleşiyor</b> mu?</span></div>
<div id="cap-090" class="cap clip" data-start="206.467" data-duration="1.05" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-091" class="cap clip" data-start="207.747" data-duration="3.24" data-track-index="0"><span>Aşağıdaki adi metallerden hangisi için Armonize</span></div>
<div id="cap-092" class="cap clip" data-start="210.987" data-duration="2.6" data-track-index="0"><span>Sistemde ayrı bir fasıl açılmamıştır;</span></div>
<div id="cap-093" class="cap clip" data-start="213.587" data-duration="3.28" data-track-index="0"><span>bu metal ve ondan eşya <b>81</b>. fasılda,</span></div>
<div id="cap-094" class="cap clip" data-start="216.867" data-duration="2.25" data-track-index="0"><span>diğer adi metaller arasında yer alır?</span></div>
<div id="cap-095" class="cap clip" data-start="219.427" data-duration="0.92" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-096" class="cap clip" data-start="220.347" data-duration="0.92" data-track-index="0"><span>Nikel.</span></div>
<div id="cap-097" class="cap clip" data-start="221.267" data-duration="0.84" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-098" class="cap clip" data-start="222.107" data-duration="0.96" data-track-index="0"><span>Kurşun.</span></div>
<div id="cap-099" class="cap clip" data-start="223.067" data-duration="0.8" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-100" class="cap clip" data-start="223.867" data-duration="0.84" data-track-index="0"><span>Çinko.</span></div>
<div id="cap-101" class="cap clip" data-start="224.707" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-102" class="cap clip" data-start="225.587" data-duration="0.72" data-track-index="0"><span>Kalay.</span></div>
<div id="cap-103" class="cap clip" data-start="226.307" data-duration="0.76" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-104" class="cap clip" data-start="227.067" data-duration="0.797" data-track-index="0"><span>Kobalt.</span></div>
<div id="cap-105" class="cap clip" data-start="228.347" data-duration="1.932" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-106" class="cap clip" data-start="234.629" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-107" class="cap clip" data-start="235.429" data-duration="0.89" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-108" class="cap clip" data-start="236.469" data-duration="3.6" data-track-index="0"><span><b>15</b>. bölümde <b>kendi adını</b> taşıyan fasıllar bakır,</span></div>
<div id="cap-109" class="cap clip" data-start="240.069" data-duration="2.2" data-track-index="0"><span>nikel, alüminyum, kurşun,</span></div>
<div id="cap-110" class="cap clip" data-start="242.269" data-duration="1.56" data-track-index="0"><span>çinko ve kalaydır.</span></div>
<div id="cap-111" class="cap clip" data-start="243.829" data-duration="2.8" data-track-index="0"><span><b>Diğer adi metallerin</b> hepsi tek bir fasılda,</span></div>
<div id="cap-112" class="cap clip" data-start="246.629" data-duration="1.96" data-track-index="0"><span><b>81</b>. fasılda toplanır:</span></div>
<div id="cap-113" class="cap clip" data-start="248.589" data-duration="2.32" data-track-index="0"><span>tungsten, molibden, magnezyum,</span></div>
<div id="cap-114" class="cap clip" data-start="250.909" data-duration="1.68" data-track-index="0"><span>kobalt, titanyum gibi.</span></div>
<div id="cap-115" class="cap clip" data-start="252.589" data-duration="1.76" data-track-index="0"><span>Kobalt ve kobalttan eşya,</span></div>
<div id="cap-116" class="cap clip" data-start="254.349" data-duration="2.656" data-track-index="0"><span><b>81.05</b> pozisyonunda yer alır.</span></div>
<div id="cap-117" class="cap clip" data-start="257.835" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-118" class="cap clip" data-start="259.355" data-duration="3.44" data-track-index="0"><span>Yardımcımız, nikel ile kobalt cevherde ve matlarda</span></div>
<div id="cap-119" class="cap clip" data-start="262.795" data-duration="2.6" data-track-index="0"><span>hep birlikte anıldığı için kobaltın da ayrı bir</span></div>
<div id="cap-120" class="cap clip" data-start="265.395" data-duration="2.8" data-track-index="0"><span>faslı olduğunu düşündü ve A şıkkını seçti.</span></div>
<div id="cap-121" class="cap clip" data-start="268.195" data-duration="0.64" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-122" class="cap clip" data-start="268.835" data-duration="2.72" data-track-index="0"><span>Nikelin <b>75</b>. fasılda <b>kendi faslı</b> var;</span></div>
<div id="cap-123" class="cap clip" data-start="271.555" data-duration="3.187" data-track-index="0"><span>kobaltın yok, kobalt <b>81</b>. fasıldadır.</span></div>
<div id="cap-124" class="cap clip" data-start="274.742" data-duration="1.053" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-125" class="cap clip" data-start="275.795" data-duration="1.72" data-track-index="0"><span><b>77</b>. fasıl <b>boştur</b>;</span></div>
<div id="cap-126" class="cap clip" data-start="277.515" data-duration="3.333" data-track-index="0"><span>Armonize Sistemde ileride kullanılmak üzere ayrılmıştır.</span></div>
<div id="cap-127" class="cap clip" data-start="280.848" data-duration="0.827" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-128" class="cap clip" data-start="281.675" data-duration="1.76" data-track-index="0"><span><b>6</b> metalin <b>kendi faslı</b> var,</span></div>
<div id="cap-129" class="cap clip" data-start="283.435" data-duration="1.476" data-track-index="0"><span>gerisi <b>81</b>.</span></div>
<div id="cap-130" class="cap clip" data-start="285.661" data-duration="1.28" data-track-index="0"><span>Dördüncü soru.</span></div>
<div id="cap-131" class="cap clip" data-start="286.941" data-duration="4.89" data-track-index="0"><span>Aşağıdakilerden hangisi <b>84.28</b> pozisyonunda sınıflandırılmaz?</span></div>
<div id="cap-132" class="cap clip" data-start="292.061" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-133" class="cap clip" data-start="292.941" data-duration="1.72" data-track-index="0"><span>Füniküler hattında kullanılan,</span></div>
<div id="cap-134" class="cap clip" data-start="294.661" data-duration="2.69" data-track-index="0"><span>kendinden hareketli olmayan yolcu vagonu.</span></div>
<div id="cap-135" class="cap clip" data-start="297.501" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-136" class="cap clip" data-start="298.381" data-duration="2.64" data-track-index="0"><span>Kayak merkezinde kullanılan telesiyej.</span></div>
<div id="cap-137" class="cap clip" data-start="301.021" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-138" class="cap clip" data-start="301.901" data-duration="2.88" data-track-index="0"><span>Kayakçıları yamaç boyunca çeken teleski.</span></div>
<div id="cap-139" class="cap clip" data-start="304.781" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-140" class="cap clip" data-start="305.661" data-duration="3.36" data-track-index="0"><span>Füniküler hattının çekiş mekanizması ve bucurgatı.</span></div>
<div id="cap-141" class="cap clip" data-start="309.021" data-duration="0.8" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-142" class="cap clip" data-start="309.821" data-duration="2.917" data-track-index="0"><span>Alışveriş merkezinde kullanılan yürüyen merdiven.</span></div>
<div id="cap-143" class="cap clip" data-start="313.141" data-duration="1.844" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-144" class="cap clip" data-start="319.335" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-145" class="cap clip" data-start="320.215" data-duration="1.0" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-146" class="cap clip" data-start="321.215" data-duration="3.92" data-track-index="0"><span><b>84.28</b>, kaldırma ve taşıma makinelerini kapsar.</span></div>
<div id="cap-147" class="cap clip" data-start="325.135" data-duration="1.84" data-track-index="0"><span>Teleferikler, telesiyejler,</span></div>
<div id="cap-148" class="cap clip" data-start="326.975" data-duration="2.84" data-track-index="0"><span>teleskiler ve fünikülerlerin <b>çekiş mekanizmaları</b></span></div>
<div id="cap-149" class="cap clip" data-start="329.815" data-duration="2.16" data-track-index="0"><span><b>8428.60</b>&#x27;ta;</span></div>
<div id="cap-150" class="cap clip" data-start="331.975" data-duration="3.28" data-track-index="0"><span>yürüyen merdivenler <b>8428.40</b>&#x27;tadır.</span></div>
<div id="cap-151" class="cap clip" data-start="335.255" data-duration="3.04" data-track-index="0"><span>Ama açıklama notuna göre fünikülerde yalnız çekme</span></div>

<div id="cap-154" class="cap clip" data-start="344.944" data-duration="1.41" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-155" class="cap clip" data-start="346.384" data-duration="3.12" data-track-index="0"><span>Stajyerimiz, kayak merkezi deyince spor eşyası</span></div>

<div id="cap-157" class="cap clip" data-start="350.424" data-duration="3.48" data-track-index="0"><span>telesiyejin <b>84.28</b>&#x27;de olmadığını sanıp B şıkkını</span></div>

<div id="cap-159" class="cap clip" data-start="354.744" data-duration="0.6" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-160" class="cap clip" data-start="355.344" data-duration="3.44" data-track-index="0"><span>Telesiyej ve teleski insanları taşıyan <b>birer makinedir</b>;</span></div>

<div id="cap-163" class="cap clip" data-start="362.091" data-duration="1.066" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-164" class="cap clip" data-start="363.157" data-duration="3.627" data-track-index="0"><span>Füniküler hattının rayları ve teçhizatı <b>73.02</b></span></div>

<div id="cap-166" class="cap clip" data-start="369.224" data-duration="0.8" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-167" class="cap clip" data-start="370.024" data-duration="2.414" data-track-index="0"><span><b>Vagon taşıttır</b>, çekiş makinedir.</span></div>
<div id="cap-168" class="cap clip" data-start="373.188" data-duration="1.05" data-track-index="0"><span>Beşinci soru.</span></div>
<div id="cap-169" class="cap clip" data-start="374.468" data-duration="3.2" data-track-index="0"><span>Bir torna tezgâhında iş parçasını mıknatıs gücüyle</span></div>

<div id="cap-172" class="cap clip" data-start="382.948" data-duration="3.36" data-track-index="0"><span>Bu eşya hangi tarife pozisyonunda sınıflandırılır?</span></div>

<div id="cap-175" class="cap clip" data-start="388.948" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-176" class="cap clip" data-start="389.828" data-duration="1.76" data-track-index="0"><span><b>84.66</b>.</span></div>
<div id="cap-177" class="cap clip" data-start="391.588" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-178" class="cap clip" data-start="392.468" data-duration="1.68" data-track-index="0"><span><b>85.05</b>.</span></div>
<div id="cap-179" class="cap clip" data-start="394.148" data-duration="0.84" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-180" class="cap clip" data-start="394.988" data-duration="1.72" data-track-index="0"><span><b>85.36</b>.</span></div>
<div id="cap-181" class="cap clip" data-start="396.708" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-182" class="cap clip" data-start="397.588" data-duration="2.4" data-track-index="0"><span><b>85.43</b>.</span></div>
<div id="cap-183" class="cap clip" data-start="399.988" data-duration="1.77" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>

<div id="cap-185" class="cap clip" data-start="406.957" data-duration="1.0" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-186" class="cap clip" data-start="407.957" data-duration="2.44" data-track-index="0"><span><b>85.05</b>&#x27;in pozisyon metni,</span></div>

<div id="cap-194" class="cap clip" data-start="429.717" data-duration="1.04" data-track-index="0"><span>Doğru pozisyon:</span></div>

<div id="cap-196" class="cap clip" data-start="433.124" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-197" class="cap clip" data-start="434.644" data-duration="3.12" data-track-index="0"><span>Yardımcımız, torna aynası tezgâhın aksesuarıdır</span></div>

<div id="cap-199" class="cap clip" data-start="441.204" data-duration="0.56" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-200" class="cap clip" data-start="441.764" data-duration="2.56" data-track-index="0"><span><b>Mekanik aynalar</b> <b>84.66</b>&#x27;dadır;</span></div>
<div id="cap-201" class="cap clip" data-start="444.324" data-duration="3.04" data-track-index="0"><span>ama mıknatıs gücüyle çalışan <b>elektromanyetik aynalar</b></span></div>
<div id="cap-202" class="cap clip" data-start="447.364" data-duration="2.44" data-track-index="0"><span><b>adıyla</b> <b>85.05</b>&#x27;te sayılır.</span></div>
<div id="cap-203" class="cap clip" data-start="449.804" data-duration="1.04" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-204" class="cap clip" data-start="450.844" data-duration="1.6" data-track-index="0"><span>Elektromanyetik kavramalar,</span></div>
<div id="cap-205" class="cap clip" data-start="452.444" data-duration="3.2" data-track-index="0"><span>kaplinler ve frenler de <b>85.05</b>&#x27;tedir.</span></div>
<div id="cap-206" class="cap clip" data-start="455.644" data-duration="1.76" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-207" class="cap clip" data-start="457.404" data-duration="1.621" data-track-index="0"><span><b>Mıknatısla</b> mı tutuyor?</span></div>
<div id="cap-208" class="cap clip" data-start="459.855" data-duration="1.12" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-209" class="cap clip" data-start="460.975" data-duration="1.52" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-210" class="cap clip" data-start="462.495" data-duration="0.72" data-track-index="0"><span>Bir:</span></div>
<div id="cap-211" class="cap clip" data-start="463.215" data-duration="2.16" data-track-index="0"><span><b>Malzemeye değil</b>, <b>eşyaya bakın</b>;</span></div>
<div id="cap-212" class="cap clip" data-start="465.375" data-duration="4.01" data-track-index="0"><span>baret <b>65</b>, kamçı <b>66</b>, peruk <b>67</b>.</span></div>
<div id="cap-213" class="cap clip" data-start="469.455" data-duration="0.68" data-track-index="0"><span>İki:</span></div>
<div id="cap-214" class="cap clip" data-start="470.135" data-duration="2.4" data-track-index="0"><span>Fasıl notunu ve açıklama notunu okuyun;</span></div>
<div id="cap-215" class="cap clip" data-start="472.535" data-duration="4.6" data-track-index="0"><span>kobalt <b>81.05</b>, hortum kelepçesi <b>73.26</b>.</span></div>
<div id="cap-216" class="cap clip" data-start="477.135" data-duration="0.64" data-track-index="0"><span>Üç:</span></div>
<div id="cap-217" class="cap clip" data-start="477.775" data-duration="1.48" data-track-index="0"><span>Makinede işleve bakın;</span></div>
<div id="cap-218" class="cap clip" data-start="479.255" data-duration="1.76" data-track-index="0"><span>füniküler vagonu taşıttır,</span></div>
<div id="cap-219" class="cap clip" data-start="481.015" data-duration="2.651" data-track-index="0"><span>manyetik ayna <b>85.05</b>&#x27;tir.</span></div>
<div id="cap-220" class="cap clip" data-start="484.416" data-duration="1.813" data-track-index="0"><span>Bugünün cevap anahtarı:</span></div>
<div id="cap-221" class="cap clip" data-start="486.229" data-duration="2.827" data-track-index="0"><span>Birinci soru D, ikinci soru B,</span></div>
<div id="cap-222" class="cap clip" data-start="489.056" data-duration="2.92" data-track-index="0"><span>üçüncü soru E, dördüncü soru A,</span></div>
<div id="cap-223" class="cap clip" data-start="491.976" data-duration="1.33" data-track-index="0"><span>beşinci soru C.</span></div>
<div id="cap-224" class="cap clip" data-start="493.376" data-duration="1.44" data-track-index="0"><span>Kaç tanesini bildiniz?</span></div>
<div id="cap-225" class="cap clip" data-start="494.816" data-duration="1.12" data-track-index="0"><span>Yorumlara yazın.</span></div>
<div id="cap-226" class="cap clip" data-start="495.936" data-duration="3.36" data-track-index="0"><span>Böylece tarife derslerinin <b>11</b>&#x27;incisini de tamamladık.</span></div>
