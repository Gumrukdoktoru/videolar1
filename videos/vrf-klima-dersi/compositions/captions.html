<div id="cap-001" class="cap clip" data-start="1.68" data-duration="2.82" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla yeni bir derse</span></div>

<div id="cap-003" class="cap clip" data-start="5.5" data-duration="2.73" data-track-index="0"><span>Bugün sahada en çok tartışılan sorulardan birini</span></div>

<div id="cap-005" class="cap clip" data-start="9.14" data-duration="1.93" data-track-index="0"><span>Bu klima <b>multi split</b> mi,</span></div>
<div id="cap-006" class="cap clip" data-start="11.07" data-duration="1.5" data-track-index="0"><span>yoksa <b>VRF</b> mi?</span></div>
<div id="cap-007" class="cap clip" data-start="12.57" data-duration="1.62" data-track-index="0"><span>Gümrükler Genel Müdürlüğü,</span></div>

<div id="cap-009" class="cap clip" data-start="17.7" data-duration="2.34" data-track-index="0"><span><b>dört</b> net teknik kritere bağladı.</span></div>
<div id="cap-010" class="cap clip" data-start="20.04" data-duration="1.846" data-track-index="0"><span>Hadi, adım adım inceleyelim.</span></div>
<div id="cap-011" class="cap clip" data-start="22.686" data-duration="1.52" data-track-index="0"><span>Önce sorunu görelim.</span></div>
<div id="cap-012" class="cap clip" data-start="24.206" data-duration="2.6" data-track-index="0"><span>Bölge müdürlüklerinden gelen yazılarda şu tespit</span></div>

<div id="cap-016" class="cap clip" data-start="33.606" data-duration="0.83" data-track-index="0"><span>Sonuç:</span></div>
<div id="cap-017" class="cap clip" data-start="34.436" data-duration="2.58" data-track-index="0"><span>Hangi kriterin esas alınacağı konusunda uygulama</span></div>

<div id="cap-024" class="cap clip" data-start="52.257" data-duration="2.93" data-track-index="0"><span>Bu bilgiler ve mevcut teknik raporlar birlikte</span></div>
<div id="cap-025" class="cap clip" data-start="55.187" data-duration="0.856" data-track-index="0"><span>incelendi.</span></div>
<div id="cap-026" class="cap clip" data-start="56.843" data-duration="1.6" data-track-index="0"><span>İnceleme şunu gösterdi:</span></div>
<div id="cap-027" class="cap clip" data-start="58.443" data-duration="3.55" data-track-index="0"><span>Multi split ve <b>VRF</b> sistemlerin bazı ortak özellikleri</span></div>

<div id="cap-029" class="cap clip" data-start="62.443" data-duration="2.89" data-track-index="0"><span>ama teknik mimari ve çalışma prensibi bakımından</span></div>
<div id="cap-030" class="cap clip" data-start="65.333" data-duration="1.67" data-track-index="0"><span>birbirinden ayrılıyorlar.</span></div>
<div id="cap-031" class="cap clip" data-start="67.003" data-duration="2.0" data-track-index="0"><span>Ve işte ilk <b>tuzak</b>:</span></div>

<div id="cap-034" class="cap clip" data-start="73.403" data-duration="3.519" data-track-index="0"><span>Ama bu, tek başına bir sistemi <b>VRF</b> yapmaz!</span></div>
<div id="cap-035" class="cap clip" data-start="77.722" data-duration="2.64" data-track-index="0"><span>Multi split sistemde temel mantık basit:</span></div>
<div id="cap-036" class="cap clip" data-start="80.362" data-duration="3.44" data-track-index="0"><span>Bir dış ünite, birden fazla iç üniteyi çalıştırır.</span></div>

<div id="cap-041" class="cap clip" data-start="92.682" data-duration="3.16" data-track-index="0"><span>Akışkan, ortak ana hatlar ve branşmanlar üzerinden</span></div>
<div id="cap-042" class="cap clip" data-start="95.842" data-duration="2.12" data-track-index="0"><span>çok sayıda iç üniteye dağıtılır.</span></div>
<div id="cap-043" class="cap clip" data-start="97.962" data-duration="1.9" data-track-index="0"><span>Her iç ünitenin akışkan miktarı,</span></div>

<div id="cap-048" class="cap clip" data-start="110.712" data-duration="3.6" data-track-index="0"><span>bir mahal ısıtılırken diğeri eş zamanlı soğutulabilir.</span></div>
<div id="cap-049" class="cap clip" data-start="115.301" data-duration="2.03" data-track-index="0"><span>Buradan çıkan <b>önemli</b> sonuç şu:</span></div>
<div id="cap-050" class="cap clip" data-start="117.331" data-duration="3.08" data-track-index="0"><span>Eşyanın <b>multi split</b> ya da benzeri bir ticari adla</span></div>

<div id="cap-052" class="cap clip" data-start="123.521" data-duration="2.83" data-track-index="0"><span>bağlanabilmesi de, tarife sınıflandırmasında tek</span></div>

<div id="cap-078" class="cap clip" data-start="182.923" data-duration="3.504" data-track-index="0"><span>Yani, ortak bir haberleşme ve adresleme yapısı.</span></div>

<div id="cap-080" class="cap clip" data-start="189.627" data-duration="3.07" data-track-index="0"><span>Yazıya göre, geçmiş yıllarda düzenlenmiş Bağlayıcı</span></div>
