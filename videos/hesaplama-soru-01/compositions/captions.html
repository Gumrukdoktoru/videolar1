    <template>

      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="235.53">
<div id="cap-001" class="cap clip" data-start="1.63" data-duration="2.89" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla çıkmış sorular</span></div>
<div id="cap-002" class="cap clip" data-start="4.52" data-duration="1.47" data-track-index="0"><span>serisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="5.99" data-duration="2.97" data-track-index="0"><span>Bugün geçmiş yılların vergi hesaplama sorularından</span></div>
<div id="cap-004" class="cap clip" data-start="8.96" data-duration="1.27" data-track-index="0"><span>ilkini çözüyoruz.</span></div>
<div id="cap-005" class="cap clip" data-start="10.23" data-duration="0.76" data-track-index="0"><span>Konumuz:</span></div>
<div id="cap-006" class="cap clip" data-start="10.99" data-duration="2.24" data-track-index="0"><span>CD içinde gelen bir yazılım.</span></div>
<div id="cap-007" class="cap clip" data-start="13.23" data-duration="1.89" data-track-index="0"><span>Kâğıdınızı, kaleminizi hazırlayın;</span></div>
<div id="cap-008" class="cap clip" data-start="15.12" data-duration="1.489" data-track-index="0"><span>birlikte hesaplayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="17.409" data-duration="1.56" data-track-index="0"><span>Önce soruyu okuyalım.</span></div>
<div id="cap-010" class="cap clip" data-start="18.969" data-duration="2.55" data-track-index="0"><span>İthalatçı A firması, yurt dışından,</span></div>
<div id="cap-011" class="cap clip" data-start="21.519" data-duration="3.68" data-track-index="0"><span>CD üzerine kaydedilmiş ve bilgisayarlarda kullanılacak</span></div>
<div id="cap-012" class="cap clip" data-start="25.199" data-duration="1.63" data-track-index="0"><span>bir yazılım ithal ediyor.</span></div>
<div id="cap-013" class="cap clip" data-start="26.829" data-duration="1.56" data-track-index="0"><span>Faturada iki kalem var:</span></div>
<div id="cap-014" class="cap clip" data-start="28.389" data-duration="4.78" data-track-index="0"><span>Taşıyıcı ortamın, yani CD&#x27;nin kıymeti <b>10</b> ABD Doları;</span></div>
<div id="cap-015" class="cap clip" data-start="33.169" data-duration="2.9" data-track-index="0"><span>yazılımın kıymeti ise <b>1.000</b> ABD Doları.</span></div>
<div id="cap-016" class="cap clip" data-start="36.069" data-duration="2.29" data-track-index="0"><span><b>Gümrük vergisi</b> oranı <b>%10</b>,</span></div>
<div id="cap-017" class="cap clip" data-start="38.359" data-duration="2.21" data-track-index="0"><span><b>KDV</b> oranı <b>%18</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="40.569" data-duration="1.06" data-track-index="0"><span>Bizden istenen:</span></div>
<div id="cap-019" class="cap clip" data-start="41.629" data-duration="3.4" data-track-index="0"><span>Ödenmesi gereken <b>gümrük vergisi</b> ve <b>KDV</b> toplamı,</span></div>
<div id="cap-020" class="cap clip" data-start="45.029" data-duration="1.184" data-track-index="0"><span>dolar olarak.</span></div>
<div id="cap-021" class="cap clip" data-start="47.023" data-duration="1.18" data-track-index="0"><span>Şıklarımız şöyle.</span></div>
<div id="cap-022" class="cap clip" data-start="48.493" data-duration="3.11" data-track-index="0"><span><b>A şıkkı</b>, <b>182,98</b>.</span></div>
<div id="cap-023" class="cap clip" data-start="51.763" data-duration="3.16" data-track-index="0"><span>B şıkkı, <b>181,98</b>.</span></div>
<div id="cap-024" class="cap clip" data-start="55.133" data-duration="3.42" data-track-index="0"><span>C şıkkı, <b>198,98</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="58.763" data-duration="3.58" data-track-index="0"><span>D şıkkı, <b>299,98</b>.</span></div>
<div id="cap-026" class="cap clip" data-start="62.583" data-duration="2.93" data-track-index="0"><span>E şıkkı, <b>282,80</b>.</span></div>
<div id="cap-027" class="cap clip" data-start="66.473" data-duration="2.57" data-track-index="0"><span>Videoyu durdurun ve önce kendiniz çözün.</span></div>
<div id="cap-028" class="cap clip" data-start="75.409" data-duration="1.82" data-track-index="0"><span>Hazırsanız başlayalım.</span></div>
<div id="cap-029" class="cap clip" data-start="77.309" data-duration="3.33" data-track-index="0"><span>Bu sorunun anahtarı, Gümrük Yönetmeliğinin <b>54</b>&#x27;üncü</span></div>
<div id="cap-030" class="cap clip" data-start="80.639" data-duration="0.79" data-track-index="0"><span>maddesi.</span></div>
<div id="cap-031" class="cap clip" data-start="81.429" data-duration="1.53" data-track-index="0"><span>Bilgisayarda kullanılacak,</span></div>
<div id="cap-032" class="cap clip" data-start="82.959" data-duration="2.41" data-track-index="0"><span>veri ya da komut yüklü taşıyıcılarda,</span></div>
<div id="cap-033" class="cap clip" data-start="85.369" data-duration="2.76" data-track-index="0"><span>gümrük kıymeti olarak sadece <b>taşıyıcı ortamın</b>,</span></div>
<div id="cap-034" class="cap clip" data-start="88.129" data-duration="2.42" data-track-index="0"><span>yani CD&#x27;nin kıymeti esas alınır.</span></div>
<div id="cap-035" class="cap clip" data-start="90.549" data-duration="3.48" data-track-index="0"><span>Yazılımın bedeli, CD&#x27;nin bedelinden ayrı gösterilmişse</span></div>
<div id="cap-036" class="cap clip" data-start="94.029" data-duration="1.7" data-track-index="0"><span><b>gümrük kıymetine</b> girmez.</span></div>
<div id="cap-037" class="cap clip" data-start="95.729" data-duration="2.87" data-track-index="0"><span>Soruda faturanın iki ayrı kalem olarak verilmesinin</span></div>
<div id="cap-038" class="cap clip" data-start="98.599" data-duration="1.626" data-track-index="0"><span>sebebi tam olarak bu.</span></div>
<div id="cap-039" class="cap clip" data-start="101.085" data-duration="1.07" data-track-index="0"><span>Birinci adım:</span></div>
<div id="cap-040" class="cap clip" data-start="102.155" data-duration="1.25" data-track-index="0"><span><b>gümrük vergisi</b>.</span></div>
<div id="cap-041" class="cap clip" data-start="103.405" data-duration="2.8" data-track-index="0"><span><b>Gümrük vergisi</b> matrahı sadece <b>10</b> dolar.</span></div>
<div id="cap-042" class="cap clip" data-start="106.205" data-duration="2.42" data-track-index="0"><span><b>10</b> doların <b>%10</b>&#x27;u, <b>1</b> dolar.</span></div>
<div id="cap-043" class="cap clip" data-start="108.625" data-duration="1.23" data-track-index="0"><span>Gümrük vergimiz:</span></div>
<div id="cap-044" class="cap clip" data-start="109.855" data-duration="1.009" data-track-index="0"><span><b>1</b> dolar.</span></div>
<div id="cap-045" class="cap clip" data-start="111.714" data-duration="0.78" data-track-index="0"><span>İkinci adım:</span></div>
<div id="cap-046" class="cap clip" data-start="112.494" data-duration="2.03" data-track-index="0"><span><b>KDV matrahı</b>.</span></div>
<div id="cap-047" class="cap clip" data-start="114.524" data-duration="0.76" data-track-index="0"><span>Burada <b>dikkat!</b></span></div>
<div id="cap-048" class="cap clip" data-start="115.284" data-duration="2.25" data-track-index="0"><span>Yazılım <b>gümrük kıymetine</b> girmedi;</span></div>
<div id="cap-049" class="cap clip" data-start="117.534" data-duration="2.87" data-track-index="0"><span>ama <b>KDV</b> matrahında hesaba katılıyor.</span></div>
<div id="cap-050" class="cap clip" data-start="120.494" data-duration="1.28" data-track-index="0"><span><b>KDV matrahı</b>:</span></div>
<div id="cap-051" class="cap clip" data-start="121.774" data-duration="3.46" data-track-index="0"><span><b>10</b> dolar CD, artı <b>1</b> dolar <b>gümrük vergisi</b>,</span></div>
<div id="cap-052" class="cap clip" data-start="125.234" data-duration="1.89" data-track-index="0"><span>artı <b>1.000</b> dolar yazılım.</span></div>
<div id="cap-053" class="cap clip" data-start="127.124" data-duration="0.51" data-track-index="0"><span>Toplam:</span></div>
<div id="cap-054" class="cap clip" data-start="127.634" data-duration="1.392" data-track-index="0"><span><b>1.011</b> dolar.</span></div>
<div id="cap-055" class="cap clip" data-start="129.836" data-duration="1.31" data-track-index="0"><span>Üçüncü adım:</span></div>
<div id="cap-056" class="cap clip" data-start="131.146" data-duration="0.96" data-track-index="0"><span><b>KDV</b>.</span></div>
<div id="cap-057" class="cap clip" data-start="132.356" data-duration="5.03" data-track-index="0"><span><b>1.011</b> doların <b>%18</b>&#x27;i, <b>181,98</b> dolar.</span></div>
<div id="cap-058" class="cap clip" data-start="138.259" data-duration="0.97" data-track-index="0"><span>Ve sonuç:</span></div>
<div id="cap-059" class="cap clip" data-start="139.229" data-duration="1.7" data-track-index="0"><span><b>1</b> dolar <b>gümrük vergisi</b>,</span></div>
<div id="cap-060" class="cap clip" data-start="140.929" data-duration="3.92" data-track-index="0"><span>artı <b>181,98</b> dolar <b>KDV</b>.</span></div>
<div id="cap-061" class="cap clip" data-start="144.849" data-duration="2.17" data-track-index="0"><span>Ödenmesi gereken toplam vergi,</span></div>
<div id="cap-062" class="cap clip" data-start="147.019" data-duration="2.34" data-track-index="0"><span><b>182,98</b> dolar.</span></div>
<div id="cap-063" class="cap clip" data-start="149.359" data-duration="0.88" data-track-index="0"><span>Doğru cevap:</span></div>
<div id="cap-064" class="cap clip" data-start="150.329" data-duration="1.099" data-track-index="0"><span><b>A şıkkı</b>!</span></div>
<div id="cap-065" class="cap clip" data-start="152.358" data-duration="2.25" data-track-index="0"><span>Şimdi <b>tuzaklara</b> bakalım.</span></div>
<div id="cap-066" class="cap clip" data-start="154.628" data-duration="3.39" data-track-index="0"><span>Gümrük vergisini unutup sadece <b>KDV</b>&#x27;yi yazan,</span></div>
<div id="cap-067" class="cap clip" data-start="158.018" data-duration="3.58" data-track-index="0"><span><b>B şıkkına</b>, <b>181,98</b>&#x27;e düşer.</span></div>
<div id="cap-068" class="cap clip" data-start="161.598" data-duration="2.93" data-track-index="0"><span>Yazılımı <b>gümrük kıymetine</b> katan ise gümrük vergisini</span></div>
<div id="cap-069" class="cap clip" data-start="164.528" data-duration="2.79" data-track-index="0"><span><b>1.010</b> dolar üzerinden, <b>101</b> dolar bulur.</span></div>
<div id="cap-070" class="cap clip" data-start="167.318" data-duration="3.32" data-track-index="0"><span>Bir de bu vergiyi <b>KDV</b> matrahına eklemeyi unutursa,</span></div>
<div id="cap-071" class="cap clip" data-start="170.638" data-duration="3.681" data-track-index="0"><span><b>E şıkkına</b>, <b>282,80</b>&#x27;e gider.</span></div>
<div id="cap-072" class="cap clip" data-start="175.149" data-duration="1.31" data-track-index="0"><span>Bir uyarı daha:</span></div>
<div id="cap-073" class="cap clip" data-start="176.459" data-duration="2.5" data-track-index="0"><span>Bu kural her taşıyıcı için geçerli değil.</span></div>
<div id="cap-074" class="cap clip" data-start="179.029" data-duration="2.63" data-track-index="0"><span>Yönetmeliğe göre <b>taşıyıcı ortam</b> deyimi;</span></div>
<div id="cap-075" class="cap clip" data-start="181.659" data-duration="2.86" data-track-index="0"><span>entegre devreleri, yarı iletkenleri ve bunlarla</span></div>
<div id="cap-076" class="cap clip" data-start="184.519" data-duration="3.42" data-track-index="0"><span>bütünlük oluşturan benzeri araç ve aletleri kapsamaz.</span></div>
<div id="cap-077" class="cap clip" data-start="187.939" data-duration="2.37" data-track-index="0"><span>Veri veya komutlar deyimi de ses,</span></div>
<div id="cap-078" class="cap clip" data-start="190.309" data-duration="2.85" data-track-index="0"><span>sinematografik ya da video kayıtlarını kapsamaz.</span></div>
<div id="cap-079" class="cap clip" data-start="193.159" data-duration="2.47" data-track-index="0"><span>Yani CD içinde bir <b>film</b> geliyorsa,</span></div>
<div id="cap-080" class="cap clip" data-start="195.629" data-duration="2.756" data-track-index="0"><span>filmin bedeli de <b>gümrük kıymetine</b> dahil edilir.</span></div>
<div id="cap-081" class="cap clip" data-start="199.265" data-duration="1.07" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-082" class="cap clip" data-start="200.335" data-duration="2.5" data-track-index="0"><span>Aynı kurgu ihracat yönüyle de sorulmuş.</span></div>
<div id="cap-083" class="cap clip" data-start="202.925" data-duration="3.02" data-track-index="0"><span>Yazılım ihracatında da beyannamede sadece taşıyıcı</span></div>
<div id="cap-084" class="cap clip" data-start="205.945" data-duration="2.76" data-track-index="0"><span>ortamın kıymeti, yani <b>10</b> dolar yer alır.</span></div>
<div id="cap-085" class="cap clip" data-start="208.705" data-duration="1.49" data-track-index="0"><span>Formülü aklınızda tutun:</span></div>
<div id="cap-086" class="cap clip" data-start="210.195" data-duration="2.34" data-track-index="0"><span><b>Gümrük vergisi</b> CD&#x27;den;</span></div>
<div id="cap-087" class="cap clip" data-start="212.535" data-duration="2.73" data-track-index="0"><span><b>KDV</b>, yazılım dahil hepsinden.</span></div>
<div id="cap-088" class="cap clip" data-start="216.067" data-duration="1.08" data-track-index="0"><span>Özetle:</span></div>
<div id="cap-089" class="cap clip" data-start="217.147" data-duration="1.96" data-track-index="0"><span>Taşıyıcı ortam gümrük vergisine,</span></div>
<div id="cap-090" class="cap clip" data-start="219.107" data-duration="2.51" data-track-index="0"><span>yazılım dahil toplam <b>KDV</b>&#x27;ye.</span></div>
<div id="cap-091" class="cap clip" data-start="221.857" data-duration="1.47" data-track-index="0"><span>Cevap A:</span></div>
<div id="cap-092" class="cap clip" data-start="223.327" data-duration="2.22" data-track-index="0"><span><b>182,98</b> dolar.</span></div>
<div id="cap-093" class="cap clip" data-start="225.547" data-duration="3.18" data-track-index="0"><span>Bu çözüm işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-094" class="cap clip" data-start="228.727" data-duration="0.8" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-095" class="cap clip" data-start="229.527" data-duration="2.4" data-track-index="0"><span>Bir sonraki çıkmış soruda görüşmek üzere,</span></div>
<div id="cap-096" class="cap clip" data-start="231.927" data-duration="0.849" data-track-index="0"><span>hoşça kalın!</span></div>

      <script>
