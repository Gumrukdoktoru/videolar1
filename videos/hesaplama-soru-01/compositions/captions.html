<div id="cap-001" class="cap clip" data-start="1.66" data-duration="2.92" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla vergi hesaplama</span></div>
<div id="cap-002" class="cap clip" data-start="4.58" data-duration="1.48" data-track-index="0"><span>derslerine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.06" data-duration="2.66" data-track-index="0"><span>Bugün sınava hazırlananların en çok karıştırdığı</span></div>
<div id="cap-004" class="cap clip" data-start="8.72" data-duration="2.88" data-track-index="0"><span>konulardan birini, örnek bir soruyla çözüyoruz:</span></div>
<div id="cap-005" class="cap clip" data-start="11.6" data-duration="2.28" data-track-index="0"><span>DVD içinde gelen bir yazılım.</span></div>
<div id="cap-006" class="cap clip" data-start="13.88" data-duration="1.96" data-track-index="0"><span>Kâğıdınızı, kaleminizi hazırlayın;</span></div>
<div id="cap-007" class="cap clip" data-start="15.84" data-duration="1.501" data-track-index="0"><span>birlikte hesaplayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.141" data-duration="1.61" data-track-index="0"><span>Önce soruyu okuyalım.</span></div>
<div id="cap-009" class="cap clip" data-start="19.751" data-duration="2.14" data-track-index="0"><span>Türkiye&#x27;de yerleşik B şirketi,</span></div>
<div id="cap-010" class="cap clip" data-start="21.891" data-duration="3.82" data-track-index="0"><span>yurt dışından, DVD üzerine kaydedilmiş ve bilgisayarlarda</span></div>
<div id="cap-011" class="cap clip" data-start="25.711" data-duration="2.79" data-track-index="0"><span>kullanılacak bir muhasebe yazılımı ithal ediyor.</span></div>
<div id="cap-012" class="cap clip" data-start="28.501" data-duration="1.83" data-track-index="0"><span>Faturada iki ayrı kalem var:</span></div>
<div id="cap-013" class="cap clip" data-start="30.331" data-duration="4.01" data-track-index="0"><span>Taşıyıcı ortamın, yani DVD&#x27;nin kıymeti <b>50</b> ABD</span></div>
<div id="cap-014" class="cap clip" data-start="34.341" data-duration="0.74" data-track-index="0"><span>Doları;</span></div>
<div id="cap-015" class="cap clip" data-start="35.081" data-duration="3.3" data-track-index="0"><span>yazılımın kıymeti ise <b>2.500</b> ABD Doları.</span></div>
<div id="cap-016" class="cap clip" data-start="38.381" data-duration="2.22" data-track-index="0"><span><b>Gümrük vergisi</b> oranı <b>%10</b>,</span></div>
<div id="cap-017" class="cap clip" data-start="40.601" data-duration="1.5" data-track-index="0"><span><b>KDV</b> oranı <b>%20</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="42.101" data-duration="1.26" data-track-index="0"><span>Bizden istenen:</span></div>
<div id="cap-019" class="cap clip" data-start="43.361" data-duration="3.35" data-track-index="0"><span>Ödenmesi gereken <b>gümrük vergisi</b> ve <b>KDV</b> toplamı,</span></div>
<div id="cap-020" class="cap clip" data-start="46.711" data-duration="1.514" data-track-index="0"><span>dolar olarak.</span></div>
<div id="cap-021" class="cap clip" data-start="49.045" data-duration="1.93" data-track-index="0"><span>Şıklarımız şöyle.</span></div>
<div id="cap-022" class="cap clip" data-start="50.975" data-duration="1.06" data-track-index="0"><span>A şıkkı, <b>16</b>.</span></div>
<div id="cap-023" class="cap clip" data-start="52.035" data-duration="2.32" data-track-index="0"><span>B şıkkı, <b>511</b>.</span></div>
<div id="cap-024" class="cap clip" data-start="54.355" data-duration="2.29" data-track-index="0"><span><b>C şıkkı</b>, <b>516</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="56.645" data-duration="1.96" data-track-index="0"><span>D şıkkı, <b>765</b>.</span></div>
<div id="cap-026" class="cap clip" data-start="58.605" data-duration="2.27" data-track-index="0"><span>E şıkkı, <b>816</b>.</span></div>
<div id="cap-027" class="cap clip" data-start="60.875" data-duration="4.13" data-track-index="0"><span>Videoyu durdurun ve önce kendiniz çözün.</span></div>
<div id="cap-028" class="cap clip" data-start="71.246" data-duration="1.86" data-track-index="0"><span>Hazırsanız başlayalım.</span></div>
<div id="cap-029" class="cap clip" data-start="73.146" data-duration="3.53" data-track-index="0"><span>Bu sorunun anahtarı, Gümrük Yönetmeliğinin <b>54</b>&#x27;üncü</span></div>
<div id="cap-030" class="cap clip" data-start="76.676" data-duration="0.71" data-track-index="0"><span>maddesi.</span></div>
<div id="cap-031" class="cap clip" data-start="77.386" data-duration="1.48" data-track-index="0"><span>Bilgisayarda kullanılacak,</span></div>
<div id="cap-032" class="cap clip" data-start="78.866" data-duration="2.46" data-track-index="0"><span>veri ya da komut yüklü taşıyıcılarda,</span></div>
<div id="cap-033" class="cap clip" data-start="81.326" data-duration="2.67" data-track-index="0"><span>gümrük kıymeti olarak sadece <b>taşıyıcı ortamın</b>,</span></div>
<div id="cap-034" class="cap clip" data-start="83.996" data-duration="2.71" data-track-index="0"><span>yani DVD&#x27;nin kıymeti esas alınır.</span></div>
<div id="cap-035" class="cap clip" data-start="86.706" data-duration="2.54" data-track-index="0"><span>Yazılımın bedeli, taşıyıcının bedelinden ayrı</span></div>
<div id="cap-036" class="cap clip" data-start="89.246" data-duration="2.74" data-track-index="0"><span>gösterilmişse <b>gümrük kıymetine</b> girmez.</span></div>
<div id="cap-037" class="cap clip" data-start="91.986" data-duration="3.07" data-track-index="0"><span>Soruda faturanın iki ayrı kalem olarak verilmesinin</span></div>
<div id="cap-038" class="cap clip" data-start="95.056" data-duration="1.564" data-track-index="0"><span>sebebi tam olarak bu.</span></div>
<div id="cap-039" class="cap clip" data-start="97.47" data-duration="1.08" data-track-index="0"><span>Birinci adım:</span></div>
<div id="cap-040" class="cap clip" data-start="98.55" data-duration="1.1" data-track-index="0"><span><b>gümrük vergisi</b>.</span></div>
<div id="cap-041" class="cap clip" data-start="99.78" data-duration="2.91" data-track-index="0"><span><b>Gümrük vergisi</b> matrahı sadece <b>50</b> dolar.</span></div>
<div id="cap-042" class="cap clip" data-start="102.69" data-duration="2.41" data-track-index="0"><span><b>50</b> doların <b>%10</b>&#x27;u, <b>5</b> dolar.</span></div>
<div id="cap-043" class="cap clip" data-start="105.1" data-duration="1.13" data-track-index="0"><span>Gümrük vergimiz:</span></div>
<div id="cap-044" class="cap clip" data-start="106.23" data-duration="1.08" data-track-index="0"><span><b>5</b> dolar.</span></div>
<div id="cap-045" class="cap clip" data-start="108.344" data-duration="1.16" data-track-index="0"><span>İkinci adım:</span></div>
<div id="cap-046" class="cap clip" data-start="109.504" data-duration="1.67" data-track-index="0"><span><b>KDV matrahı</b>.</span></div>
<div id="cap-047" class="cap clip" data-start="111.174" data-duration="1.16" data-track-index="0"><span>Burada <b>dikkat!</b></span></div>
<div id="cap-048" class="cap clip" data-start="112.334" data-duration="1.75" data-track-index="0"><span>Yazılım <b>gümrük kıymetine</b> girmedi;</span></div>
<div id="cap-049" class="cap clip" data-start="114.084" data-duration="2.88" data-track-index="0"><span>ama <b>KDV</b> matrahında hesaba katılıyor.</span></div>
<div id="cap-050" class="cap clip" data-start="117.004" data-duration="1.055" data-track-index="0"><span><b>KDV matrahı</b>:</span></div>
<div id="cap-051" class="cap clip" data-start="118.059" data-duration="3.985" data-track-index="0"><span><b>50</b> dolar DVD, artı <b>5</b> dolar <b>gümrük vergisi</b>,</span></div>
<div id="cap-052" class="cap clip" data-start="122.044" data-duration="2.29" data-track-index="0"><span>artı <b>2.500</b> dolar yazılım.</span></div>
<div id="cap-053" class="cap clip" data-start="124.334" data-duration="0.43" data-track-index="0"><span>Toplam:</span></div>
<div id="cap-054" class="cap clip" data-start="124.764" data-duration="2.12" data-track-index="0"><span><b>2.555</b> dolar.</span></div>
<div id="cap-055" class="cap clip" data-start="127.756" data-duration="1.13" data-track-index="0"><span>Üçüncü adım:</span></div>
<div id="cap-056" class="cap clip" data-start="128.886" data-duration="1.12" data-track-index="0"><span><b>KDV</b>.</span></div>
<div id="cap-057" class="cap clip" data-start="130.266" data-duration="4.15" data-track-index="0"><span><b>2.555</b> doların <b>%20</b>&#x27;si, <b>511</b> dolar.</span></div>
<div id="cap-058" class="cap clip" data-start="135.463" data-duration="0.86" data-track-index="0"><span>Ve sonuç:</span></div>
<div id="cap-059" class="cap clip" data-start="136.463" data-duration="1.7" data-track-index="0"><span><b>5</b> dolar <b>gümrük vergisi</b>,</span></div>
<div id="cap-060" class="cap clip" data-start="138.163" data-duration="2.55" data-track-index="0"><span>artı <b>511</b> dolar <b>KDV</b>.</span></div>
<div id="cap-061" class="cap clip" data-start="140.713" data-duration="2.0" data-track-index="0"><span>Ödenmesi gereken toplam vergi,</span></div>
<div id="cap-062" class="cap clip" data-start="142.713" data-duration="1.46" data-track-index="0"><span><b>516</b> dolar.</span></div>
<div id="cap-063" class="cap clip" data-start="144.173" data-duration="0.96" data-track-index="0"><span>Doğru cevap:</span></div>
<div id="cap-064" class="cap clip" data-start="145.133" data-duration="1.096" data-track-index="0"><span><b>C şıkkı</b>!</span></div>
<div id="cap-065" class="cap clip" data-start="147.179" data-duration="2.04" data-track-index="0"><span>Şimdi <b>tuzaklara</b> bakalım;</span></div>
<div id="cap-066" class="cap clip" data-start="149.219" data-duration="2.9" data-track-index="0"><span>çünkü her yanlış şık, bir hatanın sonucu.</span></div>
<div id="cap-067" class="cap clip" data-start="152.149" data-duration="2.83" data-track-index="0"><span>Yazılımı <b>KDV</b> matrahından da çıkaran,</span></div>
<div id="cap-068" class="cap clip" data-start="154.979" data-duration="2.08" data-track-index="0"><span><b>A şıkkına</b>, <b>16</b>&#x27;ya düşer.</span></div>
<div id="cap-069" class="cap clip" data-start="157.059" data-duration="3.14" data-track-index="0"><span>Gümrük vergisini unutup sadece <b>KDV</b>&#x27;yi yazan,</span></div>
<div id="cap-070" class="cap clip" data-start="160.199" data-duration="2.35" data-track-index="0"><span><b>B şıkkına</b>, <b>511</b>&#x27;e gider.</span></div>
<div id="cap-071" class="cap clip" data-start="162.549" data-duration="3.1" data-track-index="0"><span>Yazılımı <b>gümrük kıymetine</b> katan ise gümrük vergisini</span></div>
<div id="cap-072" class="cap clip" data-start="165.649" data-duration="1.67" data-track-index="0"><span><b>255</b> dolar bulur.</span></div>
<div id="cap-073" class="cap clip" data-start="167.319" data-duration="3.49" data-track-index="0"><span>Bu vergiyi <b>KDV</b> matrahına eklemezse <b>D şıkkına</b>,</span></div>
<div id="cap-074" class="cap clip" data-start="170.809" data-duration="1.16" data-track-index="0"><span><b>765</b>&#x27;e;</span></div>
<div id="cap-075" class="cap clip" data-start="171.969" data-duration="3.629" data-track-index="0"><span>eklerse <b>E şıkkına</b>, <b>816</b>&#x27;ya ulaşır.</span></div>
<div id="cap-076" class="cap clip" data-start="176.428" data-duration="1.27" data-track-index="0"><span>Bir uyarı daha:</span></div>
<div id="cap-077" class="cap clip" data-start="177.698" data-duration="2.6" data-track-index="0"><span>Bu kural her taşıyıcı için geçerli değil.</span></div>
<div id="cap-078" class="cap clip" data-start="180.298" data-duration="2.65" data-track-index="0"><span>Yönetmeliğe göre <b>taşıyıcı ortam</b> deyimi;</span></div>
<div id="cap-079" class="cap clip" data-start="182.948" data-duration="3.01" data-track-index="0"><span>entegre devreleri, yarı iletkenleri ve bunlarla</span></div>
<div id="cap-080" class="cap clip" data-start="185.958" data-duration="3.51" data-track-index="0"><span>bütünlük oluşturan benzeri araç ve aletleri kapsamaz.</span></div>
<div id="cap-081" class="cap clip" data-start="189.468" data-duration="2.38" data-track-index="0"><span>Veri veya komutlar deyimi de ses,</span></div>
<div id="cap-082" class="cap clip" data-start="191.848" data-duration="2.95" data-track-index="0"><span>sinematografik ya da video kayıtlarını kapsamaz.</span></div>
<div id="cap-083" class="cap clip" data-start="194.798" data-duration="2.57" data-track-index="0"><span>Yani DVD içinde bir <b>film</b> geliyorsa,</span></div>
<div id="cap-084" class="cap clip" data-start="197.368" data-duration="3.028" data-track-index="0"><span>filmin bedeli de <b>gümrük kıymetine</b> dahil edilir.</span></div>
<div id="cap-085" class="cap clip" data-start="201.276" data-duration="0.94" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-086" class="cap clip" data-start="202.216" data-duration="2.44" data-track-index="0"><span>Aynı mantık ihracatta da geçerli.</span></div>
<div id="cap-087" class="cap clip" data-start="204.656" data-duration="2.95" data-track-index="0"><span>Yazılım ihracatında da beyannamede gümrük kıymeti</span></div>
<div id="cap-088" class="cap clip" data-start="207.606" data-duration="3.19" data-track-index="0"><span>olarak yalnızca <b>taşıyıcı ortamın</b> kıymeti yer alır.</span></div>
<div id="cap-089" class="cap clip" data-start="210.796" data-duration="1.51" data-track-index="0"><span>Formülü aklınızda tutun:</span></div>
<div id="cap-090" class="cap clip" data-start="212.306" data-duration="1.97" data-track-index="0"><span><b>Gümrük vergisi</b> taşıyıcıdan;</span></div>
<div id="cap-091" class="cap clip" data-start="214.276" data-duration="3.081" data-track-index="0"><span><b>KDV</b>, yazılım dahil hepsinden.</span></div>
<div id="cap-092" class="cap clip" data-start="218.157" data-duration="0.96" data-track-index="0"><span>Özetle:</span></div>
<div id="cap-093" class="cap clip" data-start="219.117" data-duration="2.08" data-track-index="0"><span>Taşıyıcı ortam gümrük vergisine,</span></div>
<div id="cap-094" class="cap clip" data-start="221.197" data-duration="2.51" data-track-index="0"><span>yazılım dahil toplam <b>KDV</b>&#x27;ye.</span></div>
<div id="cap-095" class="cap clip" data-start="223.947" data-duration="1.03" data-track-index="0"><span>Cevap C:</span></div>
<div id="cap-096" class="cap clip" data-start="225.087" data-duration="1.62" data-track-index="0"><span><b>516</b> dolar.</span></div>
<div id="cap-097" class="cap clip" data-start="226.707" data-duration="3.09" data-track-index="0"><span>Bu ders işinize yaradıysa abone olmayı ve paylaşmayı</span></div>
<div id="cap-098" class="cap clip" data-start="229.797" data-duration="0.71" data-track-index="0"><span>unutmayın.</span></div>
<div id="cap-099" class="cap clip" data-start="230.507" data-duration="2.32" data-track-index="0"><span>Bir sonraki hesaplama dersinde görüşmek üzere,</span></div>
<div id="cap-100" class="cap clip" data-start="232.827" data-duration="1.05" data-track-index="0"><span>hoşça kalın!</span></div>
