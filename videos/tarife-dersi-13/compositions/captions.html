<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.16" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.84" data-duration="1.88" data-track-index="0"><span><b>13</b>&#x27;üncüsüne hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.72" data-duration="1.36" data-track-index="0"><span>Bugün <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.08" data-duration="3.4" data-track-index="0"><span>periskop, tansiyon aleti ve Türk müziği çalgıları.</span></div>
<div id="cap-005" class="cap clip" data-start="11.48" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-006" class="cap clip" data-start="12.48" data-duration="3.32" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-007" class="cap clip" data-start="15.8" data-duration="2.168" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.718" data-duration="0.97" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-009" class="cap clip" data-start="19.998" data-duration="2.24" data-track-index="0"><span>Bir denizaltında kullanılmak üzere,</span></div>
<div id="cap-010" class="cap clip" data-start="22.238" data-duration="2.8" data-track-index="0"><span>denizaltıdan ayrı olarak ithal edilen periskop</span></div>
<div id="cap-011" class="cap clip" data-start="25.038" data-duration="2.77" data-track-index="0"><span>hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-012" class="cap clip" data-start="27.838" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="28.718" data-duration="1.76" data-track-index="0"><span><b>89.06</b>.</span></div>
<div id="cap-014" class="cap clip" data-start="30.478" data-duration="0.89" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="31.438" data-duration="1.52" data-track-index="0"><span><b>90.05</b>.</span></div>
<div id="cap-016" class="cap clip" data-start="32.958" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="33.918" data-duration="1.44" data-track-index="0"><span><b>90.13</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="35.358" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-019" class="cap clip" data-start="36.238" data-duration="1.52" data-track-index="0"><span><b>90.15</b>.</span></div>
<div id="cap-020" class="cap clip" data-start="37.758" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="38.638" data-duration="1.76" data-track-index="0"><span><b>93.05</b>.</span></div>
<div id="cap-022" class="cap clip" data-start="40.398" data-duration="1.897" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-023" class="cap clip" data-start="46.645" data-duration="0.73" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-024" class="cap clip" data-start="47.525" data-duration="0.96" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="48.485" data-duration="2.04" data-track-index="0"><span>Periskop bir <b>optik alettir</b>;</span></div>
<div id="cap-026" class="cap clip" data-start="50.525" data-duration="2.92" data-track-index="0"><span>ilk akla gelen yer, dürbün ve teleskopların bulunduğu</span></div>
<div id="cap-027" class="cap clip" data-start="53.445" data-duration="1.4" data-track-index="0"><span><b>90.05</b>&#x27;tir.</span></div>
<div id="cap-028" class="cap clip" data-start="54.845" data-duration="2.52" data-track-index="0"><span>Ama <b>90</b>. faslın <b>4</b>. notu,</span></div>
<div id="cap-029" class="cap clip" data-start="57.365" data-duration="2.72" data-track-index="0"><span>denizaltı ve tanklar için periskopik teleskopları</span></div>
<div id="cap-030" class="cap clip" data-start="60.085" data-duration="2.12" data-track-index="0"><span><b>90.05</b>&#x27;in dışında bırakır.</span></div>
<div id="cap-031" class="cap clip" data-start="62.205" data-duration="3.16" data-track-index="0"><span><b>90.13</b> de silahlar için teleskopik dürbünleri ve</span></div>
<div id="cap-032" class="cap clip" data-start="65.365" data-duration="1.76" data-track-index="0"><span>periskopları <b>adıyla</b> sayar.</span></div>
<div id="cap-033" class="cap clip" data-start="67.125" data-duration="1.093" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-034" class="cap clip" data-start="68.218" data-duration="1.147" data-track-index="0"><span><b>90.13</b>.</span></div>
<div id="cap-035" class="cap clip" data-start="69.365" data-duration="3.417" data-track-index="0"><span>Denizaltının kendisi ise <b>89.06</b>&#x27;dadır.</span></div>
<div id="cap-036" class="cap clip" data-start="73.612" data-duration="1.36" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-037" class="cap clip" data-start="74.972" data-duration="2.96" data-track-index="0"><span>Yardımcımız, periskop da bir teleskoptur diye</span></div>
<div id="cap-038" class="cap clip" data-start="77.932" data-duration="2.64" data-track-index="0"><span>B şıkkını, <b>90.05</b>&#x27;i seçti.</span></div>
<div id="cap-039" class="cap clip" data-start="80.572" data-duration="0.96" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-040" class="cap clip" data-start="81.532" data-duration="1.28" data-track-index="0"><span><b>Fasıl notu açık</b>:</span></div>
<div id="cap-041" class="cap clip" data-start="82.812" data-duration="2.72" data-track-index="0"><span>Denizaltı ve tanklar için periskopik teleskoplar</span></div>
<div id="cap-042" class="cap clip" data-start="85.532" data-duration="2.907" data-track-index="0"><span><b>90.05</b>&#x27;e girmez, <b>90.13</b>&#x27;tedir.</span></div>
<div id="cap-043" class="cap clip" data-start="88.439" data-duration="1.066" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-044" class="cap clip" data-start="89.505" data-duration="3.507" data-track-index="0"><span><b>90</b>. fasıldaki ya da <b>16</b>. bölümdeki makinelere ait</span></div>
<div id="cap-045" class="cap clip" data-start="93.012" data-duration="2.16" data-track-index="0"><span>teleskoplar da <b>90.13</b>&#x27;e gider.</span></div>
<div id="cap-046" class="cap clip" data-start="95.172" data-duration="0.84" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-047" class="cap clip" data-start="96.012" data-duration="1.724" data-track-index="0"><span>Önce <b>fasıl notunu</b> okuyun.</span></div>
<div id="cap-048" class="cap clip" data-start="98.486" data-duration="1.33" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-049" class="cap clip" data-start="99.846" data-duration="2.8" data-track-index="0"><span>Kola sarılan bir manşonla kan basıncını ölçen</span></div>
<div id="cap-050" class="cap clip" data-start="102.646" data-duration="2.96" data-track-index="0"><span>dijital tansiyon aleti hangi tarife pozisyonunda</span></div>
<div id="cap-051" class="cap clip" data-start="105.606" data-duration="1.33" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-052" class="cap clip" data-start="106.966" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-053" class="cap clip" data-start="107.846" data-duration="1.6" data-track-index="0"><span><b>85.43</b>.</span></div>
<div id="cap-054" class="cap clip" data-start="109.446" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-055" class="cap clip" data-start="110.326" data-duration="1.68" data-track-index="0"><span><b>90.18</b>.</span></div>
<div id="cap-056" class="cap clip" data-start="112.006" data-duration="0.8" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-057" class="cap clip" data-start="112.806" data-duration="1.52" data-track-index="0"><span><b>90.25</b>.</span></div>
<div id="cap-058" class="cap clip" data-start="114.326" data-duration="0.8" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-059" class="cap clip" data-start="115.126" data-duration="1.52" data-track-index="0"><span><b>90.26</b>.</span></div>
<div id="cap-060" class="cap clip" data-start="116.646" data-duration="0.8" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-061" class="cap clip" data-start="117.446" data-duration="1.37" data-track-index="0"><span><b>90.31</b>.</span></div>
<div id="cap-062" class="cap clip" data-start="119.566" data-duration="1.923" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-063" class="cap clip" data-start="125.839" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-064" class="cap clip" data-start="126.639" data-duration="1.04" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="127.679" data-duration="2.96" data-track-index="0"><span>Tansiyon aleti bir basınç ölçer gibi görünse de</span></div>
<div id="cap-066" class="cap clip" data-start="130.639" data-duration="1.85" data-track-index="0"><span>tıpta <b>teşhis için</b> kullanılır.</span></div>
<div id="cap-067" class="cap clip" data-start="132.719" data-duration="1.93" data-track-index="0"><span><b>90.18</b>&#x27;in açıklama notu,</span></div>
<div id="cap-068" class="cap clip" data-start="134.799" data-duration="2.96" data-track-index="0"><span>kan basıncını ölçmeye mahsus <b>sfigmomanometreleri</b></span></div>
<div id="cap-069" class="cap clip" data-start="137.759" data-duration="3.28" data-track-index="0"><span>ve <b>tansiyometreleri</b>, stetoskoplarla birlikte <b>adıyla</b></span></div>
<div id="cap-070" class="cap clip" data-start="141.039" data-duration="0.68" data-track-index="0"><span>sayar.</span></div>
<div id="cap-071" class="cap clip" data-start="141.719" data-duration="3.92" data-track-index="0"><span><b>90.26</b> ise sıvı ve gazların basıncını ölçen <b>manometreler</b></span></div>
<div id="cap-072" class="cap clip" data-start="145.639" data-duration="0.8" data-track-index="0"><span>içindir;</span></div>
<div id="cap-073" class="cap clip" data-start="146.439" data-duration="2.92" data-track-index="0"><span><b>90.25</b> termometrelerin yeridir.</span></div>
<div id="cap-074" class="cap clip" data-start="149.359" data-duration="1.08" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-075" class="cap clip" data-start="150.439" data-duration="1.32" data-track-index="0"><span><b>90.18</b>.</span></div>
<div id="cap-076" class="cap clip" data-start="151.759" data-duration="3.561" data-track-index="0"><span>Elektronik olması da onu <b>85.43</b>&#x27;e götürmez.</span></div>
<div id="cap-077" class="cap clip" data-start="156.15" data-duration="1.36" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-078" class="cap clip" data-start="157.51" data-duration="3.28" data-track-index="0"><span>Stajyerimiz, basınç ölçüyor diye D şıkkını,</span></div>
<div id="cap-079" class="cap clip" data-start="160.79" data-duration="1.68" data-track-index="0"><span><b>90.26</b>&#x27;yı seçti.</span></div>
<div id="cap-080" class="cap clip" data-start="162.47" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-081" class="cap clip" data-start="163.35" data-duration="2.8" data-track-index="0"><span><b>90.26</b>, sıvı ve gazların akışını,</span></div>
<div id="cap-082" class="cap clip" data-start="166.15" data-duration="2.84" data-track-index="0"><span>seviyesini ve basıncını ölçen cihazlar içindir.</span></div>
<div id="cap-083" class="cap clip" data-start="168.99" data-duration="3.2" data-track-index="0"><span>Kan basıncını ölçen tansiyon aleti <b>tıbbi bir alettir</b>;</span></div>
<div id="cap-084" class="cap clip" data-start="172.19" data-duration="3.68" data-track-index="0"><span>açıklama notunda <b>adıyla</b> sayıldığı için <b>90.18</b>&#x27;dedir.</span></div>
<div id="cap-085" class="cap clip" data-start="175.87" data-duration="1.08" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-086" class="cap clip" data-start="176.95" data-duration="3.97" data-track-index="0"><span>Ateş ölçen klinik termometreler ise <b>90.25</b>&#x27;tedir.</span></div>
<div id="cap-087" class="cap clip" data-start="180.95" data-duration="1.84" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-088" class="cap clip" data-start="182.79" data-duration="1.716" data-track-index="0"><span><b>Kimin basıncını</b> ölçüyor?</span></div>
<div id="cap-089" class="cap clip" data-start="185.256" data-duration="1.05" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-090" class="cap clip" data-start="186.536" data-duration="3.12" data-track-index="0"><span>Aşağıdaki çalgılardan hangisi tarife cetvelinde</span></div>
<div id="cap-091" class="cap clip" data-start="189.656" data-duration="3.28" data-track-index="0"><span>diğerlerinden farklı bir pozisyonda sınıflandırılır?</span></div>
<div id="cap-092" class="cap clip" data-start="192.936" data-duration="0.89" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-093" class="cap clip" data-start="193.896" data-duration="0.81" data-track-index="0"><span>Bağlama.</span></div>
<div id="cap-094" class="cap clip" data-start="194.856" data-duration="1.04" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-095" class="cap clip" data-start="195.896" data-duration="0.57" data-track-index="0"><span>Ud.</span></div>
<div id="cap-096" class="cap clip" data-start="196.696" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-097" class="cap clip" data-start="197.656" data-duration="0.88" data-track-index="0"><span>Kanun.</span></div>
<div id="cap-098" class="cap clip" data-start="198.536" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-099" class="cap clip" data-start="199.496" data-duration="0.89" data-track-index="0"><span>Kemençe.</span></div>
<div id="cap-100" class="cap clip" data-start="200.536" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-101" class="cap clip" data-start="201.416" data-duration="0.81" data-track-index="0"><span>Darbuka.</span></div>
<div id="cap-102" class="cap clip" data-start="202.536" data-duration="1.804" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-103" class="cap clip" data-start="208.69" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-104" class="cap clip" data-start="209.49" data-duration="0.89" data-track-index="0"><span><b>E şıkkı</b>.</span></div>
<div id="cap-105" class="cap clip" data-start="210.53" data-duration="4.04" data-track-index="0"><span>Bağlama, ud, kanun ve kemençe <b>telli çalgılardır</b>;</span></div>
<div id="cap-106" class="cap clip" data-start="214.57" data-duration="3.08" data-track-index="0"><span>telleri mızrapla, parmakla ya da yayla çalınsa</span></div>
<div id="cap-107" class="cap clip" data-start="217.65" data-duration="4.16" data-track-index="0"><span>da <b>92.02</b>&#x27;de, gitar, keman ve arp gibi telli diğer</span></div>
<div id="cap-108" class="cap clip" data-start="221.81" data-duration="2.12" data-track-index="0"><span>müzik aletleri arasında yer alırlar.</span></div>
<div id="cap-109" class="cap clip" data-start="223.93" data-duration="2.68" data-track-index="0"><span>Darbuka ise gerdirilmiş deriye elle vurularak</span></div>
<div id="cap-110" class="cap clip" data-start="226.61" data-duration="0.93" data-track-index="0"><span>çalınır.</span></div>
<div id="cap-111" class="cap clip" data-start="227.57" data-duration="2.33" data-track-index="0"><span><b>92.06</b>&#x27;nın açıklama notu,</span></div>
<div id="cap-112" class="cap clip" data-start="229.97" data-duration="2.48" data-track-index="0"><span>darbukaları ve tefleri <b>adıyla</b> sayar;</span></div>
<div id="cap-113" class="cap clip" data-start="232.45" data-duration="2.25" data-track-index="0"><span>darbuka <b>vurmalı bir çalgıdır</b>.</span></div>
<div id="cap-114" class="cap clip" data-start="235.579" data-duration="1.41" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-115" class="cap clip" data-start="237.019" data-duration="2.24" data-track-index="0"><span>Cano, kemençe yayla çalınıyor,</span></div>
<div id="cap-116" class="cap clip" data-start="239.259" data-duration="2.48" data-track-index="0"><span>telli sayılmaz diye D şıkkını seçti.</span></div>
<div id="cap-117" class="cap clip" data-start="241.739" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-118" class="cap clip" data-start="242.539" data-duration="3.52" data-track-index="0"><span><b>92.02</b>, keman gibi <b>yaylı çalgıları</b> da kapsar;</span></div>
<div id="cap-119" class="cap clip" data-start="246.059" data-duration="1.76" data-track-index="0"><span>kemençe de bir telli çalgıdır.</span></div>
<div id="cap-120" class="cap clip" data-start="247.819" data-duration="0.96" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-121" class="cap clip" data-start="248.779" data-duration="3.04" data-track-index="0"><span>Ses kutusu olmayan, sesi elektrikle yükseltilen</span></div>
<div id="cap-122" class="cap clip" data-start="251.819" data-duration="3.6" data-track-index="0"><span>elektro gitar gibi çalgılar ise <b>92.07</b>&#x27;dedir.</span></div>
<div id="cap-123" class="cap clip" data-start="255.419" data-duration="0.8" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-124" class="cap clip" data-start="256.219" data-duration="1.969" data-track-index="0"><span><b>Tel mi titriyor</b>, deri mi?</span></div>
<div id="cap-125" class="cap clip" data-start="259.018" data-duration="1.16" data-track-index="0"><span>Koçun notu:</span></div>
<div id="cap-126" class="cap clip" data-start="260.178" data-duration="1.48" data-track-index="0"><span>Bugünün <b>3</b> kuralı.</span></div>
<div id="cap-127" class="cap clip" data-start="261.658" data-duration="0.76" data-track-index="0"><span>Bir:</span></div>
<div id="cap-128" class="cap clip" data-start="262.418" data-duration="2.04" data-track-index="0"><span>Optik alette <b>fasıl notunu</b> okuyun;</span></div>
<div id="cap-129" class="cap clip" data-start="264.458" data-duration="2.0" data-track-index="0"><span>periskop <b>90.13</b>&#x27;tedir.</span></div>
<div id="cap-130" class="cap clip" data-start="266.458" data-duration="0.68" data-track-index="0"><span>İki:</span></div>
<div id="cap-131" class="cap clip" data-start="267.138" data-duration="2.28" data-track-index="0"><span>Ölçme aletinde neyi ölçtüğüne bakın;</span></div>
<div id="cap-132" class="cap clip" data-start="269.418" data-duration="2.04" data-track-index="0"><span>kan basıncını ölçen alet tıbbidir,</span></div>
