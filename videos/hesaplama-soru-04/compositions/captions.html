<div id="cap-002" class="cap clip" data-start="4.68" data-duration="2.36" data-track-index="0"><span>derslerinin dördüncüsüne hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="7.04" data-duration="2.56" data-track-index="0"><span>Bugünün konusu <b>ilave gümrük vergisi</b>.</span></div>
<div id="cap-004" class="cap clip" data-start="9.6" data-duration="1.72" data-track-index="0"><span>Oran yüzde olarak verilmiş;</span></div>
<div id="cap-005" class="cap clip" data-start="11.32" data-duration="3.04" data-track-index="0"><span>ama bir de kilogram başına <b>en az</b> ve <b>en çok tutar</b></span></div>

<div id="cap-007" class="cap clip" data-start="14.8" data-duration="1.44" data-track-index="0"><span>Hangisini uygulayacağız?</span></div>
<div id="cap-008" class="cap clip" data-start="16.24" data-duration="2.276" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>

<div id="cap-010" class="cap clip" data-start="20.866" data-duration="3.28" data-track-index="0"><span>K firması, Çin menşeli <b>4.000</b> kilogram plastik</span></div>
