      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="348.51">
<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.12" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.8" data-duration="1.68" data-track-index="0"><span>onuncusuna hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.48" data-duration="1.493" data-track-index="0"><span>Bugün yine <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="7.973" data-duration="1.387" data-track-index="0"><span>hava yastıklı taşıtlar,</span></div>
<div id="cap-005" class="cap clip" data-start="9.36" data-duration="3.24" data-track-index="0"><span>kıymetli metalden eşya ve yolcu biniş köprüleri.</span></div>
<div id="cap-006" class="cap clip" data-start="12.6" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-007" class="cap clip" data-start="13.6" data-duration="3.253" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-008" class="cap clip" data-start="16.853" data-duration="2.159" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-009" class="cap clip" data-start="19.762" data-duration="1.2" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-010" class="cap clip" data-start="20.962" data-duration="2.48" data-track-index="0"><span>Hava yastığı üzerinde hareket eden taşıtların</span></div>
<div id="cap-011" class="cap clip" data-start="23.442" data-duration="3.04" data-track-index="0"><span>sınıflandırılmasıyla ilgili aşağıdaki ifadelerden</span></div>
<div id="cap-012" class="cap clip" data-start="26.482" data-duration="1.21" data-track-index="0"><span>hangisi doğrudur?</span></div>
<div id="cap-013" class="cap clip" data-start="27.922" data-duration="0.96" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-014" class="cap clip" data-start="28.882" data-duration="2.08" data-track-index="0"><span>Hava yastıklı taşıtların tamamı,</span></div>
<div id="cap-015" class="cap clip" data-start="30.962" data-duration="4.25" data-track-index="0"><span>hava taşıtlarıyla birlikte <b>88</b>. fasılda sınıflandırılır.</span></div>
<div id="cap-016" class="cap clip" data-start="35.282" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="36.242" data-duration="2.773" data-track-index="0"><span>Kılavuz bir hat üzerinde gitmek üzere tasarlanmış</span></div>
<div id="cap-018" class="cap clip" data-start="39.015" data-duration="3.437" data-track-index="0"><span>hava trenleri <b>86</b>. fasılda sınıflandırılır.</span></div>
<div id="cap-019" class="cap clip" data-start="42.482" data-duration="1.04" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-020" class="cap clip" data-start="43.522" data-duration="3.28" data-track-index="0"><span>Hem karada hem suda gidebilen hava yastıklı taşıtlar</span></div>
<div id="cap-021" class="cap clip" data-start="46.802" data-duration="2.61" data-track-index="0"><span><b>89</b>. fasılda sınıflandırılır.</span></div>
<div id="cap-022" class="cap clip" data-start="49.442" data-duration="1.04" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-023" class="cap clip" data-start="50.482" data-duration="1.68" data-track-index="0"><span>Yalnız su üzerinde giden,</span></div>
<div id="cap-024" class="cap clip" data-start="52.162" data-duration="3.52" data-track-index="0"><span>kıyıya çıkabilen hava yastıklı taşıtlar <b>87</b>. fasılda</span></div>
<div id="cap-025" class="cap clip" data-start="55.682" data-duration="1.33" data-track-index="0"><span>sınıflandırılır.</span></div>
<div id="cap-026" class="cap clip" data-start="57.042" data-duration="0.96" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-027" class="cap clip" data-start="58.002" data-duration="1.44" data-track-index="0"><span>Hava yastıklı taşıtlar,</span></div>
<div id="cap-028" class="cap clip" data-start="59.442" data-duration="3.52" data-track-index="0"><span>benzedikleri taşıta bakılmaksızın <b>84</b>. fasılda</span></div>
<div id="cap-029" class="cap clip" data-start="62.962" data-duration="2.33" data-track-index="0"><span>makine olarak sınıflandırılır.</span></div>
<div id="cap-030" class="cap clip" data-start="65.602" data-duration="1.901" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-031" class="cap clip" data-start="71.853" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-032" class="cap clip" data-start="72.653" data-duration="0.89" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-033" class="cap clip" data-start="73.693" data-duration="3.04" data-track-index="0"><span>On yedinci bölümün beşinci notuna göre hava yastıklı</span></div>
<div id="cap-034" class="cap clip" data-start="76.733" data-duration="2.8" data-track-index="0"><span>taşıtlar, <b>en çok benzedikleri</b> taşıtlarla birlikte</span></div>
<div id="cap-035" class="cap clip" data-start="79.533" data-duration="1.12" data-track-index="0"><span>sınıflandırılır.</span></div>
<div id="cap-036" class="cap clip" data-start="80.653" data-duration="1.8" data-track-index="0"><span>Kılavuz hat üzerinde gidenler,</span></div>
<div id="cap-037" class="cap clip" data-start="82.453" data-duration="4.36" data-track-index="0"><span>yani hava trenleri, demiryolu taşıtları gibi <b>86</b>. fasıldadır.</span></div>
<div id="cap-038" class="cap clip" data-start="86.813" data-duration="4.33" data-track-index="0"><span>Karada ya da hem karada hem suda gidenler <b>87</b>. fasılda,</span></div>
<div id="cap-039" class="cap clip" data-start="91.213" data-duration="2.8" data-track-index="0"><span>su üzerinde gidenler ise kıyıya çıkabilseler de</span></div>
<div id="cap-040" class="cap clip" data-start="94.013" data-duration="1.8" data-track-index="0"><span><b>89</b>. fasıldadır.</span></div>
<div id="cap-041" class="cap clip" data-start="95.813" data-duration="3.301" data-track-index="0"><span>Hiçbiri <b>84</b>. fasılda <b>makine sayılmaz</b>.</span></div>
<div id="cap-042" class="cap clip" data-start="99.944" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-043" class="cap clip" data-start="101.464" data-duration="3.28" data-track-index="0"><span>Cano, kıyıya da çıkabiliyor diye su üstünde giden</span></div>
<div id="cap-044" class="cap clip" data-start="104.744" data-duration="3.2" data-track-index="0"><span>hava yastıklı tekneyi kara taşıtı saydı ve D şıkkını</span></div>
<div id="cap-045" class="cap clip" data-start="107.944" data-duration="0.88" data-track-index="0"><span>seçti.</span></div>
<div id="cap-046" class="cap clip" data-start="108.824" data-duration="0.693" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-047" class="cap clip" data-start="109.517" data-duration="2.747" data-track-index="0"><span>Yalnız su üzerinde gitmek üzere tasarlanan taşıt,</span></div>
<div id="cap-048" class="cap clip" data-start="112.264" data-duration="2.933" data-track-index="0"><span>kıyıya çıkabilse de <b>89</b>. fasıldadır.</span></div>
<div id="cap-049" class="cap clip" data-start="115.197" data-duration="2.947" data-track-index="0"><span>Seksen yedinci fasıl, karada ya da hem karada</span></div>
<div id="cap-050" class="cap clip" data-start="118.144" data-duration="1.44" data-track-index="0"><span>hem suda gidenler içindir.</span></div>
<div id="cap-051" class="cap clip" data-start="119.584" data-duration="1.0" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-052" class="cap clip" data-start="120.584" data-duration="2.56" data-track-index="0"><span>Hava treni hatlarının sabit malzemesi ve sinyal</span></div>
<div id="cap-053" class="cap clip" data-start="123.144" data-duration="3.6" data-track-index="0"><span>cihazları, <b>demiryolundaki</b> karşılıkları gibi sınıflandırılır.</span></div>
<div id="cap-054" class="cap clip" data-start="126.744" data-duration="0.88" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-055" class="cap clip" data-start="127.624" data-duration="2.217" data-track-index="0"><span>Taşıt en çok neye benziyor?</span></div>
<div id="cap-056" class="cap clip" data-start="130.591" data-duration="1.2" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-057" class="cap clip" data-start="131.791" data-duration="2.96" data-track-index="0"><span>Gümüşten yapılmış, cepte taşınan türden sigara</span></div>
<div id="cap-058" class="cap clip" data-start="134.751" data-duration="3.36" data-track-index="0"><span>tabakası hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-059" class="cap clip" data-start="138.111" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-060" class="cap clip" data-start="138.991" data-duration="1.6" data-track-index="0"><span><b>71.13</b>.</span></div>
<div id="cap-061" class="cap clip" data-start="140.591" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-062" class="cap clip" data-start="141.471" data-duration="1.68" data-track-index="0"><span><b>71.14</b>.</span></div>
<div id="cap-063" class="cap clip" data-start="143.151" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-064" class="cap clip" data-start="144.031" data-duration="1.68" data-track-index="0"><span><b>71.17</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="145.711" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-066" class="cap clip" data-start="146.591" data-duration="1.6" data-track-index="0"><span><b>42.02</b>.</span></div>
<div id="cap-067" class="cap clip" data-start="148.191" data-duration="0.8" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-068" class="cap clip" data-start="148.991" data-duration="1.53" data-track-index="0"><span><b>96.14</b>.</span></div>
<div id="cap-069" class="cap clip" data-start="151.351" data-duration="1.851" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-070" class="cap clip" data-start="157.552" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-071" class="cap clip" data-start="158.432" data-duration="0.89" data-track-index="0"><span><b>A şıkkı</b>.</span></div>
<div id="cap-072" class="cap clip" data-start="159.472" data-duration="2.24" data-track-index="0"><span>Yetmiş birinci faslın dokuzuncu notu,</span></div>
<div id="cap-073" class="cap clip" data-start="161.712" data-duration="2.16" data-track-index="0"><span>mücevherci eşyasını tanımlar:</span></div>
<div id="cap-074" class="cap clip" data-start="163.872" data-duration="3.52" data-track-index="0"><span>Yüzük, kolye gibi küçük süs eşyası ile <b>cepte</b>,</span></div>
<div id="cap-075" class="cap clip" data-start="167.392" data-duration="3.28" data-track-index="0"><span>el çantasında veya üstte taşınan kişisel eşya.</span></div>
<div id="cap-076" class="cap clip" data-start="170.672" data-duration="3.04" data-track-index="0"><span>Sigara tabakası, pudralık ve tespih bu ikinci</span></div>
<div id="cap-077" class="cap clip" data-start="173.712" data-duration="0.84" data-track-index="0"><span>gruptadır.</span></div>
<div id="cap-078" class="cap clip" data-start="174.552" data-duration="3.32" data-track-index="0"><span>Gümüşten yapıldığı için de <b>71.13</b> pozisyonunda,</span></div>
<div id="cap-079" class="cap clip" data-start="177.872" data-duration="2.56" data-track-index="0"><span>mücevherci eşyası olarak sınıflandırılır.</span></div>
<div id="cap-080" class="cap clip" data-start="180.432" data-duration="3.16" data-track-index="0"><span>Masada duran gümüş sigara kutusu ise kuyumcu eşyası</span></div>
<div id="cap-081" class="cap clip" data-start="183.592" data-duration="2.239" data-track-index="0"><span>olarak <b>71.14</b>&#x27;e gider.</span></div>
<div id="cap-082" class="cap clip" data-start="186.661" data-duration="1.41" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-083" class="cap clip" data-start="188.101" data-duration="3.2" data-track-index="0"><span>Stajyerimiz, sigara içenlere ait gereçler kuyumcu</span></div>
<div id="cap-084" class="cap clip" data-start="191.301" data-duration="2.4" data-track-index="0"><span>eşyasıdır diye B şıkkını seçti.</span></div>
<div id="cap-085" class="cap clip" data-start="193.701" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-086" class="cap clip" data-start="194.501" data-duration="1.6" data-track-index="0"><span>Fasıl notlarındaki ayrım,</span></div>
<div id="cap-087" class="cap clip" data-start="196.101" data-duration="2.0" data-track-index="0"><span>eşyanın nerede kullanıldığıdır:</span></div>
<div id="cap-088" class="cap clip" data-start="198.101" data-duration="3.28" data-track-index="0"><span>Cepte taşınan sigara tabakası mücevherci eşyası,</span></div>
<div id="cap-089" class="cap clip" data-start="201.381" data-duration="2.72" data-track-index="0"><span><b>masada</b> duran sigara kutusu ve kül tablası ise</span></div>
<div id="cap-090" class="cap clip" data-start="204.101" data-duration="1.387" data-track-index="0"><span>kuyumcu eşyasıdır.</span></div>
<div id="cap-091" class="cap clip" data-start="205.488" data-duration="1.133" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-092" class="cap clip" data-start="206.621" data-duration="1.933" data-track-index="0"><span>Adi metalden sigara tabakası,</span></div>
<div id="cap-093" class="cap clip" data-start="208.554" data-duration="2.32" data-track-index="0"><span>taklit mücevherci eşyası sayılmaz;</span></div>
<div id="cap-094" class="cap clip" data-start="210.874" data-duration="3.507" data-track-index="0"><span>taklit mücevher yalnız küçük süs eşyasını kapsar.</span></div>
<div id="cap-095" class="cap clip" data-start="214.381" data-duration="1.8" data-track-index="0"><span>Gümrükçü Baba&#x27;nın kısa yolu:</span></div>
<div id="cap-096" class="cap clip" data-start="216.181" data-duration="1.657" data-track-index="0"><span>Cepte mi, <b>masada</b> mı?</span></div>
<div id="cap-097" class="cap clip" data-start="218.588" data-duration="1.25" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-098" class="cap clip" data-start="219.868" data-duration="2.84" data-track-index="0"><span>Bir yolcu limanında, kruvaziyer gemilere biniş</span></div>
<div id="cap-099" class="cap clip" data-start="222.708" data-duration="2.84" data-track-index="0"><span>için kullanılan, teleskopik hareketli bir tünelden</span></div>
<div id="cap-100" class="cap clip" data-start="225.548" data-duration="3.28" data-track-index="0"><span>oluşan yolcu biniş köprüsü hangi tarife pozisyonunda</span></div>
<div id="cap-101" class="cap clip" data-start="228.828" data-duration="1.33" data-track-index="0"><span>sınıflandırılır?</span></div>
<div id="cap-102" class="cap clip" data-start="230.188" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-103" class="cap clip" data-start="231.068" data-duration="1.73" data-track-index="0"><span><b>84.26</b>.</span></div>
<div id="cap-104" class="cap clip" data-start="232.828" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-105" class="cap clip" data-start="233.708" data-duration="1.73" data-track-index="0"><span><b>73.08</b>.</span></div>
<div id="cap-106" class="cap clip" data-start="235.468" data-duration="0.88" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-107" class="cap clip" data-start="236.348" data-duration="1.92" data-track-index="0"><span><b>84.28</b>.</span></div>
<div id="cap-108" class="cap clip" data-start="238.268" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-109" class="cap clip" data-start="239.148" data-duration="1.92" data-track-index="0"><span><b>84.79</b>.</span></div>
<div id="cap-110" class="cap clip" data-start="241.068" data-duration="0.8" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-111" class="cap clip" data-start="241.868" data-duration="1.53" data-track-index="0"><span><b>89.07</b>.</span></div>
<div id="cap-112" class="cap clip" data-start="244.268" data-duration="1.737" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-113" class="cap clip" data-start="250.355" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-114" class="cap clip" data-start="251.235" data-duration="0.89" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-115" class="cap clip" data-start="252.275" data-duration="2.96" data-track-index="0"><span>Yolcu biniş köprüsü, yolcuyu bir tünel içinden</span></div>
<div id="cap-116" class="cap clip" data-start="255.235" data-duration="1.76" data-track-index="0"><span>gemiye ya da uçağa ulaştıran,</span></div>
<div id="cap-117" class="cap clip" data-start="256.995" data-duration="1.45" data-track-index="0"><span>hareketli bir makinedir.</span></div>
<div id="cap-118" class="cap clip" data-start="258.595" data-duration="2.96" data-track-index="0"><span><b>Kendine özgü</b> bir işlevi vardır ve başka bir pozisyonda</span></div>
<div id="cap-119" class="cap clip" data-start="261.555" data-duration="1.16" data-track-index="0"><span>belirtilmemiştir;</span></div>
<div id="cap-120" class="cap clip" data-start="262.715" data-duration="2.6" data-track-index="0"><span>bu yüzden <b>84.79</b>&#x27;da yer alır.</span></div>
<div id="cap-121" class="cap clip" data-start="265.315" data-duration="2.72" data-track-index="0"><span>Armonize Sistem bunlara ayrı alt pozisyonlar da</span></div>
<div id="cap-122" class="cap clip" data-start="268.035" data-duration="0.72" data-track-index="0"><span>açar:</span></div>
<div id="cap-123" class="cap clip" data-start="268.755" data-duration="3.69" data-track-index="0"><span>Havalimanında kullanılanlar <b>8479.71</b>&#x27;de,</span></div>
<div id="cap-124" class="cap clip" data-start="272.515" data-duration="4.996" data-track-index="0"><span>limanda kullanılanlar gibi diğerleri ise <b>8479.79</b>&#x27;dadır.</span></div>
<div id="cap-125" class="cap clip" data-start="278.341" data-duration="1.44" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-126" class="cap clip" data-start="279.781" data-duration="3.36" data-track-index="0"><span>Yardımcımız, adı köprü diye B şıkkını,</span></div>
<div id="cap-127" class="cap clip" data-start="283.141" data-duration="1.92" data-track-index="0"><span><b>73.08</b>&#x27;i seçti.</span></div>
<div id="cap-128" class="cap clip" data-start="285.061" data-duration="0.88" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-129" class="cap clip" data-start="285.941" data-duration="3.6" data-track-index="0"><span><b>73.08</b>, sabit çelik köprüler gibi <b>inşaat aksamı</b></span></div>
<div id="cap-130" class="cap clip" data-start="289.541" data-duration="0.8" data-track-index="0"><span>içindir;</span></div>
<div id="cap-131" class="cap clip" data-start="290.341" data-duration="2.8" data-track-index="0"><span>hareketli, makine niteliğindeki biniş köprüsü</span></div>
