<div id="cap-001" class="cap clip" data-start="1.68" data-duration="3.2" data-track-index="0"><span>Merhaba arkadaşlar, Gümrük Koçu&#x27;yla tarife derslerinin</span></div>
<div id="cap-002" class="cap clip" data-start="4.88" data-duration="1.92" data-track-index="0"><span><b>17</b>&#x27;ncisine hoş geldiniz.</span></div>
<div id="cap-003" class="cap clip" data-start="6.8" data-duration="1.4" data-track-index="0"><span>Bugün <b>3</b> soru var:</span></div>
<div id="cap-004" class="cap clip" data-start="8.2" data-duration="3.12" data-track-index="0"><span>hint yağı, porselen bebek ve pozisyon sırası.</span></div>
<div id="cap-005" class="cap clip" data-start="11.32" data-duration="1.0" data-track-index="0"><span>Ekip hazır:</span></div>
<div id="cap-006" class="cap clip" data-start="12.32" data-duration="3.24" data-track-index="0"><span>Stajyer, Yardımcı, Gümrükçü Baba ve Cano.</span></div>
<div id="cap-007" class="cap clip" data-start="15.56" data-duration="2.251" data-track-index="0"><span>Kâğıt kalem hazırsa, başlayalım.</span></div>
<div id="cap-008" class="cap clip" data-start="18.561" data-duration="1.25" data-track-index="0"><span>Birinci soru.</span></div>
<div id="cap-009" class="cap clip" data-start="19.841" data-duration="2.88" data-track-index="0"><span>Sülfürik asitle muamele edilerek sülfonlanmış</span></div>
<div id="cap-010" class="cap clip" data-start="22.721" data-duration="2.49" data-track-index="0"><span>hint yağı, yani Türk kırmızısı yağı,</span></div>
<div id="cap-011" class="cap clip" data-start="25.281" data-duration="2.77" data-track-index="0"><span>hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-012" class="cap clip" data-start="28.081" data-duration="0.81" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-013" class="cap clip" data-start="28.961" data-duration="1.44" data-track-index="0"><span><b>15.15</b>.</span></div>
<div id="cap-014" class="cap clip" data-start="30.401" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-015" class="cap clip" data-start="31.281" data-duration="1.56" data-track-index="0"><span><b>15.16</b>.</span></div>
<div id="cap-016" class="cap clip" data-start="32.841" data-duration="0.85" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-017" class="cap clip" data-start="33.761" data-duration="1.6" data-track-index="0"><span><b>15.18</b>.</span></div>
<div id="cap-018" class="cap clip" data-start="35.361" data-duration="0.88" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-019" class="cap clip" data-start="36.241" data-duration="1.6" data-track-index="0"><span><b>34.02</b>.</span></div>
<div id="cap-020" class="cap clip" data-start="37.841" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-021" class="cap clip" data-start="38.721" data-duration="2.16" data-track-index="0"><span><b>38.23</b>.</span></div>
<div id="cap-022" class="cap clip" data-start="40.881" data-duration="1.884" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-023" class="cap clip" data-start="47.115" data-duration="0.73" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-024" class="cap clip" data-start="47.915" data-duration="0.89" data-track-index="0"><span><b>D şıkkı</b>.</span></div>
<div id="cap-025" class="cap clip" data-start="48.955" data-duration="2.8" data-track-index="0"><span>Hint yağının kendisi bitkisel bir sabit yağdır</span></div>
<div id="cap-026" class="cap clip" data-start="51.755" data-duration="1.84" data-track-index="0"><span>ve <b>15.15</b>&#x27;te yer alır.</span></div>
<div id="cap-027" class="cap clip" data-start="53.595" data-duration="3.12" data-track-index="0"><span>Ama sülfürik asitle muamele edilip sülfonlanınca</span></div>
<div id="cap-028" class="cap clip" data-start="56.715" data-duration="2.16" data-track-index="0"><span><b>yüzey aktif</b> bir maddeye dönüşür.</span></div>
<div id="cap-029" class="cap clip" data-start="58.875" data-duration="3.24" data-track-index="0"><span><b>15</b>. faslın birinci notu <b>sülfonatlı yağları</b> bu</span></div>
<div id="cap-030" class="cap clip" data-start="62.115" data-duration="1.4" data-track-index="0"><span>fasıl dışında bırakır;</span></div>
<div id="cap-031" class="cap clip" data-start="63.515" data-duration="3.2" data-track-index="0"><span><b>15.18</b>&#x27;in açıklama notu da sülfonlanmış yağları</span></div>
<div id="cap-032" class="cap clip" data-start="66.715" data-duration="2.64" data-track-index="0"><span><b>adıyla</b> <b>34.02</b>&#x27;ye gönderir.</span></div>
<div id="cap-033" class="cap clip" data-start="69.355" data-duration="1.12" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-034" class="cap clip" data-start="70.475" data-duration="1.48" data-track-index="0"><span><b>34.02</b>.</span></div>
<div id="cap-035" class="cap clip" data-start="71.955" data-duration="2.92" data-track-index="0"><span>Sülfonlama yağı kimyasal olarak değiştirdiği için</span></div>
<div id="cap-036" class="cap clip" data-start="74.875" data-duration="1.76" data-track-index="0"><span>artık sıradan bir yağ değil,</span></div>
<div id="cap-037" class="cap clip" data-start="76.635" data-duration="1.737" data-track-index="0"><span><b>yüzey aktif</b> maddedir.</span></div>
<div id="cap-038" class="cap clip" data-start="79.202" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-039" class="cap clip" data-start="80.722" data-duration="3.88" data-track-index="0"><span>Yardımcımız, <b>15.18</b>&#x27;in metninde kükürtlenmiş yağlar</span></div>
<div id="cap-040" class="cap clip" data-start="84.602" data-duration="2.28" data-track-index="0"><span>yazıyor diye C şıkkını seçti.</span></div>
<div id="cap-041" class="cap clip" data-start="86.882" data-duration="0.8" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-042" class="cap clip" data-start="87.682" data-duration="2.88" data-track-index="0"><span>Kükürtlenmiş yağ ile sülfonlanmış yağ aynı şey</span></div>
<div id="cap-043" class="cap clip" data-start="90.562" data-duration="0.88" data-track-index="0"><span>değildir.</span></div>
<div id="cap-044" class="cap clip" data-start="91.442" data-duration="3.2" data-track-index="0"><span>Sülfonlanmış yağlar <b>15.18</b>&#x27;in açıklama notunda</span></div>
<div id="cap-045" class="cap clip" data-start="94.642" data-duration="3.68" data-track-index="0"><span>açıkça hariç tutulur ve <b>34.02</b>&#x27;ye gönderilir.</span></div>
<div id="cap-046" class="cap clip" data-start="98.322" data-duration="0.97" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-047" class="cap clip" data-start="99.362" data-duration="3.44" data-track-index="0"><span>Hint yağı hiçbir işlem görmeden gelirse <b>15.15</b>&#x27;te</span></div>
<div id="cap-048" class="cap clip" data-start="102.802" data-duration="0.57" data-track-index="0"><span>kalır.</span></div>
<div id="cap-049" class="cap clip" data-start="103.442" data-duration="0.8" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-050" class="cap clip" data-start="104.242" data-duration="2.454" data-track-index="0"><span>Sülfonlandıysa <b>artık yağ değil</b>.</span></div>
<div id="cap-051" class="cap clip" data-start="107.446" data-duration="0.8" data-track-index="0"><span>İkinci soru.</span></div>
<div id="cap-052" class="cap clip" data-start="108.246" data-duration="2.4" data-track-index="0"><span>Çocukların oynaması için değil,</span></div>
<div id="cap-053" class="cap clip" data-start="110.646" data-duration="2.96" data-track-index="0"><span>süs amacıyla yapılmış, giydirilmiş porselen salon</span></div>
<div id="cap-054" class="cap clip" data-start="113.606" data-duration="3.2" data-track-index="0"><span>bebeği hangi tarife pozisyonunda sınıflandırılır?</span></div>
<div id="cap-055" class="cap clip" data-start="116.806" data-duration="0.88" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-056" class="cap clip" data-start="117.686" data-duration="1.76" data-track-index="0"><span><b>69.11</b>.</span></div>
<div id="cap-057" class="cap clip" data-start="119.446" data-duration="0.88" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-058" class="cap clip" data-start="120.326" data-duration="1.76" data-track-index="0"><span><b>69.13</b>.</span></div>
<div id="cap-059" class="cap clip" data-start="122.086" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-060" class="cap clip" data-start="123.046" data-duration="1.76" data-track-index="0"><span><b>95.03</b>.</span></div>
<div id="cap-061" class="cap clip" data-start="124.806" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-062" class="cap clip" data-start="125.766" data-duration="1.84" data-track-index="0"><span><b>96.18</b>.</span></div>
<div id="cap-063" class="cap clip" data-start="127.606" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-064" class="cap clip" data-start="128.486" data-duration="2.08" data-track-index="0"><span><b>97.03</b>.</span></div>
<div id="cap-065" class="cap clip" data-start="130.566" data-duration="1.894" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-066" class="cap clip" data-start="136.81" data-duration="0.88" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-067" class="cap clip" data-start="137.69" data-duration="1.04" data-track-index="0"><span><b>C şıkkı</b>.</span></div>
<div id="cap-068" class="cap clip" data-start="138.73" data-duration="3.12" data-track-index="0"><span>Porselenden yapılmış bir süs eşyası ilk bakışta</span></div>
<div id="cap-069" class="cap clip" data-start="141.85" data-duration="2.0" data-track-index="0"><span><b>69.13</b>&#x27;ü düşündürür.</span></div>
<div id="cap-070" class="cap clip" data-start="143.85" data-duration="2.57" data-track-index="0"><span>Ama <b>95.03</b>&#x27;ün açıklama notu,</span></div>
<div id="cap-071" class="cap clip" data-start="146.49" data-duration="2.72" data-track-index="0"><span>yalnızca çocukların eğlenmesine mahsus bebekleri</span></div>
<div id="cap-072" class="cap clip" data-start="149.21" data-duration="2.96" data-track-index="0"><span>değil, <b>salon bebekleri</b> ve maskot bebekler gibi</span></div>
<div id="cap-073" class="cap clip" data-start="152.17" data-duration="2.6" data-track-index="0"><span><b>dekoratif amaçlı</b> yapma bebekleri de bu pozisyona</span></div>

<div id="cap-075" class="cap clip" data-start="155.37" data-duration="2.73" data-track-index="0"><span>bebeklerin seramikten yapılabileceğini de söyler.</span></div>
<div id="cap-076" class="cap clip" data-start="158.25" data-duration="4.08" data-track-index="0"><span><b>69</b>. faslın ikinci notu da <b>95</b>. fasıldaki eşyayı</span></div>
<div id="cap-077" class="cap clip" data-start="162.33" data-duration="1.6" data-track-index="0"><span>bu fasıl dışında bırakır.</span></div>
<div id="cap-078" class="cap clip" data-start="163.93" data-duration="1.08" data-track-index="0"><span>Doğru pozisyon:</span></div>
<div id="cap-079" class="cap clip" data-start="165.01" data-duration="1.48" data-track-index="0"><span><b>95.03</b>.</span></div>
<div id="cap-080" class="cap clip" data-start="166.49" data-duration="3.092" data-track-index="0"><span>Vitrin mankenleri ise <b>96.18</b>&#x27;dedir.</span></div>
<div id="cap-081" class="cap clip" data-start="170.412" data-duration="1.49" data-track-index="0"><span>Tuzak nerede?</span></div>
<div id="cap-082" class="cap clip" data-start="171.932" data-duration="3.24" data-track-index="0"><span>Cano, çocuk oynamıyor, o hâlde oyuncak değil,</span></div>
<div id="cap-083" class="cap clip" data-start="175.172" data-duration="2.88" data-track-index="0"><span>porselen bir süs eşyasıdır diye B şıkkını,</span></div>
<div id="cap-084" class="cap clip" data-start="178.052" data-duration="1.76" data-track-index="0"><span><b>69.13</b>&#x27;ü seçti.</span></div>
<div id="cap-085" class="cap clip" data-start="179.812" data-duration="0.64" data-track-index="0"><span><b>Hayır!</b></span></div>
<div id="cap-086" class="cap clip" data-start="180.452" data-duration="3.92" data-track-index="0"><span><b>95.03</b>, <b>dekoratif amaçlı</b> salon bebeklerini de kapsar;</span></div>
<div id="cap-087" class="cap clip" data-start="184.372" data-duration="2.627" data-track-index="0"><span>bebek seramikten de olsa bu pozisyondadır.</span></div>
<div id="cap-088" class="cap clip" data-start="186.999" data-duration="0.986" data-track-index="0"><span>Bir de <b>dikkat:</b></span></div>
<div id="cap-089" class="cap clip" data-start="187.985" data-duration="3.187" data-track-index="0"><span>Bebek değil de seramikten bir hayvan biblosu olsaydı,</span></div>
<div id="cap-090" class="cap clip" data-start="191.172" data-duration="2.0" data-track-index="0"><span>o zaman <b>69.13</b>&#x27;e giderdi.</span></div>
<div id="cap-091" class="cap clip" data-start="193.172" data-duration="0.8" data-track-index="0"><span>Kısa yol:</span></div>
<div id="cap-092" class="cap clip" data-start="193.972" data-duration="2.968" data-track-index="0"><span><b>Bebekse</b> <b>95</b>, <b>biblosa</b> <b>69</b>.</span></div>
<div id="cap-093" class="cap clip" data-start="197.69" data-duration="1.12" data-track-index="0"><span>Üçüncü soru.</span></div>
<div id="cap-094" class="cap clip" data-start="198.81" data-duration="2.6" data-track-index="0"><span>Aşağıdakilerden hangisinde eşyalar,</span></div>
<div id="cap-095" class="cap clip" data-start="201.41" data-duration="2.6" data-track-index="0"><span>tarife cetvelindeki pozisyon numaralarına göre</span></div>
<div id="cap-096" class="cap clip" data-start="204.01" data-duration="2.57" data-track-index="0"><span>küçükten büyüğe doğru sıralanmıştır?</span></div>
<div id="cap-097" class="cap clip" data-start="206.65" data-duration="0.81" data-track-index="0"><span>A şıkkı:</span></div>
<div id="cap-098" class="cap clip" data-start="207.61" data-duration="2.96" data-track-index="0"><span>Bambu yemek çubuğu, şekerli kondanse süt,</span></div>

<div id="cap-100" class="cap clip" data-start="212.65" data-duration="1.65" data-track-index="0"><span>para sayma makinesi.</span></div>
<div id="cap-101" class="cap clip" data-start="214.33" data-duration="0.96" data-track-index="0"><span>B şıkkı:</span></div>
<div id="cap-102" class="cap clip" data-start="215.29" data-duration="2.88" data-track-index="0"><span>Şekerli kondanse süt, bambu yemek çubuğu,</span></div>
<div id="cap-103" class="cap clip" data-start="218.17" data-duration="2.0" data-track-index="0"><span>ayakla çalışan bisiklet pompası,</span></div>
<div id="cap-104" class="cap clip" data-start="220.17" data-duration="1.65" data-track-index="0"><span>para sayma makinesi.</span></div>
<div id="cap-105" class="cap clip" data-start="221.85" data-duration="0.96" data-track-index="0"><span>C şıkkı:</span></div>
<div id="cap-106" class="cap clip" data-start="222.81" data-duration="2.72" data-track-index="0"><span>Şekerli kondanse süt, bambu yemek çubuğu,</span></div>
<div id="cap-107" class="cap clip" data-start="225.53" data-duration="3.68" data-track-index="0"><span>para sayma makinesi, ayakla çalışan bisiklet pompası.</span></div>
<div id="cap-108" class="cap clip" data-start="229.21" data-duration="0.96" data-track-index="0"><span>D şıkkı:</span></div>
<div id="cap-109" class="cap clip" data-start="230.17" data-duration="2.8" data-track-index="0"><span>Şekerli kondanse süt, ayakla çalışan bisiklet</span></div>
<div id="cap-110" class="cap clip" data-start="232.97" data-duration="2.12" data-track-index="0"><span>pompası, bambu yemek çubuğu,</span></div>
<div id="cap-111" class="cap clip" data-start="235.09" data-duration="1.56" data-track-index="0"><span>para sayma makinesi.</span></div>
<div id="cap-112" class="cap clip" data-start="236.65" data-duration="0.88" data-track-index="0"><span>E şıkkı:</span></div>
<div id="cap-113" class="cap clip" data-start="237.53" data-duration="2.84" data-track-index="0"><span>Para sayma makinesi, şekerli kondanse süt,</span></div>
<div id="cap-114" class="cap clip" data-start="240.37" data-duration="3.277" data-track-index="0"><span>bambu yemek çubuğu, ayakla çalışan bisiklet pompası.</span></div>
<div id="cap-115" class="cap clip" data-start="244.17" data-duration="1.809" data-track-index="0"><span><b>3</b> saniye, düşünün!</span></div>
<div id="cap-116" class="cap clip" data-start="250.329" data-duration="0.8" data-track-index="0"><span>Cevap:</span></div>
<div id="cap-117" class="cap clip" data-start="251.129" data-duration="1.0" data-track-index="0"><span><b>B şıkkı</b>.</span></div>
<div id="cap-118" class="cap clip" data-start="252.129" data-duration="3.16" data-track-index="0"><span>Şekerli kondanse süt, konsantre edilmiş ve şeker</span></div>

<div id="cap-120" class="cap clip" data-start="258.329" data-duration="1.6" data-track-index="0"><span>Bambudan yemek çubukları,</span></div>
<div id="cap-121" class="cap clip" data-start="259.929" data-duration="3.76" data-track-index="0"><span><b>44.19</b>&#x27;da Çin usulü yemek çubukları <b>adıyla</b> geçer.</span></div>
<div id="cap-122" class="cap clip" data-start="263.689" data-duration="3.28" data-track-index="0"><span>Ayakla çalışan bisiklet pompası bir <b>hava pompasıdır</b>:</span></div>

<div id="cap-124" class="cap clip" data-start="268.369" data-duration="4.52" data-track-index="0"><span>Para sayma makinesi ise <b>büro makinesi</b> olarak <b>84.72</b>&#x27;dedir.</span></div>

<div id="cap-127" class="cap clip" data-start="278.32" data-duration="3.44" data-track-index="0"><span>Stajyerimiz, bisiklet pompası bisiklet aksesuarıdır,</span></div>

<div id="cap-130" class="cap clip" data-start="286.6" data-duration="0.84" data-track-index="0"><span><b>Hayır!</b></span></div>
