    BARS.forEach((b, i) => {
      const v = speaking ? 0.3 + 0.7 * Math.abs(Math.sin(t * (9 + i * 2.3) + i * 1.3)) * Math.max(0.35, 1 - since / 0.5) : 0.15;
      b.style.transform = `scaleY(${v.toFixed(3)})`;
    });
  } }, 0);

  window.__timelines["presenter"] = tl;
})();
      </script>
    </template>
