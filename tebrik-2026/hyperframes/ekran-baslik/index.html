<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=750" />
    <title>Ekran Başlık</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 750px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="11.13"
      data-fps="30"
      data-width="1280"
      data-height="750"
    >
      <div
        id="el-ekran-baslik"
        data-composition-id="ekran-baslik"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="11.13"
        data-track-index="0"
        data-width="1280"
        data-height="750"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
